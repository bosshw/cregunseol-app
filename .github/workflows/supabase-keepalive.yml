# 서버 깨워두기
#
# 무료 Supabase 프로젝트는 일주일 조용하면 정지됩니다.
# 예전에는 정지돼도 앱이 폰 안에서 돌아 티가 안 났지만,
# v1.3부터는 사진이 서버에 있어서 정지되면 사진이 통째로 안 보입니다.
#
# 그래서 하루 한 번 가벼운 조회를 한 번 날려 "활동 중"으로 잡히게 합니다.
# 여기 적힌 키는 앱 안에도 들어 있는 publishable key 라 공개돼도 안전합니다.
# ⚠️ service_role(sb_secret_) 키는 절대 여기 넣지 마세요.

name: 서버 깨워두기

on:
  schedule:
    - cron: '17 3 * * *'      # 매일 낮 12시 17분 (KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 한 번 건드리기
        run: |
          URL="https://yginjnqwwvsvhysboiqv.supabase.co"
          KEY="sb_publishable_FXQ8f-T6LdImrKUWFvW8jw_6_1IJ7AI"
          for i in 1 2 3; do
            CODE=$(curl -s -m 20 -o /tmp/out -w "%{http_code}" \
              "$URL/rest/v1/cg_public?select=code&limit=1" -H "apikey: $KEY" || echo "000")
            echo "$i번째 시도 → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "서버가 깨어 있습니다."
              exit 0
            fi
            cat /tmp/out || true
            echo
            sleep 15
          done
          echo "::error::서버가 응답하지 않습니다. Supabase 프로젝트가 정지됐는지 확인해 주세요."
          echo "정지됐다면 supabase.com 에서 프로젝트를 열고 Restore 를 누르면 됩니다."
          exit 1
