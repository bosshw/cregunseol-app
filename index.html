}
// 개체에 붙은 분양가(원). 개체 필드 → 분양 기록 순으로 찾습니다
function salePriceOf(ind) {
  if (!ind) return 0;
  const own = Number(ind.salePrice || 0);
  if (own > 0) return own;
  const ev = DB.getEventsFor(ind.id).filter(e => e.type === 'distribution' && e.data && Number(e.data.price) > 0)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  return ev ? Number(ev.data.price) : 0;
}

/* 목록 정렬 — 지금까지는 등록순 고정이었습니다 */
const SORTS = {
  recent:   { label: '최근 기록순', fn: (a, b) => (lastTouch(b) || '').localeCompare(lastTouch(a) || '') },
  name:     { label: '이름순',     fn: (a, b) => (a.name || '').localeCompare(b.name || '', 'ko') },
  young:    { label: '어린 순',    fn: (a, b) => (b.hatchDate || '0').localeCompare(a.hatchDate || '0') },
  added:    { label: '등록순',     fn: () => 0 },
};
const SORT_DEFAULT = 'added';
function lastTouch(ind) {
  const evs = DB.getEventsFor(ind.id);
  let best = '';
  evs.forEach(e => { const d = e.date || ''; if (d > best) best = d; });
  return best || ind.hatchDate || '';
}
// 정렬 적용 — 즐겨찾기·KEEP은 항상 위로 올립니다
function sortList(list, key, pinTop) {
  const s = SORTS[key] || SORTS[SORT_DEFAULT];
  const rank = i => (pinTop === false ? 0 : ((i.favorite ? -2 : 0) + (i.keep ? -1 : 0)));
  return [...list].map((v, i) => [v, i]).sort((x, y) => {
    const r = rank(x[0]) - rank(y[0]);
    if (r) return r;
    const c = s.fn(x[0], y[0]);
    if (c) return c;
    return x[1] - y[1];              // 같으면 원래 순서 유지
  }).map(p => p[0]);
}

/* 캘린더에 띄울 종류 — 날짜가 의미 있는 "일정"만.
   메모·사진·성장(무게)·탈피는 개체 프로필의 활동 기록에서 봅니다. */
const CALENDAR_TYPES = ['mating', 'laying', 'hatching', 'feeding'];

// 예정일 자동 계산 기준 (일)
const LAYING_AFTER_MATING = 30;   // 메이팅 → 산란 예정
const LAYING_INTERVAL = 30;       // 산란 → 다음 산란 (보통 3~5주 간격)
const HATCH_AFTER_LAYING = 75;    // 기본값(24°C 기준). 실제 계산은 hatchDays() 사용

/* 인큐베이팅 온도 → 부화까지 걸리는 날수
   크레스티드 게코는 22~26°C에서 60~90일. 온도가 낮을수록 길어집니다.
   22°C=90일 · 24°C=75일 · 26°C=60일 (1도당 약 7.5일)
   28°C를 넘으면 알이 상할 수 있어 상한을 둡니다. */
const INCUBATE_MIN = 18, INCUBATE_MAX = 28, INCUBATE_DEFAULT = 24;
function hatchDays(temp) {
  const t = Math.min(INCUBATE_MAX, Math.max(INCUBATE_MIN, Number(temp) || INCUBATE_DEFAULT));
  return Math.min(130, Math.max(50, Math.round(90 - (t - 22) * 7.5)));
}
function incubateTemp() {
  const v = Number((DB.getSettings() || {}).incubateTemp);
  return v >= INCUBATE_MIN && v <= INCUBATE_MAX ? v : INCUBATE_DEFAULT;
}
const hatchDaysNow = () => hatchDays(incubateTemp());
// 산란일 + 부화일수 = 부화 예정일
const hatchETA = (layDate) => localISO(new Date(new Date(layDate).getTime() + hatchDaysNow() * 86400000));

/* ── 알(클러치) 목록을 한 곳에서 계산합니다 ──
   산란 기록마다 엄마·아빠·이 짝의 몇 차 산란인지·부화 예정일·상태를 붙여 돌려줍니다.
   ★ 부화 예정일은 저장하지 않고 "늘 지금 온도로" 다시 계산합니다.
     그래서 설정에서 인큐 온도를 바꾸면 산란기록·알림·캘린더가 한꺼번에 따라 바뀝니다.
   결과는 산란일 오래된 순입니다(몇 차인지 세려면 이 순서여야 합니다). */
function clutchRows(individuals, events) {
  const inds = individuals || DB.getIndividuals();
  const evs = events || DB.getEvents();
  const byId = {}; inds.forEach(i => { byId[i.id] = i; });
  const matings = evs.filter(e => e.type === 'mating').sort((a, b) => (a.date < b.date ? 1 : -1));
  const hatchings = evs.filter(e => e.type === 'hatching');
  const lays = evs.filter(e => e.type === 'laying').sort((a, b) => (a.date > b.date ? 1 : -1));

  /* ── 부화 기록·아기를 산란에 "하나씩만" 배정합니다 ──
     예전에는 같은 부화 기록이 1차·2차에 동시에 붙어서
     같은 아기가 두 번 나오고 뒤쪽 클러치는 비어 보였습니다. */
  const usedH = new Set(), hatchOf = {};
  // (1) layingId로 직접 연결된 것이 최우선
  lays.forEach(e => {
    const h = hatchings.find(x => x.data && x.data.layingId === e.id && !usedH.has(x.id));
    if (h) { hatchOf[e.id] = h; usedH.add(h.id); }
  });
  // (2) 연결이 없는 예전 기록은 오래된 산란부터 가장 이른 부화를 가져갑니다
  lays.forEach(e => {
    if (hatchOf[e.id]) return;
    const eta = hatchETA(e.date);
    const cand = hatchings
      .filter(h => !usedH.has(h.id) && !(h.data && h.data.layingId)
        && h.individualId === e.individualId && h.date >= e.date
        && Math.abs((new Date(h.date) - new Date(eta)) / 86400000) <= 45)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    if (cand[0]) { hatchOf[e.id] = cand[0]; usedH.add(cand[0].id); }
  });

  const usedB = new Set(), babiesOf = {};
  const kidsOfMom = {};
  inds.forEach(i => {
    if (!i.damId || !i.hatchDate) return;
    (kidsOfMom[i.damId] = kidsOfMom[i.damId] || []).push(i);
  });
  Object.values(kidsOfMom).forEach(list => list.sort((a, b) => (a.createdAt || '') < (b.createdAt || '') ? -1 : 1));
  lays.forEach(e => {
    const kids = kidsOfMom[e.individualId] || [];
    const h = hatchOf[e.id];
    let day = h ? h.date : null;
    if (!day) {
      // 부화 기록은 없는데 아기만 등록된 경우 — 예정일 근처에 태어난 아이를 찾아 붙입니다
      const eta = hatchETA(e.date);
      const near = kids.filter(i => !usedB.has(i.id) && i.hatchDate >= e.date
        && Math.abs((new Date(i.hatchDate) - new Date(eta)) / 86400000) <= 45)
        .sort((a, b) => (a.hatchDate < b.hatchDate ? -1 : 1));
      day = near.length ? near[0].hatchDate : null;
    }
    if (!day) { babiesOf[e.id] = []; return; }
    let list = kids.filter(i => !usedB.has(i.id) && i.hatchDate === day);
    const cap = Number((h && h.data && h.data.count) || 0);
    if (cap > 0 && list.length > cap) list = list.slice(0, cap);
    list.forEach(i => usedB.add(i.id));
    babiesOf[e.id] = list;
  });

  const seq = {};
  return lays.map(e => {
    const mom = byId[e.individualId] || null;
    const momName = mom ? mom.name : '(삭제된 개체)';
    const m = matings.find(x => x.individualId === e.individualId && x.date <= e.date);
    const dadId = (e.data && e.data.sireId) || (m && m.data && m.data.partnerId) || null;
    const dad = byId[dadId] || null;
    const dadName = (dad && dad.name) || (e.data && e.data.sireName) || (m && m.data && m.data.partnerName) || null;
    const pairKey = e.individualId + '|' + (dadName || '?');
    seq[pairKey] = (seq[pairKey] || 0) + 1;
    const nth = seq[pairKey];
    const pairName = momName + (dadName ? ' × ' + dadName : '');
    const notes = (e.data && e.data.notes) || '';
    const eggs = (e.data && e.data.eggCount) || 0;
    const etaISO = hatchETA(e.date);
    const d = daysUntil(etaISO);
    const infertile = /무정/.test(notes);
    const hatched = hatchOf[e.id] || null;
    const babies = babiesOf[e.id] || [];
    let state = `D-${d}`, tone = d <= 7 ? '#B3261E' : 'var(--accent2)';
    if (infertile) { state = '무정'; tone = '#8A8177'; }
    else if (hatched) { state = '부화완료'; tone = '#2E7D46'; }
    else if (d < -14) { state = '경과'; tone = '#8A8177'; }
    else if (d < 0) { state = `지연 ${-d}일`; tone = '#C87F2F'; }
    else if (d === 0) { state = '오늘 예정'; tone = '#B3261E'; }
    const waiting = !infertile && !hatched && d >= -14;
    return { e, mom, momName, dad, dadId, dadName, pairKey, pairName, nth,
             eggs, notes, etaISO, expISO: etaISO, d, state, tone, infertile, hatched, babies, waiting };
  });
}

/* ── 산란 주기 학습 ──
   암컷마다 산란 간격이 다르므로, 그 아이가 실제로 낳은 간격을 보고 다음을 추정합니다.
   기록이 없으면 다른 암컷들의 평균을, 그것도 없으면 기본값(30일)을 씁니다. */
const median = (arr) => {
  if (!arr.length) return null;
  const a = [...arr].sort((x, y) => x - y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
};
function layingGaps(layDates) {
  const ds = [...layDates].sort();
  const gaps = [];
  for (let i = 1; i < ds.length; i++) {
    const g = Math.round((new Date(ds[i]) - new Date(ds[i - 1])) / 86400000);
    if (g >= 14 && g <= 90) gaps.push(g);   // 휴지기를 건너뛴 간격은 평균에서 뺍니다
  }
  return gaps;
}
/* 암컷별 다음 산란 예정 — 저장하지 않고 매번 계산합니다(기록이 쌓이면 저절로 정확해집니다) */
function layingForecasts(individuals, events) {
  const inds = individuals || DB.getIndividuals();
  const evs = events || DB.getEvents();
  const byId = {}; inds.forEach(i => { byId[i.id] = i; });
  const laysBy = {}, matesBy = {};
  evs.forEach(e => {
    if (e.type === 'laying') (laysBy[e.individualId] = laysBy[e.individualId] || []).push(e);
    if (e.type === 'mating') (matesBy[e.individualId] = matesBy[e.individualId] || []).push(e);
  });
  // 전체 평균(다른 암컷들의 간격) — 처음 낳는 아이에게 씁니다
  const allGaps = [];
  Object.values(laysBy).forEach(ls => allGaps.push(...layingGaps(ls.map(e => e.date))));
  const herdAvg = median(allGaps);

  const out = [];
  inds.forEach(i => {
    if ((i.status || 'own') === 'sold' || i.isExternal) return;
    const ls = (laysBy[i.id] || []).slice().sort((a, b) => (a.date > b.date ? 1 : -1));
    const ms = (matesBy[i.id] || []).slice().sort((a, b) => (a.date > b.date ? 1 : -1));
    if (!ls.length && !ms.length) return;
    if (i.gender === 'male') return;                       // 수컷은 제외 (미구분은 기록이 있으면 포함)
    let base, interval, basis;
    const own = layingGaps(ls.map(e => e.date));
    if (ls.length) {
      base = ls[ls.length - 1].date;
      if (own.length) { interval = median(own); basis = `본인 ${own.length + 1}회 기록 평균`; }
      else if (herdAvg) { interval = herdAvg; basis = '다른 아이들 평균'; }
      else { interval = LAYING_INTERVAL; basis = '기본값'; }
    } else {
      base = ms[ms.length - 1].date;
      interval = LAYING_AFTER_MATING; basis = '메이팅 기준';
    }
    const eta = localISO(new Date(new Date(base).getTime() + interval * 86400000));
    if (daysUntil(eta) < -21) return;                      // 너무 오래 지난 추정은 의미가 없습니다
    const lastMate = ms.length ? ms[ms.length - 1] : null;
    const dadName = (lastMate && lastMate.data && lastMate.data.partnerName)
      || ((byId[(lastMate && lastMate.data && lastMate.data.partnerId)] || {}).name) || null;
    out.push({
      indId: i.id, name: i.name, pairName: i.name + (dadName ? ' × ' + dadName : ''),
      eta, interval, basis, count: ls.length, lastLay: ls.length ? ls[ls.length - 1].date : null,
    });
  });
  return out;
}

/* 화면에 띄울 알림 = 사용자가 직접 만든 알림 + 계산으로 만든 부화·산란 예정
   예정일은 저장하지 않습니다(온도·기록이 바뀌면 바로 따라오게). */
function allAlerts() {
  const stored = DB.getReminders().filter(r => r.type !== 'hatching_expected' && r.type !== 'laying_expected');
  const hatch = clutchRows().filter(r => r.waiting).map(r => ({
    id: 'H:' + r.e.id,
    individualId: r.e.individualId,
    geckoName: r.pairName,
    type: 'hatching_expected',
    date: r.etaISO,
    message: `${r.nth}차 산란 · 부화 예정 (${fmtDate(r.e.date)} 산란)`,
    layingId: r.e.id,
    derived: true,
  }));
  const lay = layingForecasts().map(f => ({
    id: 'L:' + f.indId,
    individualId: f.indId,
    geckoName: f.pairName,
    type: 'laying_expected',
    date: f.eta,
    message: f.count
      ? `다음 산란 예정 · 약 ${f.interval}일 간격 (${f.basis})`
      : `첫 산란 예정 · 메이팅 +${f.interval}일`,
    derived: true,
  }));
  return [...stored, ...hatch, ...lay].sort((a, b) => (a.date > b.date ? 1 : -1));
}

// 예전 버전이 저장해 둔 '부화·산란 예정' 알림은 이제 계산으로 대체되므로 한 번만 정리합니다
function purgeStoredHatchReminders() {
  const rs = DB.getReminders();
  const next = rs.filter(r => r.type !== 'hatching_expected' && r.type !== 'laying_expected');
  if (next.length !== rs.length) DB.saveReminders(next);
  return rs.length - next.length;
}

/* ── 밥 주는 날 관리 ──
   보통 개체별로 따로 주지 않고 "오늘 한 바퀴 돈다"에 가깝습니다.
   그래서 마지막으로 밥을 준 날 + 설정한 간격 = 다음 급여일로 잡고, 그날 한 번에 체크합니다. */
const FEED_INTERVAL_DEFAULT = 3;   // 며칠에 한 번 주는지
const FEED_WARN_DEFAULT = 7;       // 며칠째 안 먹으면 걱정하는지
const feedInterval = () => {
  const v = Number((DB.getSettings() || {}).feedInterval);
  return v >= 1 && v <= 14 ? v : FEED_INTERVAL_DEFAULT;
};
const feedWarn = () => {
  const v = Number((DB.getSettings() || {}).feedWarn);
  return v >= 3 && v <= 30 ? v : FEED_WARN_DEFAULT;
};
// 먹은 것으로 치는 기록인가 (안 먹음·건너뜀은 제외)
const isAte = (e) => !(e.data && (e.data.ate === false || e.data.skipped));

function feedPlan(individuals, events) {
  const inds = (individuals || DB.getIndividuals()).filter(i => (i.status || 'own') !== 'sold' && !i.isExternal);
  const evs = (events || DB.getEvents()).filter(e => e.type === 'feeding');
  const today = todayStr();
  const lastRound = evs.reduce((a, e) => (!a || e.date > a) ? e.date : a, null);
  const interval = feedInterval();
  const nextDay = lastRound
    ? localISO(new Date(new Date(lastRound).getTime() + interval * 86400000))
    : today;
  const dLeft = daysUntil(nextDay);

  const ateBy = {}, seenBy = {};
  evs.forEach(e => {
    if (!seenBy[e.individualId] || seenBy[e.individualId] < e.date) seenBy[e.individualId] = e.date;
    if (!isAte(e)) return;
    if (!ateBy[e.individualId] || ateBy[e.individualId] < e.date) ateBy[e.individualId] = e.date;
  });
  const doneToday = new Set(evs.filter(e => e.date === today).map(e => e.individualId));
  const daysSinceAte = (id) => ateBy[id] ? Math.floor((new Date(today) - new Date(ateBy[id])) / 86400000) : null;
  const worried = inds
    .map(i => ({ ind: i, last: ateBy[i.id] || null, days: daysSinceAte(i.id) }))
    .filter(x => x.days !== null && x.days >= feedWarn())
    .sort((a, b) => b.days - a.days);

  return { inds, evs, lastRound, nextDay, dLeft, due: dLeft <= 0, interval,
           ateBy, seenBy, doneToday, worried, remaining: inds.filter(i => !doneToday.has(i.id)) };
}

/* 크레건설 출생(CG) 판정 — 우리 기록으로 부모를 아는 아이는 우리 집에서 나온 아이입니다.
   직접 등록한 아이는 프로필에서 손으로 켜고 끌 수 있습니다. */
const isCG = (i) => !!i && !i.cgOff && (i.isFromCreGunseol === true || !!(i.sireId || i.damId));

// 필터 칩 색
const CHIP_ON  = { background: 'var(--accent)', color: 'var(--on-accent)', border: '1px solid var(--accent)' };
const CHIP_OFF = { background: 'var(--bg2)', color: 'var(--text2)', border: '1px solid var(--border)' };

// 공유 기능: 서버(Supabase) 연동 전까지 UI 숨김 (shareCode 데이터는 유지)
const SHOW_SHARE = false;

// 예정일 대비 실제일 차이 문구
function diffPhrase(diffDays) {
  if (diffDays === 0) return '예정일과 정확히 일치';
  return diffDays > 0 ? `예정보다 ${diffDays}일 늦음` : `예정보다 ${-diffDays}일 빠름`;
}
// 개체의 특정 예정 알림 중 실제일과 가장 가까운 것 찾기 (60일 이내)
function matchExpectedReminder(indId, type, actualDate) {
  let best = null, bestGap = Infinity;
  DB.getReminders().forEach(r => {
    if (r.individualId === indId && r.type === type) {
      const gap = Math.abs((new Date(actualDate) - new Date(r.date)) / 86400000);
      if (gap < bestGap) { bestGap = gap; best = r; }
    }
  });
  return best && bestGap <= 60 ? best : null;
}

const nameCore = (n) => {
  let s = (n || '').trim();
  if (s.length > 1 && s.endsWith('이')) s = s.slice(0, -1);
  return s.length ? s[s.length - 1] : '';
};
function makeBabyNames(momName, dadName, count, existingNames) {
  const base = (nameCore(momName) + nameCore(dadName)) || '베이비';
  const names = [];
  let n = 1;
  for (let i = 0; i < count; i++) {
    while (existingNames.includes(`${base}${n}호`) || names.includes(`${base}${n}호`)) n++;
    names.push(`${base}${n}호`);
    n++;
  }
  return names;
}

const MAIN_FIELD = { growth: ['weight', '몸무게(g)'], laying: ['eggCount', '알 개수'], hatching: ['count', '마릿수'], distribution: ['price', '분양가(원)'] };
const mainKeyOf = ev => (MAIN_FIELD[ev.type] || [null])[0];
const mainLabelOf = ev => (MAIN_FIELD[ev.type] || [null, ''])[1];
const mainValOf = ev => { const k = mainKeyOf(ev); return k ? (ev.data && ev.data[k]) || '' : ''; };

// 대표사진: 지정된 avatar → 없으면 최근 사진
function avatarSrc(gecko) {
  if (gecko.avatar) return gecko.avatar;
  const p = DB.getEventsFor(gecko.id)
    .filter(e => e.type === 'photo' && e.data && e.data.photo)
    .sort((a, b) => (b.date + (b.createdAt || '')) > (a.date + (a.createdAt || '')) ? 1 : -1)[0];
  return p ? p.data.photo : null;
}

/* ══════════════════════════════════════════
   한 줄/대화 해석 엔진 (내장 규칙, 오프라인)
   ══════════════════════════════════════════ */
const escapeReg = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// 문장에서 등록된 개체 이름 찾기 (긴 이름 우선, 등장 순서대로)
function findNamesInText(text, individuals) {
  const found = [];
  const sorted = [...individuals].sort((a, b) => b.name.length - a.name.length);
  for (const ind of sorted) {
    if (!ind.name) continue;
    const i = text.indexOf(ind.name);
    if (i !== -1 && !found.some(f => f.ind.id === ind.id)) found.push({ ind, idx: i });
  }
  return found.sort((a, b) => a.idx - b.idx).map(f => f.ind);
}

// 메이팅 상대(파트너) 이름 추출 — 미등록 개체도 인식
// "크한이랑 크룡이가 메이팅" 처럼 동반(랑/와/과/하고) 또는 주격(가/이가) 조사로 이어진
// 이름을 모두 뽑고 대상(excludeName)을 제외한다. 탐욕적 매칭으로 끝의 '이'를 이름에 남긴다.
const PARTNER_STOPWORDS = ['오늘','어제','그제','그저께','내일','모레','방금','아까','우리','둘','모두','서로','다시','오늘은','메이팅','교배','합사'];
function extractPartnerNames(text, excludeName) {
  const out = [];
  const re = /([가-힣]{2,10})(?:이랑|랑|이와|와|과|하고|이하고|이가|가|은|는)(?=\s|$|[,.!?~])/g;
  let m;
  while ((m = re.exec(text))) {
    const n = m[1];
    if (!n || n === excludeName || out.includes(n)) continue;
    if (PARTNER_STOPWORDS.includes(n)) continue;
    if (MORPH_WORDS.includes(n) || CRICKET_RE.test(n) || SUPU_RE.test(n)) continue;
    out.push(n);
  }
  return out;
}

// 날짜 해석: "7월 10일", "2026-07-10", 어제/그제, 기본 오늘
function parseKDate(text) {
  let m = text.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = text.match(/(\d{1,2})월\s*(\d{1,2})일/);
  if (m) return `${new Date().getFullYear()}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  const d = new Date();
  if (/그저께|그제/.test(text)) { d.setDate(d.getDate() - 2); return localISO(d); }
  if (/어제/.test(text)) { d.setDate(d.getDate() - 1); return localISO(d); }
  return todayStr();
}

// 문장에서 기록(팩트) 추출 — 한 문장에 여러 개 가능
/* ── 같은 뜻을 사람마다 다르게 말합니다. 되도록 넓게 알아듣습니다 ── */
const RE_LAY   = /산란|알\s*낳|알낳|낳았|낳음|낳으[셨시]|낳더|알\s*깠|알깠|알\s*확인|알\s*나왔|알\s*발견|알\s*받[았아]|클러치|알\s*\d+\s*개|\d+\s*개\s*낳/;
const RE_HATCH = /해칭|헤칭|부화|태어났|태어난|태어나|깨어났|깨어남|깨났|껍질\s*(깨|뚫)|알에서\s*나|(알|새끼|베이비|애기|아기)\s*(에서\s*)?(나왔|나옴|나온)/;
const RE_MATE  = /메이팅|교배|합사|짝짓기|붙였|붙여\s*놨|합방|짝\s*지어|올려\s*놨|올려놨/;
const RE_SHED  = /탈피|허물|각질\s*벗|껍질\s*벗/;
const RE_FEED  = /피딩|먹이|밥|먹였|먹었|먹임|먹여|급여|사료|줬어|줬음|줬고|줬다|주었|급식/;
const RE_NOFEED = /안\s*먹|못\s*먹|먹지\s*않|거식|남겼|안먹|입질\s*없/;

function extractFacts(text) {
  const facts = [];
  // "어제", "8월 15일" 처럼 날짜를 말하면 그날 기록으로 잡습니다 (없으면 오늘)
  const when = explicitDate(text);
  const push = (type, data) => facts.push(when ? { type, data, date: when } : { type, data });
  let m;

  // 몸무게: "12그램", "12.5g"
  m = text.match(/(\d+(?:\.\d+)?)\s*(?:그램|그람|g\b|G\b)/);
  if (m) push('growth', { weight: m[1] });

  // 메이팅
  if (RE_MATE.test(text)) push('mating', {});

  // 산란
  if (RE_LAY.test(text)) {
    const c = text.match(/(\d+)\s*개/);
    push('laying', { eggCount: c ? c[1] : '' });
  }

  // 해칭/부화 — 산란과 함께 잡히지 않게 (알 낳은 말이면 부화가 아닙니다)
  if (RE_HATCH.test(text) && !/알\s*낳|알낳|산란/.test(text)) {
    const c = text.match(/(\d+)\s*마리/);
    push('hatching', { count: c ? c[1] : '' });
  }

  // 분양: "분양 15만원", "150,000원에 분양" (상태 변경 표현은 제외)
  if (/분양|입양\s*보|보냈|판매/.test(text) && !/분양\s*가능|분양\s*예정|분양\s*준비|분양\s*올|분양\s*(취소|내려|중단)/.test(text)) {
    let price = '';
    const man = text.match(/(\d+(?:\.\d+)?)\s*만\s*원?/);
    const won = text.match(/(\d[\d,]*)\s*원/);
    if (man) price = String(Math.round(parseFloat(man[1]) * 10000));
    else if (won) price = won[1].replace(/,/g, '');
    push('distribution', { price });
  }

  // 탈피
  if (RE_SHED.test(text)) push('shed', {});

  // 먹이: 충식(귀뚜라미 계열)과 일반식(슈퍼푸드) 구분
  const feedTrigger = RE_FEED.test(text) || CRICKET_RE.test(text) || SUPU_RE.test(text);
  if (feedTrigger) {
    const foodType = CRICKET_RE.test(text) ? '충식' : SUPU_RE.test(text) ? '슈푸' : '';
    // 안 먹었다는 말도 기록으로 남깁니다 — 며칠째 안 먹는지 세는 데 씁니다
    if (RE_NOFEED.test(text)) push('feeding', { ate: false, foodType, notes: '안 먹음' });
    else push('feeding', { foodType, notes: text });
  }

  return facts;
}

const CRICKET_RE = /귀뚜라미|귀뚜리|귀뚤이|귀뚤|뚤이|냉뚜리|냉뚤|생뚤|밀웜|슈퍼웜|충식|두비아|레드런/;
const SUPU_RE = /슈퍼푸드|슈푸|슬러리|판게아|레파시|CGD|일반식/;

// 모프 인식: "모프는 초초야" + 유명 모프 단어 직접 언급
const MORPH_WORDS = ['초초','릴리화이트','릴리','할리퀸','핀스트라이프','핀스','달마시안','팬텀','세이블','카푸치노','프라푸치노','아잔틱','바이컬러','타이거','브린들','플레임','트라이컬러','크림시클','엑스트림','슈퍼달마시안','헷100','솔리드백'];
function extractMorph(text) {
  const m = text.match(/모프(?:는|가|:)?\s*([가-힣A-Za-z0-9 ]+?)(?:야|이야|이에요|예요|입니다|임|이고|고|래|,|\.|!|$)/);
  if (m && m[1].trim() && !/^(뭐|뭔|무엇|머)/.test(m[1].trim())) return m[1].trim();
  for (const w of MORPH_WORDS) {
    if (text.includes(w)) return w;
  }
  return null;
}

// 감성/맥락 감지
const AFFECTION_RE = /특별|메인\s*개체|소중|아끼|예쁘|이쁘|귀엽|사랑|최고|보물|자랑|애정/;
const HEALTH_RE = /아프|아파|병원|설사|무름|입마름|MBD|칼슘|식욕\s*부진|기운이?\s*없|안\s*먹|먹지\s*않|거식|토했|토를|상처|다쳤|꼬리\s*빠|절뚝/;
const QUESTION_RE = /[?？]\s*$|어떻게\s|추천해|뭐가\s*좋|누가\s*좋|어떤\s*게\s*좋|해도\s*될까|괜찮을까/;

/* ── 프로필 정정 감지 ──
   "부화일이 8월 6일이야" 처럼 이미 저장된 값과 다른 정보가 들어오면,
   말없이 덮어쓰지 않고 뭐가 맞는지 여쭤봅니다. */
const PROFILE_LABEL = { hatchDate: '부화일(생일)', gender: '성별', morph: '모프', name: '이름' };
function profileText(field, v) {
  if (field === 'hatchDate') return fmtDate(v);
  if (field === 'gender') return genderLabel(v);
  return v;
}
// 문장에 '날짜가 분명히 적혀 있을 때만' 돌려줍니다.
// (parseKDate는 없으면 오늘을 주기 때문에, 그대로 쓰면 엉뚱한 날로 고쳐질 수 있습니다)
function explicitDate(text) {
  if (/\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(text)) return parseKDate(text);
  if (/\d{1,2}월\s*\d{1,2}일/.test(text)) return parseKDate(text);
  if (/그저께|그제|어제/.test(text)) return parseKDate(text);
  return null;
}
function detectProfileClaim(text) {
  const birthWord = /(부화일|해칭일|생일|출생일|태어난\s*날)/.test(text);
  const bornVerb = /태어(났|나)/.test(text);
  // "어제 3마리 태어났어"는 그 아이의 생일이 아니라 부화 기록입니다
  const hasCount = /\d+\s*마리/.test(text);
  if (birthWord || (bornVerb && !hasCount)) {
    const dv = explicitDate(text);
    if (dv) return { field: 'hatchDate', value: dv };
  }
  if (!/메이팅|짝짓기|붙였|합사/.test(text)) {
    const gm = text.match(/(수컷|암컷)(?:이야|이에요|입니다|임|이래|같아|이다|이었|였|으로|이었어)/);
    if (gm) return { field: 'gender', value: gm[1] === '수컷' ? 'male' : 'female' };
  }
  const nm = detectNameClaim(text);
  if (nm) return { field: 'name', value: nm };
  return null;
}

/* 이름을 바꾸겠다는 말 알아듣기
   "이름이 마동5호야" / "이름 마동5호로 바꿔줘" / "마동5호로 이름 변경" / "이름을 마동5호라고 해줘"
   → 새 이름만 뽑아냅니다. 이름이라는 낱말이 없으면 건드리지 않습니다(엉뚱한 걸 이름으로 잡지 않게). */
function detectNameClaim(text) {
  const s = String(text || '').trim();
  if (!/이름|개명|명칭/.test(s)) return null;
  if (/이름(이|은)?\s*(뭐|무엇|어떻게|모)/.test(s)) return null;        // 물어보는 말은 제외
  // 이름에 띄어쓰기가 들어갈 수 있어서(마동 5호) 공백도 허용하고, 앞뒤를 다듬습니다
  const V = '([^"\'“”‘’]{1,20}?)';
  const pats = [
    new RegExp('이름(?:은|이|을)?\\s*["\'“”‘’]?' + V + '["\'“”‘’]?\\s*(?:로|으로)\\s*(?:바꿔|변경|고쳐|수정|해줘|해|바꾸)'),
    new RegExp('^\\s*["\'“”‘’]?' + V + '["\'“”‘’]?\\s*(?:로|으로)\\s*이름\\s*(?:바꿔|변경|고쳐|수정)'),
    new RegExp('이름(?:은|이)\\s*["\'“”‘’]?' + V + '["\'“”‘’]?\\s*(?:이야|이에요|예요|입니다|이다|임|야)\\s*$'),
    new RegExp('이름(?:을|은|이)?\\s*["\'“”‘’]?' + V + '["\'“”‘’]?\\s*(?:라고|이라고)\\s*(?:불러|해줘|해)'),
  ];
  for (const p of pats) {
    const m = s.match(p);
    if (m && m[1]) {
      const v = m[1].replace(/[.,!?]+$/, '').trim();
      if (v && !/^(뭐|무엇|어떻게|그거|이거)$/.test(v)) return v;
    }
  }
  return null;
}

/* 이름 바꾸기 — 같은 이름이 이미 있으면 막습니다(누구 기록인지 헷갈리지 않게) */
function renameCheck(id, newName, individuals) {
  const nm = String(newName || '').trim();
  if (!nm) return { ok: false, reason: '이름을 입력해 주세요' };
  if (nm.length > 20) return { ok: false, reason: '이름이 너무 길어요 (20자까지)' };
  const list = individuals || DB.getIndividuals();
  const cur = list.find(i => i.id === id);
  if (!cur) return { ok: false, reason: '개체를 찾을 수 없어요' };
  if (cur.name === nm) return { ok: false, reason: '지금 이름과 같아요', same: true };
  if (list.some(i => i.id !== id && i.name === nm)) return { ok: false, reason: `"${nm}"는 이미 있는 이름이에요`, dup: true };
  return { ok: true, from: cur.name, to: nm };
}

/* 무엇을 할지 정하는 판단부 (화면과 분리 — 그대로 테스트합니다)
   null        → 평소대로 진행
   future      → 아직 오지 않은 날짜
   ask         → 기존 값과 달라서 여쭤봄
   apply       → 비어 있던 칸이라 바로 채움 */
function planProfileFix(cur, text, individuals, morph) {
  const claim = detectProfileClaim(text) || (morph ? { field: 'morph', value: morph } : null);
  if (!claim || !cur) return null;
  if (claim.field === 'hatchDate' && claim.value > todayStr()) return { kind: 'future', value: claim.value };
  if (claim.field === 'name') {
    const chk = renameCheck(cur.id, claim.value, individuals);
    if (!chk.ok) return chk.same ? null : { kind: 'nameBad', reason: chk.reason, to: claim.value };
    return { kind: 'ask', field: 'name', from: chk.from, to: chk.to, sibs: 1 };
  }
  // 성별 '미구분'은 아직 안 정한 상태라 "다른 값"으로 보지 않습니다
  const from = (claim.field === 'gender' && cur.gender === 'unknown') ? '' : (cur[claim.field] || '');
  if (from === claim.value) return null;
  if (!from) return claim.field === 'hatchDate' ? { kind: 'apply', field: 'hatchDate', from: '', to: claim.value } : null;
  const sibs = claim.field === 'hatchDate' && cur.damId
    ? (individuals || []).filter(x => x.damId === cur.damId && x.hatchDate === from).length : 1;
  return { kind: 'ask', field: claim.field, from, to: claim.value, sibs };
}

/* ── 형제 이름 규칙 맞추기 ──
   같은 부모에서 나온 아이들은 보통 같은 접두어 + 호수로 짓습니다(마동 1호, 마동 2호 …).
   해칭할 때 다른 이름으로 지어진 아이를 찾아, 형제들이 쓰는 접두어와 빈 번호로 바꿔 제안합니다.
   ("동인 1호·2호" → "마동 5호·6호" 같은 경우) */
const NAME_NO_RE = /^(.*?)\s*(\d+)\s*호$/;
function splitBabyName(name) {
  const m = String(name || '').match(NAME_NO_RE);
  if (!m) return null;
  const prefix = m[1].trim();
  if (!prefix) return null;
  return { prefix, no: parseInt(m[2], 10) };
}
function nameFixPlan(individuals) {
  const list = individuals || DB.getIndividuals();
  const groups = {};
  list.forEach(i => {
    if (!i.damId && !i.sireId) return;
    const key = (i.sireId || '?') + '|' + (i.damId || '?');
    (groups[key] = groups[key] || []).push(i);
  });
  const out = [];
  Object.values(groups).forEach(kids => {
    const parsed = kids.map(i => ({ i, p: splitBabyName(i.name) })).filter(x => x.p);
    if (parsed.length < 2) return;
    // 형제들이 가장 많이 쓰는 접두어를 기준으로 삼습니다
    const cnt = {};
    parsed.forEach(x => { cnt[x.p.prefix] = (cnt[x.p.prefix] || 0) + 1; });
    const ranked = Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const main = ranked[0][0];
    if (ranked[0][1] < 2) return;                       // 기준이라 할 만큼 많지 않으면 건드리지 않습니다
    const odd = parsed.filter(x => x.p.prefix !== main)
      .sort((a, b) => (a.i.hatchDate || '').localeCompare(b.i.hatchDate || '') || a.p.no - b.p.no);
    if (!odd.length) return;
    const used = new Set(parsed.filter(x => x.p.prefix === main).map(x => x.p.no));
    const taken = new Set(list.map(i => i.name));
    let next = 1;
    odd.forEach(x => {
      while (used.has(next) || taken.has(`${main} ${next}호`) || taken.has(`${main}${next}호`)) next++;
      const to = `${main} ${next}호`;
      used.add(next); taken.add(to);
      out.push({ id: x.i.id, from: x.i.name, to, prefix: main });
    });
  });
  return out;
}
function applyNameFixes(plans) {
  let done = 0;
  (plans || []).forEach(p => {
    const chk = renameCheck(p.id, p.to);
    if (chk.ok) { DB.updateIndividual(p.id, { name: p.to }); done++; }
  });
  return done;
}

/* 실제로 고치는 실행부 — 부화일은 부화 기록·형제 생일까지 함께 옮깁니다 */
function commitProfileFix(t, field, from, to) {
  if (field !== 'hatchDate') { DB.updateIndividual(t.id, { [field]: to }); return { moved: 1 }; }
  let moved = 0;
  if (from) { moved = DB.moveHatchDate(t.damId, from, to).babies; }
  if (!moved) { DB.updateIndividual(t.id, { hatchDate: to }); moved = 1; }
  return { moved };
}

// 응답 문구 다양화
const OPENERS = ['기록함에 담았어요 ✅', '잘 적어뒀어요 ✍️', '차곡차곡 담아뒀어요 📥', '기록해뒀어요 🙂'];
const pickOpener = () => OPENERS[Math.floor(Math.random() * OPENERS.length)];

// 메모 성격에 따른 따뜻한 응답 (없으면 null → 기본 응답)
function memoReply(name, text) {
  if (HEALTH_RE.test(text)) {
    return `저런, 걱정되시겠어요 😢 말씀하신 증상은 ${name} 기록에 잘 남겨둘게요.\n상태가 계속되면 파충류 진료가 가능한 병원에 보여주시는 걸 추천드려요.`;
  }
  if (AFFECTION_RE.test(text)) {
    return `${name}를 정말 아끼시는 마음이 느껴져요 🦎 이 말씀은 ${name} 기록에 소중히 남겨둘게요.`;
  }
  return null;
}

// 비속어 필터: 개체 이름으로 쓸 수 없는 표현
const PROFANITY_RE = /병신|븅신|빙신|씨발|시발|씨빨|시빨|씹|좆|존나|졸라|지랄|섹스|자지|보지|니미|니애미|애미|엠창|개새끼|새꺄|미친놈|미친년|또라이|호로|후장|걸레|창녀|창놈|병자|ㅅㅂ|ㅆㅂ|ㅄ|ㅂㅅ|ㅈㄹ|ㄲㅈ|fuck|shit|sex/i;
const isBadName = (n) => PROFANITY_RE.test((n || '').replace(/\s/g, ''));
const BAD_NAME_MSG = '귀여운 아이들에게 비속어는 좋은 선택이 아닌 것 같아요 🙂\n예쁜 이름으로 다시 알려주시겠어요?';

// "이름은/이름이 ○○(이)야" 명시 선언 패턴에서 이름 추출
/* 대화 중 주인 정정·대상 전환 문장 인식
   "사진은 밤울2호야" → 방금 담은 사진의 주인을 바꿈
   "이건 크순이 거야"  → 방금 담은 기록의 주인을 바꿈
   "이제 크순이 얘기할게" → 대상만 전환 (기록은 그대로) */
// "크순이야" 는 이름이 "크순이"일 수도 "크순"일 수도 있습니다.
// 여기서는 후보를 순서대로 내놓고, 실제 등록된 이름과 대조해 고릅니다.
// (게코 이름은 대부분 '이'로 끝나므로 '크순이'를 먼저 시도합니다)
function rtNameCandidates(raw) {
  let s = (raw || '').trim().replace(/[.!~?]+$/, '');
  s = s.replace(/\s*(?:거|꺼|것)(?:야|예요|이에요|입니다|임)?$/, '');   // "크범이 거야"
  s = s.replace(/\s*(?:기록|사진)$/, '');
  s = s.trim();
  if (/\s/.test(s) || s.length > 14) return { cands: [], explicit: false };
  const out = [];
  let explicit = false;
  const m = s.match(/^(.+?)(이야|이에요|예요|입니다|이다|임|야|이라고|라고)$/);
  if (m) {
    explicit = true;
    if (m[2] === '이야') out.push(m[1] + '이');
    out.push(m[1]);
  }
  out.push(s);
  const cands = [...new Set(out)].filter(x => /^[가-힣A-Za-z0-9]{1,12}$/.test(x));
  return { cands, explicit };
}

/* 대화 중 주인 정정·대상 전환 문장 인식
   "사진은 밤울2호야" → 방금 담은 사진의 주인을 바꿈
   "이건 크순이 거야"  → 방금 담은 기록의 주인을 바꿈
   "이제 크순이 얘기할게" → 대상만 전환 (기록은 그대로) */
function extractRetarget(text) {
  const t = (text || '').trim().replace(/[\s]+$/, '');
  const shots = [
    [/^(?:이|그|저|방금|아까)?\s*사진(?:은|는|이|가)?\s+(.+)$/, 'photo'],
    [/^(.+?)\s*사진(?:이야|이에요|예요|야|임)$/, 'photo'],
    [/^(?:이건|이거|이것|그건|그거|저건|방금\s*건|방금거|아까\s*건)(?:은|는)?\s+(.+)$/, 'last'],
  ];
  for (const [re, scope] of shots) {
    const m = t.match(re);
    if (!m) continue;
    const { cands, explicit } = rtNameCandidates(m[1]);
    if (!cands.length) continue;
    // 서술 어미가 없으면(예: "사진 찍었어") 등록된 이름일 때만 인정
    const known = DB.getIndividuals().map(i => i.name);
    const hit = cands.find(c => known.includes(c));
    if (!explicit && !hit) continue;
    return { name: hit || cands[0], scope };
  }
  const sw = t.match(/^(?:이제|지금부터|다음은|이번엔)\s*(.+?)\s*(?:얘기|이야기|차례)/);
  if (sw) {
    const { cands } = rtNameCandidates(sw[1]);
    if (cands.length) {
      const known = DB.getIndividuals().map(i => i.name);
      return { name: cands.find(c => known.includes(c)) || cands[0], scope: 'switch' };
    }
  }
  return null;
}

function extractNameDecl(text) {
  const m = text.match(/이름(?:은|이|:)?\s*([가-힣A-Za-z0-9]{1,10}?)(?:이야|이에요|예요|입니다|이래|라고\s*해|라고|이다|임|야|고)?[\s.!?~]*$/);
  return m ? m[1] : null;
}

// 미등록 새 이름 후보 추측: 첫 단어에서 조사 제거
const KEYWORD_START = /^(오늘|어제|그제|그저께|저장|사진|메모|모프|알|메이팅|교배|합사|산란|해칭|부화|분양|탈피|먹이|피딩|밥|귀뚜라미|외부|이름|몸무게|무게|체중|성별|나이|상태|기록|얘|걔|암컷|수컷|파트너|상대|아빠|엄마|아비|어미)/;
function guessNewName(text, individuals) {
  const first = text.trim().split(/\s+/)[0];
  if (!first) return null;
  const cleaned = first.replace(/(한테|에게|이랑|께서|랑|의|가|은|는|도|를|을)$/, '') || first;
  if (/^\d+$/.test(cleaned)) return null;                      // 순수 숫자만 거부 ("범림1호" 등 숫자 포함 이름은 허용)
  if (/^\d/.test(cleaned)) return null;                        // 숫자로 시작("12그램" 등)도 거부
  if (KEYWORD_START.test(cleaned)) return null;
  if (MORPH_WORDS.includes(cleaned)) return null;
  if (CRICKET_RE.test(cleaned) || SUPU_RE.test(cleaned)) return null;
  if (cleaned.length < 1 || cleaned.length > 10) return null;
  // "크민이의"처럼 기존 개체명이 앞부분에 붙은 경우 → 새 이름 아님
  if (individuals && individuals.some(i => i.name && (cleaned === i.name || cleaned.startsWith(i.name)))) return null;
  return cleaned;
}

// 담긴 기록 한 줄 요약
function factLabel(f) {
  const t = EVENT_TYPES.find(e => e.key === f.type) || {};
  let d = '';
  switch (f.type) {
    case 'growth':       d = f.data.weight + 'g'; break;
    case 'mating':       d = f.data.partnerName ? '파트너 ' + f.data.partnerName : ''; break;
    case 'laying':       d = f.data.eggCount ? '알 ' + f.data.eggCount + '개' : ''; break;
    case 'hatching':     d = f.data.count ? f.data.count + '마리' : ''; break;
    case 'distribution': d = f.data.price ? Number(f.data.price).toLocaleString() + '원' : ''; break;
    case 'feeding':      d = f.data.foodType === '충식' ? '🦗 충식' : f.data.foodType === '슈푸' ? '🥣 슈푸' : ''; break;
    case 'memo':         d = (f.data.notes || '').slice(0, 18); break;
    case 'photo':        d = '1장'; break;
    default: break;
  }
  return `${t.emoji || ''} ${t.label || f.type}${d ? ' · ' + d : ''}`;
}

function answerQuery(target, text) {
  if (/할까|좋을까|추천|어떻게\s*(해|하)/.test(text)) return null;
  const explicit = /(언제|몇\s*(개|마리|살|그램|번)?|얼마|뭐야|뭐지|뭐였|무엇|누구야|누구지|누구랑\s*했|알려\s*줘|알려줄래|보여\s*줘|보여줄래)/.test(text);
  const tailQ = /[?？]\s*$/.test(text) && /최근|마지막|산란|몸무게|무게|메이팅|탈피|밥|먹이|기록|모프|성별|해칭|부화|분양/.test(text);
  if (!explicit && !tailQ) return null;

  const evs = DB.getEventsFor(target.id).sort((a, b) =>
    (b.date + (b.createdAt || '')) > (a.date + (a.createdAt || '')) ? 1 : -1);
  const last = t => evs.find(e => e.type === t);
  const ago = e => {
    const d = Math.floor((new Date(todayStr()) - new Date(e.date)) / 86400000);
    return d === 0 ? '오늘' : d === 1 ? '어제' : `${d}일 전`;
  };
  const none = (what, emoji) => `${target.name}는 아직 ${what} 기록이 없어요 ${emoji}`;
  const inDays = (iso) => {
    const d = daysUntil(iso);
    return d > 0 ? `${d}일 뒤` : d === 0 ? '오늘' : `${-d}일 지남`;
  };

  /* ── 앞으로의 예정 (다음 산란 / 해칭 예정) ── */
  const asksNext = /(다음|담|언제쯤|예정|예상)/.test(text);

  if (asksNext && /산란|알/.test(text)) {
    const e = last('laying');
    const m = last('mating');
    if (e) {
      const eta = localISO(new Date(new Date(e.date).getTime() + LAYING_INTERVAL * 86400000));
      return `${target.name}의 다음 산란은 ${fmtDate(eta)}쯤으로 보여요 🥚 (${inDays(eta)})\n`
        + `마지막 산란 ${fmtDate(e.date)} 기준 약 ${LAYING_INTERVAL}일 간격으로 잡은 예상이에요.`;
    }
    if (m) {
      const eta = localISO(new Date(new Date(m.date).getTime() + LAYING_AFTER_MATING * 86400000));
      return `${target.name}는 아직 산란 기록이 없어요.\n메이팅(${fmtDate(m.date)}) 기준으로는 ${fmtDate(eta)}쯤 예상돼요 🥚 (${inDays(eta)})`;
    }
    return none('산란', '🥚');
  }

  if (asksNext && /해칭|부화/.test(text)) {
    const lays = evs.filter(e => e.type === 'laying')
      .filter(e => !/무정/.test((e.data && e.data.notes) || ''))
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!lays.length) return none('산란', '🥚');
    const pending = lays.map(e => ({ e, eta: hatchETA(e.date) })).filter(x => daysUntil(x.eta) >= -14);
    if (!pending.length) return `${target.name}의 알은 부화 예정일이 모두 지났어요. 산란기록 탭에서 확인해보세요 🐣`;
    pending.sort((a, b) => daysUntil(a.eta) - daysUntil(b.eta));
    const x = pending[0];
    return `${target.name}의 알은 ${fmtDate(x.eta)}쯤 부화 예정이에요 🐣 (${inDays(x.eta)})\n`
      + `${fmtDate(x.e.date)} 산란 · 인큐 ${incubateTemp()}°C 기준 ${hatchDaysNow()}일`
      + (pending.length > 1 ? `\n부화 대기 중인 알 묶음이 ${pending.length}개 있어요.` : '');
  }

  if (/산란|알\s*(낳|난|났|몇)/.test(text)) {
    const e = last('laying');
    if (!e) return none('산란', '🥚');
    const total = evs.filter(x => x.type === 'laying').length;
    return `${target.name}의 가장 최근 산란은 ${fmtDate(e.date)} (${ago(e)})이에요 🥚${e.data?.eggCount ? ` · 알 ${e.data.eggCount}개` : ''}${total > 1 ? `\n지금까지 총 ${total}번 산란했어요.` : ''}`;
  }
  if (/몸무게|무게|체중|그램|살쪘|말랐/.test(text)) {
    const gs = evs.filter(x => x.type === 'growth' && x.data?.weight);
    if (!gs.length) return none('몸무게', '📏');
    const cur = gs[0], prev = gs[1];
    let diff = '';
    if (prev) {
      const d = (parseFloat(cur.data.weight) - parseFloat(prev.data.weight)).toFixed(1).replace(/\.0$/, '');
      diff = `\n지난 기록(${fmtDate(prev.date)} · ${prev.data.weight}g)보다 ${d > 0 ? '+' + d : d}g이에요.`;
    }
    return `${target.name}의 최근 몸무게는 ${cur.data.weight}g이에요 📏 (${fmtDate(cur.date)}, ${ago(cur)})${diff}`;
  }
  if (/메이팅|교배|합사/.test(text)) {
    const e = last('mating');
    if (!e) return none('메이팅', '💞');
    return `${target.name}의 마지막 메이팅은 ${fmtDate(e.date)} (${ago(e)})이에요 💞${e.data?.partnerName ? ` · 파트너: ${e.data.partnerName}` : ''}`;
  }
  if (/탈피/.test(text)) {
    const e = last('shed');
    if (!e) return none('탈피', '🌿');
    return `${target.name}의 마지막 탈피는 ${fmtDate(e.date)} (${ago(e)})이에요 🌿`;
  }
  if (/밥|먹이|피딩|충식|슈푸/.test(text)) {
    const e = last('feeding');
    if (!e) return none('먹이', '🍽️');
    const ft = e.data?.foodType === '충식' ? ' · 🦗 충식' : e.data?.foodType === '슈푸' ? ' · 🥣 슈푸' : '';
    return `${target.name}가 마지막으로 밥 먹은 건 ${fmtDate(e.date)} (${ago(e)})이에요 🍽️${ft}`;
  }
  if (/해칭|부화/.test(text)) {
    const e = last('hatching');
    if (!e) return none('해칭', '🐣');
    return `${target.name}의 해칭 기록: ${fmtDate(e.date)} (${ago(e)}) 🐣${e.data?.count ? ` · ${e.data.count}마리` : ''}`;
  }
  if (/분양/.test(text)) {
    const e = last('distribution');
    if (!e) return none('분양', '🤝');
    return `분양 기록: ${fmtDate(e.date)} 🤝${e.data?.price ? ` · ${Number(e.data.price).toLocaleString()}원` : ''}`;
  }
  if (/모프/.test(text)) {
    return target.morph ? `${target.name}의 모프는 ${target.morph}예요 ✨` : `${target.name}의 모프는 아직 등록 전이에요. "모프는 ○○야"라고 알려주시면 적어둘게요.`;
  }
  if (/성별|암컷인지|수컷인지/.test(text)) {
    return `${target.name}의 성별은 ${genderLabel(target.gender)}(으)로 기록돼 있어요.`;
  }
  if (/생일|출생|부화일|몇\s*살|나이|태어/.test(text)) {
    if (!target.hatchDate) {
      return `${target.name}의 생일(부화일)은 아직 등록 전이에요 🎂\n"${target.name} 2025년 7월 14일에 태어났어"처럼 알려주시면 적어둘게요.`;
    }
    return `${target.name}의 생일은 ${fmtDate(target.hatchDate)}이에요 🎂 (${ageText(target.hatchDate)})`;
  }
  if (/혈통|부모|아빠|엄마|아비|어미|자식|새끼/.test(text)) {
    const all = DB.getIndividuals();
    const sire = all.find(i => i.id === target.sireId);
    const dam = all.find(i => i.id === target.damId);
    const kids = all.filter(i => i.sireId === target.id || i.damId === target.id);
    return `${target.name}의 혈통이에요 🧬\n부(아빠): ${sire ? sire.name : '미등록'}\n모(엄마): ${dam ? dam.name : '미등록'}\n`
      + (kids.length ? `자식 ${kids.length}마리: ${kids.map(k => k.name).join(', ')}` : '자식 기록은 아직 없어요.');
  }
  if (/분양가|가격|얼마|값/.test(text)) {
    const st = STATUS[target.status || 'own'] || STATUS.own;
    const price = salePriceOf(target) ? wonText(salePriceOf(target)) : '가격 미등록';
    return `${target.name}는 지금 ${st.label} 상태예요 · ${price}`;
  }
  if (/사진|이미지/.test(text)) {
    const photos = evs.filter(e => e.type === 'photo').length;
    return photos ? `${target.name}의 사진은 ${photos}장 있어요 📷 프로필에서 볼 수 있어요.`
                  : `${target.name}의 사진은 아직 없어요 📷 대화창의 📷 버튼으로 올려주시면 기록에 붙여둘게요.`;
  }
  if (/기록|근황|요약|히스토리|어때|정보|알려|보여|프로필|상태/.test(text)) {
    return recordSummary(target);
  }
  return null;
}

// 나이 표현: 1년 2개월째 / 45일째
function ageText(iso) {
  const days = Math.floor((new Date(todayStr()) - new Date(iso)) / 86400000);
  if (days < 0) return '아직 오지 않은 날짜';
  if (days < 60) return `${days}일째`;
  const m = Math.floor(days / 30);
  return m < 12 ? `${m}개월째` : `${Math.floor(m / 12)}년 ${m % 12}개월째`;
}

/* 이 아이에 대해 앱이 알고 있는 것을 한 번에 읽어줍니다.
   질문을 정확히 못 알아들었을 때도 "모르겠어요" 대신 이 요약을 보여줍니다. */
function recordSummary(target) {
  const all = DB.getIndividuals();
  const evs = DB.getEventsFor(target.id).sort((a, b) =>
    (b.date + (b.createdAt || '')) > (a.date + (a.createdAt || '')) ? 1 : -1);
  const last = t => evs.find(e => e.type === t);
  const st = STATUS[target.status || 'own'] || STATUS.own;
  const sire = all.find(i => i.id === target.sireId);
  const dam = all.find(i => i.id === target.damId);
  const w = evs.find(e => e.type === 'growth' && e.data && e.data.weight);
  const feed = last('feeding');
  const lay = last('laying');
  const mate = last('mating');
  const shed = last('shed');

  const L = [];
  L.push(`· 성별 ${genderLabel(target.gender)} · 모프 ${target.morph || '미등록'}`);
  L.push(`· 생일 ${target.hatchDate ? `${fmtDate(target.hatchDate)} (${ageText(target.hatchDate)})` : '미등록'}`);
  L.push(`· 상태 ${st.label}${target.salePrice ? ` · ${Number(target.salePrice).toLocaleString()}원` : ''}`);
  if (sire || dam) L.push(`· 혈통 부 ${sire ? sire.name : '미등록'} · 모 ${dam ? dam.name : '미등록'}`);
  if (w) L.push(`· 몸무게 ${w.data.weight}g (${fmtDate(w.date)})`);
  if (feed) L.push(`· 마지막 밥 ${fmtDate(feed.date)}${feed.data && feed.data.foodType ? ` · ${feed.data.foodType}` : ''}`);
  if (shed) L.push(`· 마지막 탈피 ${fmtDate(shed.date)}`);
  if (mate) L.push(`· 마지막 메이팅 ${fmtDate(mate.date)}${mate.data && mate.data.partnerName ? ` · ${mate.data.partnerName}` : ''}`);
  if (lay) {
    const total = evs.filter(e => e.type === 'laying').length;
    L.push(`· 산란 총 ${total}회 · 최근 ${fmtDate(lay.date)}${lay.data && lay.data.eggCount ? ` · 알 ${lay.data.eggCount}개` : ''}`);
  }

  const recent = evs.slice(0, 3).map(e => {
    const t = EVENT_TYPES.find(x => x.key === e.type) || {};
    return `· ${fmtDate(e.date)} ${t.emoji || ''} ${formatEventDetail(e)}`;
  });

  return `${target.name}에 대해 제가 아는 건 이래요 📋\n${L.join('\n')}\n\n`
    + (evs.length
        ? `최근 기록 (총 ${evs.length}건)\n${recent.join('\n')}`
        : '아직 남긴 기록은 없어요. 오늘부터 하나씩 남겨볼까요? 🙂');
}

// 사진 압축 (localStorage 용량 보호)
function compressImage(file, cb) {
  const img = new Image();
  img.onload = () => {
    const max = 500;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL('image/jpeg', 0.55));
  };
  img.src = URL.createObjectURL(file);
}

/* ══════════════════════════════════════════
   Toast
   ══════════════════════════════════════════ */
function useToast() {
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  }, []);
  return [toast, showToast];
}

/* ══════════════════════════════════════════
   앱 루트
   ══════════════════════════════════════════ */
function App() {
  const [screen, setScreen] = useState({ name: 'home', props: {} });
  const [tab, setTab] = useState('home');
  const [toast, showToast] = useToast();
  const [individuals, setIndividuals] = useState(() => DB.getIndividuals());
  const [remVer, setRemVer] = useState(0);

  const refreshIndividuals = () => setIndividuals(DB.getIndividuals());
  const refreshReminders = () => setRemVer(v => v + 1);

  // 예전 버전이 저장해 둔 '부화 예정' 알림 정리 (이제 산란기록에서 매번 계산합니다)
  useEffect(() => {
    if (purgeStoredHatchReminders()) setRemVer(v => v + 1);
  }, []);

  // 서버 동기화: 앱을 켤 때 / 다시 앱으로 돌아올 때 / 인터넷이 다시 연결될 때
  useEffect(() => {
    if (!SYNC.active()) return;
    SYNC.run('start');
    const off = SYNC.on((dataChanged) => {
      if (dataChanged) { setIndividuals(DB.getIndividuals()); setRemVer(v => v + 1); }
    });
    const onVisible = () => { if (document.visibilityState === 'visible') SYNC.run('resume'); };
    const onOnline = () => SYNC.run('online');
    // 앱을 켜둔 채 가만히 있어도 다른 기기 변경이 들어오도록 1분마다 확인
    const timer = setInterval(() => {
      if (document.visibilityState === 'visible') SYNC.run('poll');
    }, 60000);
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('online', onOnline);
    return () => { off(); clearInterval(timer); document.removeEventListener('visibilitychange', onVisible); window.removeEventListener('online', onOnline); };
  }, []);

  /* 새 버전 확인 — 켤 때 / 앱으로 돌아올 때 / 30분마다.
     새 버전이 올라와 있으면 안내 막대를 띄우고, 데이터 모양이 바뀐 경우엔 올리기를 멈춥니다. */
  const [, bumpVer] = useState(0);
  useEffect(() => {
    const off = VER.on(() => bumpVer(v => v + 1));
    VER.check();
    const onVisible = () => { if (document.visibilityState === 'visible') VER.check(); };
    const onOnlineV = () => VER.check();
    const timer = setInterval(() => { if (document.visibilityState === 'visible') VER.check(); }, VERSION_CHECK_MS);
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('online', onOnlineV);
    return () => { off(); clearInterval(timer); document.removeEventListener('visibilitychange', onVisible); window.removeEventListener('online', onOnlineV); };
  }, []);

  /* 화면 이동 기록 — 안드로이드 뒤로가기(◁)로 앱이 꺼지지 않고 이전 화면으로 가게 합니다.
     화면을 옮길 때마다 브라우저 방문기록에 한 칸을 쌓고, 뒤로가기가 오면 한 칸 되돌립니다.
     홈에서 한 번 더 누르면 그때는 정상적으로 앱이 닫힙니다. */
  const stackRef = useRef([{ name: 'home', props: {} }]);
  const navigate = (name, props = {}) => {
    stackRef.current.push({ name, props });
    try { window.history.pushState({ cgDepth: stackRef.current.length }, ''); } catch {}
    setScreen({ name, props });
    if (['home','calendar','reminders','settings'].includes(name)) setTab(name);
  };

  useEffect(() => {
    const onPop = () => {
      if (stackRef.current.length <= 1) return;   // 홈이면 그대로 두어 앱이 닫히게
      stackRef.current.pop();
      const prev = stackRef.current[stackRef.current.length - 1] || { name: 'home', props: {} };
      setScreen(prev);
      if (['home','calendar','reminders','settings'].includes(prev.name)) setTab(prev.name);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  // 배지: 오늘 해야 할 일 — 당일이거나 이미 날짜가 지난 것 중 아직 확인하지 않은 것
  // (지난 일정도 배지에 넣습니다. 예전엔 D-1·당일만 세어서 3일 지난 부화 확인이 조용히 묻혔습니다)
  const readIds = DB.getReadReminderIds();
  const badgeCount = allAlerts().filter(r =>
    daysUntil(r.date) <= 0 && !readIds.includes(r.id)).length;

  return (
    <div className="app">
      {/* 새 버전 안내 — 모양이 바뀐 경우(hard)는 화면에 계속 붙어 있습니다 */}
      {VER.blocked() ? (

          <span>업데이트가 필요해요. 지금은 기록이 서버에 올라가지 않습니다.</span>
          <button onClick={() => VER.refresh()}>지금 업데이트</button>
        </div>
      ) : VER.hasUpdate() ? (
        <div className="updbar">
          <span>새 버전이 있어요{VER.note() ? ' — ' + VER.note() : ''}</span>
          <button onClick={() => VER.refresh()}>새로고침</button>
        </div>
      ) : null}

      {screen.name === 'home' && (
        <HomeScreen key={screen.props.view || 'own'} {...screen.props} individuals={individuals} navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} />
      )}
      {screen.name === 'feeding' && (
        <FeedingScreen navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} />
      )}
      {screen.name === 'clutch' && (
        <ClutchScreen {...screen.props} navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} />
      )}
      {screen.name === 'chat' && (
        <SmartChatScreen {...screen.props} navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} />
      )}
      {screen.name === 'profile' && (
        <ProfileScreen key={screen.props.gecko && screen.props.gecko.id} {...screen.props} navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} individuals={individuals} />
      )}
      {screen.name === 'calendar' && (
        <CalendarScreen navigate={navigate} individuals={individuals} showToast={showToast} onRemindersChanged={refreshReminders} />
      )}
      {screen.name === 'reminders' && (
        <RemindersScreen navigate={navigate} onChanged={refreshReminders} />
      )}
      {screen.name === 'settings' && (
        <SettingsScreen navigate={navigate} showToast={showToast} refreshIndividuals={refreshIndividuals} />
      )}

      {/* 하단 탭바 */}
      {['home','calendar','reminders','settings'].includes(screen.name) && (
        <div className="tabbar">
          <button className={`tab-btn ${tab==='home'?'active':''}`} onClick={() => navigate('home')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            홈
          </button>
          <button className={`tab-btn ${tab==='calendar'?'active':''}`} onClick={() => navigate('calendar')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            캘린더
          </button>
          {/* 가운데 대화 버튼 — 예전 우하단 ＋ 자리를 대신합니다 */}
          <button className="tab-btn tab-chat" onClick={() => navigate('chat')} aria-label="대화로 기록하기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
            대화

          <button className={`tab-btn ${tab==='reminders'?'active':''}`} onClick={() => navigate('reminders')} style={{position:'relative'}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            알림
            {badgeCount > 0 && <span className="notif-badge">{badgeCount}</span>}
          </button>
          <button className={`tab-btn ${tab==='settings'?'active':''}`} onClick={() => navigate('settings')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            설정

        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ══════════════════════════════════════════
   홈 화면
   ══════════════════════════════════════════ */
function HomeScreen({ individuals, navigate, showToast, refreshIndividuals, view: initialView }) {
  const [search, setSearch] = useState('');
  const [view, setView] = useState(initialView || 'own'); // own | sale | mating | laying | hatch
  const [saleFilter, setSaleFilter] = useState('available');
  const [favOnly, setFavOnly] = useState(false);
  const [keepOnly, setKeepOnly] = useState(false);
  // 정렬은 골라둔 것을 기억합니다
  const [sortKey, setSortKey] = useState(() => (DB.getSettings().listSort || SORT_DEFAULT));
  const [sortOpen, setSortOpen] = useState(false);
  const [fillQueue, setFillQueue] = useState([]);   // 분양가 채우기 대기줄
  const pickSort = (k) => { setSortKey(k); setSortOpen(false); DB.saveSettings({ ...DB.getSettings(), listSort: k }); };
  const activeInds = individuals.filter(i => (i.status || 'own') !== 'sold' && !i.isExternal);
  const missingPrice = soldMissingPrice(individuals);
  const namePlans = nameFixPlan(individuals);   // 형제와 이름 규칙이 다른 아이
  const stats = {
    total: activeInds.length,
    fav: activeInds.filter(i => i.favorite).length,
    keep: activeInds.filter(i => i.keep).length,
    fromCG: activeInds.filter(isCG).length,
    sold: individuals.filter(i => (i.status || 'own') === 'sold').length,
  };
  const bySearch = list => list.filter(i =>
    i.name.toLowerCase().includes(search.toLowerCase()) ||
    (i.morph || '').toLowerCase().includes(search.toLowerCase())
  );
  // 고른 기준으로 정렬 (즐겨찾기·KEEP은 항상 위) + 필터
  let ownList = sortList(bySearch(activeInds), sortKey);
  if (favOnly) ownList = ownList.filter(i => i.favorite);
  if (keepOnly) ownList = ownList.filter(i => i.keep);
  // KEEP인 아이는 "분양가능" 목록에 올리지 않습니다 (실수로 내놓지 않게)
  const saleList = sortList(bySearch(individuals.filter(i =>
    (i.status || 'own') === saleFilter && !i.isExternal && !(saleFilter === 'available' && i.keep))), sortKey);
  const toggleFav = (g) => { DB.updateIndividual(g.id, { favorite: !g.favorite }); refreshIndividuals(); };

  return (
    <>
      <div className="screen">
        <div className="header">
          <div className="header-row">
            <div style={{display:'flex', alignItems:'center', gap:9, minWidth:0}}>
              <img src="./icon-192.png" alt="크레건설" width="34" height="34"
                style={{display:'block', flexShrink:0, imageRendering:'auto'}} />
              <div style={{minWidth:0}}>
                <h1>크레건설 브리딩비서</h1>
                <div className="header-sub">💬 대화 하나로 등록부터 기록까지</div>
              </div>
            </div>
            <div style={{display:'flex', gap:6}}>
              {stats.fromCG > 0 && <span className="badge badge-gold">CG {stats.fromCG}</span>}
            </div>
          </div>
        </div>

        {individuals.length > 0 && (
          <div style={{padding:'12px 16px 0'}}>
            <input
              className="input"
              placeholder="🔍 이름 또는 모프 검색"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
          </div>
        )}

        {individuals.length > 0 && (
          <div style={{display:'flex', alignItems:'center', gap:10, padding:'10px 16px 0', fontSize:13, color:'var(--text3)'}}>
            <span><b style={{fontSize:16, color:'var(--accent2)'}}>{stats.total}</b> 마리</span>
            <span style={{color:'var(--border)'}}>|</span>
            <button onClick={() => { setView('own'); setKeepOnly(false); setFavOnly(f => !f); }}
              style={{background:'none', border:'none', padding:0, cursor:'pointer', fontSize:13,
                      color: favOnly ? 'var(--accent2)' : 'var(--text3)', fontWeight: favOnly ? 700 : 400}}>
              ⭐ {stats.fav} {favOnly ? '· 해제' : '즐겨찾기'}
            </button>
            <button onClick={() => { setView('own'); setFavOnly(false); setKeepOnly(k => !k); }}
              style={{background:'none', border:'none', padding:0, cursor:'pointer', fontSize:13,
                      color: keepOnly ? 'var(--accent2)' : 'var(--text3)', fontWeight: keepOnly ? 700 : 400}}>
              🔒 {stats.keep} {keepOnly ? '· 해제' : 'KEEP'}
            </button>
            {/* 정렬 기준 — 지금까지는 등록순 고정이었습니다 */}
            <div style={{marginLeft:'auto', position:'relative'}}>
              <button onClick={() => setSortOpen(o => !o)}
                style={{background:'none', border:'none', padding:0, cursor:'pointer', fontSize:12.5, color:'var(--text3)'}}>
                ↕ {(SORTS[sortKey] || SORTS[SORT_DEFAULT]).label}
              </button>
              {sortOpen && (
                <div className="card" style={{position:'absolute', right:0, top:22, zIndex:40, margin:0, padding:6, minWidth:124}}>
                  {Object.entries(SORTS).map(([k, s]) => (
                    <button key={k} onClick={() => pickSort(k)}
                      style={{display:'block', width:'100%', textAlign:'left', background: sortKey === k ? 'var(--accent-soft)' : 'none',
                              border:'none', padding:'8px 10px', borderRadius:8, cursor:'pointer', fontSize:13,
                              color: sortKey === k ? 'var(--accent2)' : 'var(--text2)', fontWeight: sortKey === k ? 700 : 400}}>
                      {s.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {individuals.length > 0 && (
          <div className="chip-row" style={{padding:'10px 16px 2px', marginTop:0}}>
            {[['own','🏠 축양'],['sale','🏷️ 분양'],['mating','💞 메이팅'],['laying','🥚 산란'],['hatch','🐣 해칭']].map(([k, l]) => (
              <button key={k} className="chip-btn"
                style={{flexShrink:0, whiteSpace:'nowrap', ...(view === k ? {background:'var(--accent-soft)', fontWeight:700} : {})}}
                onClick={() => setView(k)}>{l}</button>
            ))}
          </div>
        )}

        {view === 'sale' && individuals.length > 0 && (
          <>
            <div style={{display:'flex', gap:6, padding:'10px 16px 0'}}>
              {[['available','분양가능'],['reserved','예약중'],['sold',`분양완료${stats.sold ? ' ' + stats.sold : ''}`]].map(([k, l]) => (
                <button key={k} className="chip-btn" style={{fontSize:12, padding:'6px 11px', ...(saleFilter === k ? {background:'var(--accent-soft)', fontWeight:700} : {})}} onClick={() => setSaleFilter(k)}>{l}</button>
              ))}
            </div>
            {/* 분양가가 비어 있는 아이들 — 한 번에 채울 수 있게 */}
            {missingPrice.length > 0 && (
              <div style={{margin:'10px 16px 0', padding:'9px 12px', borderRadius:10, background:'var(--accent-soft)',
                           border:'1px solid var(--accent-edge)', display:'flex', alignItems:'center', gap:10, fontSize:12.5}}>
                <span style={{color:'var(--accent2)', flex:1}}>분양가가 비어 있는 아이 <b>{missingPrice.length}마리</b></span>
                <button className="btn btn-primary btn-sm" style={{width:'auto', padding:'6px 12px'}}
                  onClick={() => setFillQueue(missingPrice.map(i => i.id))}>채우기</button>
              </div>
            )}
          </>
        )}

        {view === 'own' && namePlans.length > 0 && (
          <div style={{margin:'10px 16px 0', padding:'9px 12px', borderRadius:10, background:'var(--accent-soft)',
                       border:'1px solid var(--accent-edge)', fontSize:12.5}}>
            <div style={{color:'var(--accent2)', marginBottom:6}}>
              형제와 이름 규칙이 다른 아이 <b>{namePlans.length}마리</b>
            </div>
            <div style={{color:'var(--text3)', fontSize:11.5, lineHeight:1.6, marginBottom:8}}>
              {namePlans.slice(0, 4).map(p => `${p.from} → ${p.to}`).join(' · ')}
              {namePlans.length > 4 ? ` 외 ${namePlans.length - 4}건` : ''}
            </div>
            <button className="btn btn-primary btn-sm" style={{width:'auto', padding:'6px 12px'}}
              onClick={() => {
                const n = applyNameFixes(namePlans);
                refreshIndividuals();
                showToast(n ? `✏️ ${n}마리 이름을 맞췄어요` : '바꿀 수 있는 이름이 없어요');
              }}>이름 맞추기</button>
          </div>
        )}

        {view === 'own' && (
          <>
            {ownList.length === 0 && (
              <div className="empty">
                <div className="empty-icon">{favOnly ? '⭐' : '🦎'}</div>
                <p>{favOnly ? '즐겨찾기한 아이가 없어요.\n개체 카드의 ☆ 를 눌러 즐겨찾기에 추가해보세요.' : (individuals.length === 0 ? '아직 등록된 개체가 없어요.\n아래 💬 대화 버튼을 누르고 말씀해보세요.\n예) "크한이 12그램"' : '검색 결과가 없어요.')}</p>
              </div>

            <div className="section-title" style={{display: ownList.length ? 'block' : 'none'}}>{favOnly ? '⭐ 즐겨찾기' : '내 개체'}</div>

            ))}

        {view === 'sale' && (
          <>

              <div className="empty" style={{padding:'40px 20px'}}>

              </div>
            )}
            {saleList.map(gecko => (
              <GeckoCard key={gecko.id} gecko={gecko} onClick={() => navigate('profile', { gecko })} onToggleFav={toggleFav} />
            ))}
          </>
        )}

        {view === 'mating' && <MatingView individuals={individuals} navigate={navigate} showToast={showToast} />}
        {view === 'laying' && <LayingView individuals={individuals} navigate={navigate} showToast={showToast} />}
        {view === 'hatch' && <HatchView individuals={individuals} refreshIndividuals={refreshIndividuals} showToast={showToast} navigate={navigate} />}

        <div style={{height: 16}} />
      </div>

      {/* 빠진 분양가를 앞에서부터 하나씩 채웁니다 */}
      {fillQueue.length > 0 && (
        <SalePrompt
          gecko={individuals.find(i => i.id === fillQueue[0])}
          onClose={() => setFillQueue([])}
          onDone={() => {
            const rest = fillQueue.slice(1);
            setFillQueue(rest);
            refreshIndividuals();
            if (!rest.length) showToast('🤝 분양가 정리 완료');
          }} />
      )}
    </>
  );
