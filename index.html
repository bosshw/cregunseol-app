                  {fmtDate(gecko.hatchDate)} 출생 ({age}일)
                </div>
              )}
            </div>
          </div>

          {/* 빠른 통계 */}
          <div style={{display:'flex', gap:10, marginTop:14}}>
            {lastWeight && (
              <div style={{flex:1, background:'var(--bg3)', borderRadius:8, padding:'8px 10px', border:'1px solid var(--border)'}}>
                <div style={{fontSize:16, fontWeight:700, color:'var(--accent2)'}}>{lastWeight.data.weight}g</div>
                <div style={{fontSize:10, color:'var(--text3)'}}>최근 몸무게</div>
              </div>
            )}
            <div style={{flex:1, background:'var(--bg3)', borderRadius:8, padding:'8px 10px', border:'1px solid var(--border)'}}>
              <div style={{fontSize:16, fontWeight:700, color:'var(--accent2)'}}>{events.length}</div>
              <div style={{fontSize:10, color:'var(--text3)'}}>기록 수</div>
            </div>
          </div>
        </div>
      </div>

      {/* 공유 박스 */}
      {SHOW_SHARE && showShare && (
        <div style={{padding:'0 16px 10px'}}>
          <div className="share-box">
            <div style={{fontSize:12, color:'var(--text3)', marginBottom:6}}>공유 코드</div>
            <div className="share-code">{gecko.shareCode}</div>
            <div style={{fontSize:11, color:'var(--text3)', marginTop:6}}>Powered by 크레건설</div>
            <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={() => {
              navigator.clipboard?.writeText(gecko.shareCode);
              showToast('코드 복사됨!');
            }}>📋 코드 복사</button>
          </div>
        </div>
      )}

      {/* 기록 추가 → 동일한 대화형 화면으로 */}
      <div style={{padding:'0 16px 10px'}}>
        <button className="btn btn-primary" onClick={() => navigate('chat', { presetGecko: gecko })}>
          💬 {gecko.name} 기록하기
        </button>
      </div>

      <div style={{padding:'0 16px 4px'}}>
        <div style={{fontSize:11, color:'var(--text3)', marginBottom:4}}>
          분양 상태{salePriceOf(gecko) ? ` · 분양가 ${wonText(salePriceOf(gecko))}` : ''}
          {gecko.status === 'sold' && !salePriceOf(gecko) && (
            <button onClick={() => setSalePrompt(true)}
              style={{background:'none', border:'none', padding:'0 0 0 6px', cursor:'pointer', fontSize:11, color:'var(--accent2)', fontWeight:700, textDecoration:'underline'}}>
              분양가 적기
            </button>
          )}
        </div>
        <div style={{display:'flex', gap:6, overflowX:'auto', paddingBottom:8}}>
          {Object.entries(STATUS).map(([k, s]) => (
            <button key={k} className="chip-btn" style={(gecko.status || 'own') === k ? {background:'var(--accent-soft)', fontWeight:700} : {}}
              onClick={() => {
                if ((gecko.status || 'own') === k) { if (k === 'sold') setSalePrompt(true); return; }
                // KEEP인 아이를 내놓으려 하면 한 번 물어봅니다 (실수 방지)
                if (gecko.keep && SALE_STATUS.includes(k)) { setKeepAsk(k); return; }
                if (k === 'sold') { setSalePrompt(true); return; }
                DB.updateIndividual(gecko.id, { status: k }); refreshLocal(); showToast(`${s.label} 변경 완료`);
              }}>
              {s.label}
            </button>
          ))}
        </div>
      </div>

      <WeightChart events={events} />

      <PedigreeCard gecko={gecko} navigate={navigate} />

      <div className="section-title">활동 기록 {events.length > 0 ? `(${events.length})` : ''}</div>

      {events.length === 0 ? (
        <div className="empty" style={{padding:'30px 20px'}}>
          <div className="empty-icon" style={{fontSize:36}}>📋</div>
          <p>아직 기록이 없어요. 위 버튼으로 첫 기록을 남겨보세요.</p>
        </div>
      ) : (
        <div className="timeline">
          {[...events].sort((a,b) => b.date > a.date ? 1 : -1).map(ev => {
            const t = EVENT_TYPES.find(e => e.key === ev.type);
            const isEditing = editingId === ev.id;
            return (
              <div key={ev.id} className="timeline-item">
                <div className="timeline-dot" style={{background: t?.color || 'var(--text3)'}} />
                <div className="timeline-content">
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div className="timeline-type">{t?.emoji} {t?.label}</div>
                    <div style={{display:'flex', gap:12}}>
                      <button onClick={() => {
                        setConfirmDelEvent(null);
                        if (isEditing) { setEditingId(null); return; }
                        setEditVals({ date: ev.date, main: mainValOf(ev), notes: (ev.data && ev.data.notes) || '', photo: (ev.data && ev.data.photo) || '' });
                        setEditingId(ev.id);
                      }} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>✏️</button>
                      <button onClick={() => { setEditingId(null); setConfirmDelEvent(ev.id); }} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>🗑️</button>
                    </div>
                  </div>

                  {confirmDelEvent === ev.id ? (
                    <div style={{marginTop:6}}>
                      <div style={{fontSize:12, color:'var(--danger)', marginBottom:6}}>이 기록을 삭제할까요?</div>
                      <div style={{display:'flex', gap:6}}>
                        <button className="btn btn-danger btn-sm" style={{flex:1}} onClick={() => { DB.deleteEvent(ev.id); setConfirmDelEvent(null); refreshLocal(); showToast('기록 삭제 완료'); }}>삭제</button>
                        <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setConfirmDelEvent(null)}>취소</button>
                      </div>
                    </div>
                  ) : isEditing ? (
                    <div style={{marginTop:6, display:'flex', flexDirection:'column', gap:6}}>
                      <input type="date" className="input" style={{padding:'8px 10px', fontSize:13}} value={editVals.date || ''} onChange={e => setEditVals(v => ({ ...v, date: e.target.value }))} />
                      {mainKeyOf(ev) && (
                        <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder={mainLabelOf(ev)} value={editVals.main} onChange={e => setEditVals(v => ({ ...v, main: e.target.value }))} />
                      )}
                      <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder="메모" value={editVals.notes} onChange={e => setEditVals(v => ({ ...v, notes: e.target.value }))} />
                      <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                        {editVals.photo ? (
                          <>
                            <img src={editVals.photo} alt="첨부" style={{width:52, height:52, borderRadius:8, objectFit:'cover', border:'1px solid var(--border)'}} />
                            <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => eventPhotoRef.current && eventPhotoRef.current.click()}>사진 변경</button>
                            <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setEditVals(v => ({ ...v, photo: '' }))}>제거</button>
                          </>
                        ) : (
                          <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => eventPhotoRef.current && eventPhotoRef.current.click()}>📷 사진 첨부</button>
                        )}
                      </div>
                      <div style={{display:'flex', gap:6}}>
                        <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => {
                          const data = { ...(ev.data || {}), notes: editVals.notes };
                          const mk = mainKeyOf(ev);
                          if (mk) data[mk] = editVals.main;
                          if (editVals.photo) data.photo = editVals.photo; else delete data.photo;
                          DB.updateEvent(ev.id, { date: editVals.date || ev.date, data });
                          setEditingId(null); refreshLocal(); showToast('수정 완료');
                        }}>저장</button>
                        <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setEditingId(null)}>취소</button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="timeline-detail">{formatEventDetail(ev)}</div>
                      {ev.data?.photo && (
                        <img src={ev.data.photo} alt="기록 사진" style={{maxWidth:150, borderRadius:8, marginTop:6, display:'block', border:'1px solid var(--border)', cursor:'pointer'}}
                          onClick={() => setPhotoView({ src: ev.data.photo, date: ev.date })} />
                      )}
                      {ev.data?.notes && ev.type !== 'feeding' && ev.type !== 'memo' && (
                        <div style={{fontSize:12, color:'var(--text3)', marginTop:2}}>{ev.data.notes}</div>
                      )}
                      <div className="timeline-date">{fmtDate(ev.date)}</div>
                    </>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* 삭제 */}
      <div style={{padding:'20px 16px 16px'}}>
        {!confirmDelete ? (
          <button className="btn btn-danger btn-sm" onClick={() => setConfirmDelete(true)}>🗑️ 개체 삭제</button>
        ) : (
          <div>
            <div style={{fontSize:13, color:'var(--danger)', marginBottom:8}}>{gecko.name}를 정말 삭제할까요? 모든 기록이 사라져요.</div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn-danger" onClick={handleDelete} style={{flex:1}}>삭제</button>
              <button className="btn btn-secondary" onClick={() => setConfirmDelete(false)} style={{flex:1}}>취소</button>
            </div>
          </div>
        )}
      </div>

      <input ref={eventPhotoRef} type="file" accept="image/*" style={{display:'none'}} onChange={onEventPhoto} />

      {/* 사진 크게 보기 + 다운로드 + 대표사진 */}
      {salePrompt && (
        <SalePrompt gecko={gecko} onClose={() => setSalePrompt(false)}
          onDone={(r) => {
            setSalePrompt(false); refreshLocal();
            showToast(r.won ? `🤝 분양완료 · ${wonText(r.won)}` : '🤝 분양완료로 바꿨어요');
          }} />
      )}

      {keepAsk && (
        <div style={{position:'fixed', inset:0, background:'rgba(30,20,15,.72)', zIndex:210, display:'flex',
                     alignItems:'center', justifyContent:'center', padding:18}} onClick={() => setKeepAsk(null)}>
          <div className="card" style={{margin:0, width:'100%', maxWidth:320}} onClick={e => e.stopPropagation()}>
            <div style={{fontSize:14, fontWeight:800, marginBottom:6}}>이 아이는 KEEP이에요</div>
            <div style={{fontSize:12.5, color:'var(--text2)', lineHeight:1.6, marginBottom:14}}>
              {gecko.name}는 데리고 계실 아이로 표시돼 있어요.<br/>
              {(STATUS[keepAsk] || STATUS.own).label} 로 바꾸면 KEEP이 풀립니다.
            </div>
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => {
                const k = keepAsk; setKeepAsk(null);
                if (k === 'sold') { DB.updateIndividual(gecko.id, { keep: false }); refreshLocal(); setSalePrompt(true); return; }
                DB.updateIndividual(gecko.id, { status: k, keep: false }); refreshLocal();
                showToast(`${(STATUS[k] || STATUS.own).label} 변경 완료 · KEEP 해제`);
              }}>KEEP 풀고 바꾸기</button>
              <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setKeepAsk(null)}>그대로 두기</button>
            </div>
          </div>
        </div>
      )}

      {photoView && (
        <div style={{position:'fixed', inset:0, background:'rgba(30,20,15,.88)', zIndex:200, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14, padding:20}} onClick={() => setPhotoView(null)}>
          <img src={photoView.src} alt="사진 크게 보기" style={{maxWidth:'92%', maxHeight:'68%', borderRadius:12}} onClick={e => e.stopPropagation()} />
          <div style={{display:'flex', gap:8, flexWrap:'wrap', justifyContent:'center'}} onClick={e => e.stopPropagation()}>
            <a className="btn btn-primary btn-sm" style={{width:'auto', textDecoration:'none'}} href={photoView.src} download={`${gecko.name}_${photoView.date}.jpg`}>⬇ 다운로드</a>
            <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => { DB.updateIndividual(gecko.id, { avatar: photoView.src }); refreshLocal(); showToast('⭐ 대표사진 설정 완료'); setPhotoView(null); }}>⭐ 대표사진으로</button>
            <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setPhotoView(null)}>닫기</button>
          </div>
        </div>
      )}
    </div>
  );
}

function formatEventDetail(ev) {
  const d = ev.data || {};
  switch (ev.type) {
    case 'growth':       return d.weight ? `${d.weight}g` : '성장 기록';
    case 'mating':       return d.partnerName ? `파트너: ${d.partnerName}` : '메이팅 기록';
    case 'laying': {
      const base = d.eggCount ? `알 ${d.eggCount}개 산란${d.sireName ? ' (부: ' + d.sireName + ')' : ''}` : '산란 기록';
      return d.diffDays !== undefined ? `${base} · 🎯 ${diffPhrase(d.diffDays)}` : base;
    }
    case 'hatching': {
      const base = d.count ? `${d.count}마리 부화` : '해칭 기록';
      return d.diffDays !== undefined ? `${base} · 🎯 ${diffPhrase(d.diffDays)}` : base;
    }
    case 'distribution': return d.price ? `${Number(d.price).toLocaleString()}원에 분양` : '분양 기록';
    case 'shed':         return '탈피 완료';
    case 'feeding': {
      if (d.skipped) return '⏭️ 오늘은 안 줌';
      const f = d.foodType ? `${d.foodType === '충식' ? '🦗 충식' : '🥣 슈푸(일반식)'}` : '먹이';
      if (d.ate === false) return `🚫 ${f} 안 먹음`;
      return d.foodType ? `${f} 급여` : (d.notes || '먹이 급여');
    }
    case 'photo':        return '사진 기록';
    case 'memo':         return d.notes || '메모';
    default:             return '';
  }
}

/* ══════════════════════════════════════════
   캘린더 화면
   ══════════════════════════════════════════ */
function CalendarScreen({ navigate, individuals, showToast, onRemindersChanged }) {
  const [cur, setCur] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [ver, setVer] = useState(0);                 // 데이터 변경 시 리렌더
  const [selected, setSelected] = useState(null);    // 선택된 날짜 'YYYY-MM-DD'
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ indId: '', type: 'growth', main: '', notes: '' });
  const [editingEv, setEditingEv] = useState(null);  // 수정 중인 이벤트 id
  const [editVals, setEditVals] = useState({});
  const [confirmDel, setConfirmDel] = useState(null); // {kind, id}
  const refresh = () => setVer(v => v + 1);
  const closePanels = () => { setAdding(false); setEditingEv(null); setConfirmDel(null); };
  const byId = {};
  individuals.forEach(i => { byId[i.id] = i; });

  // 이 달의 항목 수집: 예정(리마인더) + 실제(이벤트, 전체 종류)
  const items = {}; // 'YYYY-MM-DD' -> [{emoji, label, name, planned, reminder?, event?}]
  const add = (ds, it) => { (items[ds] = items[ds] || []).push(it); };
  allAlerts().forEach(r => {
    const base = r.type === 'laying_expected' ? { emoji: '🥚', label: '산란 예정' }
      : r.type === 'hatching_expected' ? { emoji: '🐣', label: r.message || '부화 예정' }
      : { emoji: '🔔', label: r.message || '알림' };
    add(r.date, { ...base, name: r.geckoName || '', planned: true, reminder: r });
  });
  // 캘린더에는 "일정"만 — 개체별 메모·사진·무게 같은 기록은 각 개체 프로필에서 봅니다
  // 산란·해칭은 알림과 같은 양식("엄마 × 아빠 · N차")으로 맞춥니다
  const cRows = clutchRows(individuals, DB.getEvents());
  const byLaying = {}; cRows.forEach(r => { byLaying[r.e.id] = r; });
  const byHatchEv = {}; cRows.forEach(r => { if (r.hatched) byHatchEv[r.hatched.id] = r; });
  DB.getEvents().forEach(e => {
    if (!CALENDAR_TYPES.includes(e.type)) return;
    const t = EVENT_TYPES.find(x => x.key === e.type) || {};
    let name = (byId[e.individualId] || {}).name || '';
    let label = t.label || e.type;
    if (e.type === 'laying' && byLaying[e.id]) {
      name = byLaying[e.id].pairName; label = `${byLaying[e.id].nth}차 산란`;
    } else if (e.type === 'hatching' && byHatchEv[e.id]) {
      name = byHatchEv[e.id].pairName; label = `${byHatchEv[e.id].nth}차 해칭`;
    } else if (e.type === 'mating') {
      const p = (e.data && e.data.partnerName) || (byId[e.data && e.data.partnerId] || {}).name;
      if (p) name = `${name} × ${p}`;
    }
    add(e.date, { emoji: t.emoji || '📌', label, name, event: e });
  });

  const startDow = new Date(cur.y, cur.m, 1).getDay();
  const daysInMonth = new Date(cur.y, cur.m + 1, 0).getDate();
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => `${cur.y}-${pad(cur.m + 1)}-${pad(d)}`;
  const today = todayStr();
  const prev = () => { setCur(c => { const m = c.m - 1; return m < 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m }; }); setSelected(null); closePanels(); };
  const next = () => { setCur(c => { const m = c.m + 1; return m > 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m }; }); setSelected(null); closePanels(); };

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthItems = Object.entries(items)
    .filter(([ds]) => ds.startsWith(`${cur.y}-${pad(cur.m + 1)}`))
    .sort((a, b) => a[0] > b[0] ? 1 : -1);

  /* ── 선택 날짜 항목 삭제/수정/추가 ── */
  const deleteReminder = (id) => {
    DB.saveReminders(DB.getReminders().filter(r => r.id !== id));
    setConfirmDel(null); refresh(); onRemindersChanged && onRemindersChanged();
    showToast('예정 삭제 완료');
  };
  const deleteEvent = (id) => {
    DB.deleteEvent(id);
    setConfirmDel(null); refresh();
    showToast('기록 삭제 완료');
  };
  const startEdit = (ev) => {
    setConfirmDel(null); setAdding(false);
    setEditVals({ date: ev.date, main: mainValOf(ev), notes: (ev.data && ev.data.notes) || '' });
    setEditingEv(ev.id);
  };
  const saveEdit = (ev) => {
    const data = { ...(ev.data || {}), notes: editVals.notes };
    const mk = mainKeyOf(ev);
    if (mk) data[mk] = editVals.main;
    DB.updateEvent(ev.id, { date: editVals.date || ev.date, data });
    setEditingEv(null); refresh();
    showToast('수정 완료');
  };
  const saveNew = () => {
    if (!selected) return;
    if (form.type === 'reminder') {
      if (!form.notes.trim() && !form.indId) { showToast('알림 내용을 입력해주세요'); return; }
      const g = byId[form.indId];
      const rs = DB.getReminders();
      rs.push({ id: uuid(), individualId: form.indId || null, geckoName: g ? g.name : '', type: 'custom', date: selected, message: form.notes.trim() || '알림' });
      DB.saveReminders(rs);
      onRemindersChanged && onRemindersChanged();
    } else {
      if (!form.indId) { showToast('개체를 선택해주세요'); return; }
      const mk = (MAIN_FIELD[form.type] || [null])[0];
      const data = { notes: form.notes.trim() };
      if (mk && form.main.trim()) data[mk] = form.main.trim();
      DB.addEvent({ individualId: form.indId, type: form.type, date: selected, data });
    }
    setAdding(false);
    setForm({ indId: '', type: 'growth', main: '', notes: '' });
    refresh();
    showToast('✅ 추가 완료');
  };

  const selItems = selected ? (items[selected] || []) : [];
  const selMainLabel = (MAIN_FIELD[form.type] || [null, ''])[1];

  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  return (
    <div className="screen">
      <div className="header"><h1>📅 캘린더</h1></div>
      <div style={{padding:'12px 16px'}}>
        <div className="card" style={{margin:0}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
            <button className="chip-btn" style={{padding:'6px 13px'}} onClick={prev}>‹</button>
            <div style={{fontSize:16, fontWeight:800}}>{cur.y}년 {cur.m + 1}월</div>
            <button className="chip-btn" style={{padding:'6px 13px'}} onClick={next}>›</button>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, textAlign:'center'}}>
            {WD.map((w, i) => (
              <div key={w} style={{fontSize:11, fontWeight:700, padding:'4px 0', color: i === 0 ? '#C2607E' : i === 6 ? '#4A6FA5' : 'var(--text3)'}}>{w}</div>
            ))}
            {cells.map((d, i) => {
              if (d === null) return <div key={'e' + i} />;
              const ds = dstr(d);
              const its = items[ds] || [];
              const isToday = ds === today;
              const isSel = ds === selected;
              return (
                <div key={ds}
                  onClick={() => { setSelected(isSel ? null : ds); closePanels(); }}
                  style={{minHeight:46, borderRadius:8, padding:'3px 1px', cursor:'pointer',
                    border: isSel ? '2px solid var(--accent)' : isToday ? '1.5px solid var(--accent-dim)' : '1px solid transparent',
                    background: isSel ? 'var(--accent-soft)' : its.length ? 'var(--bg3)' : 'transparent'}}>
                  <div style={{fontSize:11, fontWeight: (isToday || isSel) ? 800 : 500, color: (isToday || isSel) ? 'var(--accent2)' : 'var(--text2)'}}>{d}</div>
                  <div style={{display:'flex', flexWrap:'wrap', justifyContent:'center', gap:1, lineHeight:1}}>
                    {its.slice(0, 3).map((it, j) => (
                      <span key={j} style={{fontSize:10, opacity: it.planned ? 0.55 : 1}}>{it.emoji}</span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div style={{fontSize:12, color:'var(--text3)', margin:'8px 4px 4px', lineHeight:1.6}}>
          💞 메이팅 · 🥚 산란 · 🐣 해칭 · 🍽️ 먹이 · <span style={{opacity:.55}}>흐린 아이콘은 예정일</span><br/>
          메모·사진·몸무게는 각 개체 프로필에서 볼 수 있어요 · 날짜를 누르면 추가/수정
        </div>

        {/* ── 선택된 날짜 패널 ── */}
        {selected && (
          <div className="card" style={{margin:'10px 0 0', border:'1.5px solid var(--accent-dim)'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <div style={{fontSize:14, fontWeight:800, color:'var(--accent2)'}}>📌 {fmtDate(selected)}</div>
              <button onClick={() => { setSelected(null); closePanels(); }} style={{background:'none', border:'none', color:'var(--text3)', cursor:'pointer', fontSize:16}}>✕</button>
            </div>

            {selItems.length === 0 && !adding && (
              <div style={{fontSize:13, color:'var(--text3)', marginBottom:8}}>이 날짜에는 아직 예정·기록이 없어요.</div>
            )}

            {selItems.map((it, j) => {
              const ev = it.event;
              const isEditing = ev && editingEv === ev.id;
              const delKey = it.reminder ? 'r' + it.reminder.id : 'e' + (ev && ev.id);
              return (
                <div key={j} style={{borderBottom:'1px solid var(--border)', padding:'7px 0'}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div style={{fontSize:13, color:'var(--text2)'}}>
                      {it.emoji} {it.name ? it.name + ' · ' : ''}{ev ? formatEventDetail(ev) || it.label : it.label}{it.planned ? ' (예정)' : ''}
                    </div>
                    <div style={{display:'flex', gap:10, flexShrink:0}}>
                      {ev && <button onClick={() => isEditing ? setEditingEv(null) : startEdit(ev)} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>✏️</button>}
                      {/* 부화 예정은 산란기록에서 계산한 것이라 따로 지우지 않습니다 */}
                      {!(it.reminder && it.reminder.derived) && (
                        <button onClick={() => { setEditingEv(null); setAdding(false); setConfirmDel(confirmDel === delKey ? null : delKey); }} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>🗑️</button>
                      )}
                    </div>
                  </div>

                  {confirmDel === delKey && (
                    <div style={{display:'flex', gap:6, marginTop:6, alignItems:'center'}}>
                      <span style={{fontSize:12, color:'var(--danger)', flex:1}}>삭제할까요?</span>
                      <button className="btn btn-danger btn-sm" style={{width:'auto'}} onClick={() => it.reminder ? deleteReminder(it.reminder.id) : deleteEvent(ev.id)}>삭제</button>
                      <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setConfirmDel(null)}>취소</button>
                    </div>
                  )}

                  {isEditing && (
                    <div style={{marginTop:6, display:'flex', flexDirection:'column', gap:6}}>
                      <input type="date" className="input" style={{padding:'8px 10px', fontSize:13}} value={editVals.date || ''} onChange={e => setEditVals(v => ({ ...v, date: e.target.value }))} />
                      {mainKeyOf(ev) && (
                        <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder={mainLabelOf(ev)} value={editVals.main} onChange={e => setEditVals(v => ({ ...v, main: e.target.value }))} />
                      )}
                      <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder="메모" value={editVals.notes} onChange={e => setEditVals(v => ({ ...v, notes: e.target.value }))} />
                      <div style={{display:'flex', gap:6}}>
                        <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => saveEdit(ev)}>저장</button>
                        <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setEditingEv(null)}>취소</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* ── 이 날짜에 추가 ── */}
            {adding ? (
              <div style={{marginTop:10, display:'flex', flexDirection:'column', gap:6}}>
                <select className="input" style={{padding:'10px 12px', fontSize:14}} value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
                  {EVENT_TYPES.map(t => <option key={t.key} value={t.key}>{t.emoji} {t.label}</option>)}
                  <option value="reminder">🔔 알림 (직접 추가)</option>
                </select>
                <select className="input" style={{padding:'10px 12px', fontSize:14}} value={form.indId} onChange={e => setForm(f => ({ ...f, indId: e.target.value }))}>
                  <option value="">{form.type === 'reminder' ? '개체 선택 (선택사항)' : '개체 선택'}</option>
                  {individuals.filter(i => !i.isExternal).map(i => <option key={i.id} value={i.id}>{genderEmoji(i.gender)} {i.name}</option>)}
                </select>
                {form.type !== 'reminder' && selMainLabel && (
                  <input className="input" style={{padding:'10px 12px', fontSize:14}} placeholder={selMainLabel} value={form.main} onChange={e => setForm(f => ({ ...f, main: e.target.value }))} />
                )}
                <input className="input" style={{padding:'10px 12px', fontSize:14}} placeholder={form.type === 'reminder' ? '알림 내용 (예: 온도 점검)' : '메모 (선택)'} value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} />
                <div style={{display:'flex', gap:6}}>
                  <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={saveNew}>추가</button>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setAdding(false)}>취소</button>
                </div>
              </div>
            ) : (
              <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={() => { setAdding(true); setEditingEv(null); setConfirmDel(null); }}>＋ 이 날짜에 기록·알림 추가</button>
            )}
          </div>
        )}

        {monthItems.length === 0 ? (
          <div className="empty" style={{padding:'30px 20px'}}>
            <div className="empty-icon" style={{fontSize:36}}>📅</div>
            <p>이 달 예정·기록이 없어요.{'\n'}날짜를 눌러 직접 추가하거나,{'\n'}메이팅·산란을 기록하면 예정일이 자동 표시돼요.</p>
          </div>
        ) : monthItems.map(([ds, its]) => {
          const dleft = Math.ceil((new Date(ds) - new Date(today)) / 86400000);
          return (
            <div className="card" key={ds} style={{margin:'8px 0 0', padding:'10px 14px', cursor:'pointer'}} onClick={() => { setSelected(ds); closePanels(); }}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4}}>
                <div style={{fontSize:12, fontWeight:700, color:'var(--accent2)'}}>{fmtDate(ds)}</div>
                <div style={{fontSize:11, color: dleft === 0 ? 'var(--accent)' : 'var(--text3)'}}>
                  {dleft === 0 ? '오늘' : dleft > 0 ? `D-${dleft}` : `${-dleft}일 전`}
                </div>
              </div>
              {its.map((it, j) => (
                <div key={j} style={{fontSize:13, color:'var(--text2)', padding:'2px 0'}}>
                  {it.emoji} {it.name ? it.name + ' · ' : ''}{it.label}{it.planned ? ' (예정)' : ''}
                </div>
              ))}
            </div>
          );
        })}
        <div style={{height:16}} />
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   알림 화면
   ══════════════════════════════════════════ */
const WEEK_WINDOW = 7;   // 예정일은 1주일 전부터 화면에 띄웁니다
const FEED_DUE = 4;      // 마지막 급여로부터 이 일수가 지나면 "밥 줄 아이"

/* 오늘 실제로 손이 가야 하는 일들을 뽑아냅니다.
   D-day 나열이 아니라 "지금 하러 가는 버튼"이 되도록 만듭니다. */
function buildTodo(reminders, navigateTo) {
  const inds = DB.getIndividuals();
  const byId = {}; inds.forEach(i => { byId[i.id] = i; });
  const evs = DB.getEvents();
  const todo = [];

  // ① 부화·산란 예정일이 오늘이거나 지난 것 → 확인하러 가기
  reminders.filter(r => daysUntil(r.date) <= 0).forEach(r => {
    const late = -daysUntil(r.date);
    const hatch = r.type === 'hatching_expected';
    if (!hatch && r.type !== 'laying_expected') {
      todo.push({ id: r.id, emoji: '🔔', title: r.geckoName || '알림', sub: r.message || '',
        late, action: null });
      return;
    }
    // 부화 예정이면 그 알(클러치) 화면으로 바로 보냅니다
    const lay = hatch
      ? (r.layingId ? { id: r.layingId }
        : [...evs].filter(e => e.type === 'laying' && e.individualId === r.individualId && e.date <= r.date)
            .sort((a, b) => (a.date < b.date ? 1 : -1))[0])
      : null;
    todo.push({
      id: r.id,
      emoji: hatch ? '🐣' : '🥚',
      title: r.geckoName || '',
      sub: r.message || (hatch ? '부화했는지 알을 확인해주세요' : '산란했는지 확인해주세요'),
      late,
      action: hatch && lay ? { label: '알 보기', go: () => navigateTo('clutch', { layingId: lay.id }) }
        : byId[r.individualId] ? { label: '기록하기', go: () => navigateTo('profile', { gecko: byId[r.individualId] }) } : null,
    });
  });

  // ② 밥 주는 날 — 개체별이 아니라 "오늘 한 바퀴 돈다" 기준
  const fp = feedPlan(inds, evs);
  if (fp.due && fp.remaining.length) {
    todo.push({
      id: 'feed', emoji: '🦗', pinned: true,
      title: fp.dLeft === 0 ? '오늘 밥 주는 날' : `밥 주는 날 ${-fp.dLeft}일 지남`,
      sub: `${fp.inds.length}마리 중 ${fp.remaining.length}마리 남음` +
        (fp.lastRound ? ` · 지난 급여 ${fmtDate(fp.lastRound)}` : ' · 첫 급여 기록'),
      late: Math.max(0, -fp.dLeft),
      action: { label: '밥 주기', go: () => navigateTo('feeding') },
    });
  } else if (!fp.doneToday.size && fp.inds.length) {
    // 밥 주는 날이 아니어도 언제든 들어갈 수 있게 (지난 날짜로 적을 때 여기로 들어옵니다)
    todo.push({
      id: 'feed-open', emoji: '🦗', pinned: false,
      title: '밥 주기 기록',
      sub: (fp.lastRound ? `지난 급여 ${fmtDate(fp.lastRound)} · ` : '') +
        (fp.dLeft > 0 ? `다음은 ${fp.dLeft}일 뒤` : '오늘 줘도 됩니다') + ' · 날짜 골라 적기',
      late: -1,
      action: { label: '밥 주기', go: () => navigateTo('feeding') },
    });
  } else if (fp.doneToday.size && !fp.remaining.length) {
    // 오늘 한 바퀴 다 돌았으면 확인 문구로 바꿔줍니다
    todo.push({
      id: 'feed-done', emoji: '✅', title: '오늘 밥 다 줬어요',
      sub: `${fp.inds.length}마리 전부 확인 완료 · 다음 급여는 ${fmtDate(fp.nextDay)}`,
      late: 0, action: { label: '다시 보기', go: () => navigateTo('feeding') },
    });
  }

  // ③ 며칠째 안 먹는 아이 — 위험해지기 전에 짚어줍니다
  fp.worried.slice(0, 5).forEach(w => {
    todo.push({
      id: 'noeat:' + w.ind.id, emoji: '⚠️',
      title: `${w.ind.name} ${w.days}일째 안 먹어요`,
      sub: `마지막 섭취 ${fmtDate(w.last)} · 계속되면 병원 진료를 생각해보세요`,
      late: w.days,
      action: { label: '프로필', go: () => navigateTo('profile', { gecko: w.ind }) },
    });
  });

  // 밥 주는 날은 늘 맨 위에
  return todo.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.late - a.late);
}

/* ══════════════════════════════════════════
   밥 주기 화면 — 오늘 한 바퀴 돌면서 한 마리씩 체크
   ══════════════════════════════════════════ */
function FeedingScreen({ navigate, showToast, refreshIndividuals }) {
  const [ver, setVer] = useState(0);
  const [foodType, setFoodType] = useState(() => (DB.getSettings() || {}).lastFoodType || '슈푸');
  const bump = () => { setVer(v => v + 1); refreshIndividuals && refreshIndividuals(); };
  const fp = feedPlan();
  // 밥 준 날 — 자정을 넘겨 체크하는 일이 많아서 날짜를 고를 수 있게 합니다
  const [today, setToday] = useState(todayStr());

  // 그날 이미 찍은 기록 (다시 누르면 바꿔 끼웁니다)
  const todayBy = {};
  fp.evs.filter(e => e.date === today).forEach(e => { todayBy[e.individualId] = e; });

  const mark = (ind, kind) => {
    const prev = todayBy[ind.id];
    if (prev) DB.deleteEvent(prev.id);
    const data = kind === 'ate' ? { ate: true, foodType }
      : kind === 'left' ? { ate: false, foodType, notes: '안 먹음' }
      : { skipped: true, notes: '건너뜀' };
    DB.addEvent({ individualId: ind.id, type: 'feeding', date: today, data });
    bump();
  };
  const undo = (ind) => { const prev = todayBy[ind.id]; if (prev) { DB.deleteEvent(prev.id); bump(); } };

  const allAte = () => {
    let n = 0;
    fp.inds.forEach(i => {
      if (todayBy[i.id]) return;
      DB.addEvent({ individualId: i.id, type: 'feeding', date: today, data: { ate: true, foodType } });
      n++;
    });
    DB.saveSettings({ ...DB.getSettings(), lastFoodType: foodType });
    bump();
    showToast(n ? `🦗 ${n}마리 급여 기록 완료` : '이미 다 체크했어요');
  };

  const doneCnt = fp.inds.filter(i => todayBy[i.id]).length;
  const nextAfter = localISO(new Date(new Date(today).getTime() + fp.interval * 86400000));
  const kindOf = (ind) => {
    const e = todayBy[ind.id];
    if (!e) return null;
    if (e.data && e.data.skipped) return 'skip';
    if (e.data && e.data.ate === false) return 'left';
    return 'ate';
  };

  return (
    <div className="screen">
      <div className="header">
        <div className="header-row">
          <button className="back-btn" onClick={() => navigate('reminders')}>‹ 알림</button>
          <span style={{fontSize:13, fontWeight:700, color:'var(--accent2)'}}>{doneCnt} / {fp.inds.length}</span>
        </div>
      </div>

      <div style={{padding:'12px 16px 0'}}>
        <div className="card" style={{margin:'0 0 12px'}}>
          <div style={{fontSize:15, fontWeight:800}}>🦗 {today === todayStr() ? '오늘' : fmtDate(today)} 밥 주기</div>
          <div style={{fontSize:12, color:'var(--text3)', marginTop:4}}>
            {fp.lastRound ? `지난 급여 ${fmtDate(fp.lastRound)} · ` : ''}{fp.interval}일 간격 · 다 주면 다음은 {fmtDate(nextAfter)}
          </div>
          {/* 밥 준 날 — 자정 넘겨 체크했을 때 어제로 돌려놓을 수 있습니다 */}
          <div style={{display:'flex', alignItems:'center', gap:8, marginTop:10}}>
            <span style={{fontSize:12, color:'var(--text3)', whiteSpace:'nowrap'}}>밥 준 날</span>
            <input className="input" type="date" style={{padding:'7px 9px', fontSize:13}}
              max={todayStr()} value={today} onChange={e => setToday(e.target.value || todayStr())} />
            {today !== todayStr() && (
              <button className="btn btn-secondary btn-sm" style={{width:'auto', whiteSpace:'nowrap'}}
                onClick={() => setToday(todayStr())}>오늘로</button>
            )}
          </div>
          {today !== todayStr() && (
            <div style={{fontSize:11.5, color:'var(--accent2)', marginTop:6}}>
              {fmtDate(today)}에 준 것으로 기록됩니다
            </div>
          )}
          <div style={{display:'flex', gap:6, marginTop:10}}>
            {['슈푸', '충식'].map(t => (
              <button key={t} className="filter-chip" style={foodType === t ? CHIP_ON : CHIP_OFF}
                onClick={() => setFoodType(t)}>{t}</button>
            ))}
          </div>
          <button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={allAte}>
            남은 {fp.inds.length - doneCnt}마리 전부 "먹었어요"로
          </button>
        </div>
      </div>

      <div style={{padding:'0 16px 20px'}}>
        {fp.inds.map(i => {
          const k = kindOf(i);
          const since = fp.ateBy[i.id] ? Math.floor((new Date(today) - new Date(fp.ateBy[i.id])) / 86400000) : null;
          const warn = since !== null && since >= feedWarn();
          return (
            <div className="card" key={i.id} style={{margin:'0 0 8px', padding:'10px 12px',
              borderLeft: k === 'ate' ? '3px solid #2E7D46' : k === 'left' ? '3px solid #C87F2F'
                : k === 'skip' ? '3px solid var(--text3)' : warn ? '3px solid var(--danger)' : '3px solid transparent'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8}}>
                <div style={{minWidth:0, flex:1}}>
                  <div style={{fontSize:14, fontWeight:700}}>
                    <GenderTag g={i.gender} size={13} /> {i.name}
                    {warn && <span style={{fontSize:11, color:'var(--danger)', marginLeft:6}}>{since}일째 안 먹음</span>}
                  </div>
                  <div style={{fontSize:11, color:'var(--text3)', marginTop:2}}>
                    {fp.ateBy[i.id] ? `마지막 섭취 ${fmtDate(fp.ateBy[i.id])}` : '섭취 기록 없음'}
                  </div>
                </div>
                {k ? (
                  <button className="btn btn-secondary btn-sm" style={{width:'auto', whiteSpace:'nowrap'}} onClick={() => undo(i)}>
                    {k === 'ate' ? '✅ 먹음' : k === 'left' ? '🚫 안 먹음' : '⏭️ 건너뜀'} 취소
                  </button>
                ) : (
                  <div style={{display:'flex', gap:4, flexShrink:0}}>
                    <button className="btn btn-secondary btn-sm" style={{width:'auto', padding:'6px 8px', fontSize:12}} onClick={() => mark(i, 'ate')}>✅</button>
                    <button className="btn btn-secondary btn-sm" style={{width:'auto', padding:'6px 8px', fontSize:12}} onClick={() => mark(i, 'left')}>🚫</button>
                    <button className="btn btn-secondary btn-sm" style={{width:'auto', padding:'6px 8px', fontSize:12}} onClick={() => mark(i, 'skip')}>⏭️</button>
                  </div>
                )}
              </div>
            </div>
          );
        })}
        <div style={{fontSize:11, color:'var(--text3)', textAlign:'center', padding:'8px 0'}}>
          ✅ 먹었어요 · 🚫 안 먹었어요 · ⏭️ 오늘은 안 줬어요
        </div>
        <div style={{fontSize:11, color:'var(--text3)', textAlign:'center'}}>
          {feedWarn()}일 넘게 안 먹은 아이는 알림에서 따로 알려드려요 (설정에서 조절)
        </div>
      </div>
    </div>
  );
}

  const later = all.filter(r => daysUntil(r.date) > WEEK_WINDOW);

            </div>

      {thisWeek.length > 0 && (

/* ══════════════════════════════════════════
   엑셀 내보내기 — 대표님 원본 「(주)크레건설 메인」 시트와 같은 모양으로
   시트 이름·제목행·4행 헤더·B열부터 시작까지 원본 그대로 맞춥니다.
   데이터가 있는 4시트만 넣습니다: 애기들 리스트 · 메이팅기록 · 해칭기록 · 분양리스트
   엑셀 도구(SheetJS)는 버튼을 누를 때만 불러옵니다(앱 시작 속도에 영향 없음).
   ══════════════════════════════════════════ */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error('엑셀 도구 로드 실패')));
    s.onerror = () => rej(new Error('엑셀 도구를 못 불러왔어요 (인터넷 확인)'));
    document.head.appendChild(s);
  });
}

// 2025-05-11 → 25.05.11
const xlDate = (iso) => {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[1].slice(2)}.${m[2]}.${m[3]}` : String(iso);
};
const xlGender = (g) => (g === 'female' ? '암' : g === 'male' ? '숫' : '미구분');

// 메모 한 줄을 원본 엑셀의 각 칸으로 되돌립니다. 없는 항목은 빈칸으로 둡니다.
function splitMemo(indId) {
  const out = { feat: '', source: '', blood: '', price: '', birthRaw: '', note: '' };
  const etc = [];
  DB.getEventsFor(indId).filter(e => e.type === 'memo').forEach(e => {
    String((e.data && e.data.notes) || '').split('·').map(s => s.trim()).filter(Boolean).forEach(p => {
      let m;
      if ((m = p.match(/^모프\s*특징\s*:\s*(.+)$/))) { out.feat = out.feat || m[1]; }
      else if ((m = p.match(/^입양처\s*:\s*(.+)$/))) { out.source = out.source || m[1]; }
      else if ((m = p.match(/^혈통\s*:\s*(.+)$/))) { out.blood = out.blood || m[1]; }
      else if ((m = p.match(/^입양가\s*([\d.]+)\s*만원$/))) { out.price = out.price || m[1]; }
      else if (/^입양가\s*0\b/.test(p)) { out.price = out.price || '0'; }
      else if ((m = p.match(/^출생\s+(\S+)/))) { out.birthRaw = out.birthRaw || m[1]; }
      else if (/^분양처\s*:/.test(p)) { /* 분양리스트에서 따로 처리 */ }
      else etc.push(p);
    });
  });
  out.note = etc.join(' · ');
  return out;
}

// 분양 기록에서 입양자·분양가(만원) 뽑기
function saleInfo(ind) {
  const ev = DB.getEventsFor(ind.id).filter(e => e.type === 'distribution')
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  const notes = (ev && ev.data && ev.data.notes) || '';
  const buyer = (notes.match(/분양처\s*:\s*([^·]+)/) || [])[1];
  const won = ev && ev.data ? Number(ev.data.price || 0) : Number(ind.salePrice || 0);
  const rest = notes.split('·').map(s => s.trim()).filter(s => s && !/^분양처\s*:/.test(s)).join(' · ');
  return { buyer: (buyer || '').trim(), man: won ? String(won / 10000) : (ev ? '0' : ''), note: rest };
}

function buildWorkbook(XLSX) {
  const inds = DB.getIndividuals();
  const nameOf = id => { const i = inds.find(x => x.id === id); return i ? i.name : ''; };
  const wb = XLSX.utils.book_new();
  const add = (title, aoa, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, title);
  };
  const blank = n => new Array(n).fill('');

  /* ── 1. 애기들 리스트 (축양) ── */
  const own = inds.filter(i => (i.status || 'own') !== 'sold' && !i.isExternal);
  const a1 = [['', '크레건설 축양리스트'], [], [],
    ['', '넘버', '이름', '생년원일', '성별', '모프', '모프 특징사항', '점여부', '입양처', '부/모', '입양가', '특이사항']];
  let priceSum = 0;
  own.forEach((i, n) => {
    const m = splitMemo(i.id);
    if (m.price) priceSum += parseFloat(m.price) || 0;
    // KEEP은 원본 양식을 건드리지 않도록 특이사항 칸 앞에 적습니다
    const note = [i.keep ? 'KEEP' : '', m.note].filter(Boolean).join(' · ');
    a1.push(['', n + 1, i.name, xlDate(i.hatchDate) || m.birthRaw, xlGender(i.gender), i.morph || '',
             m.feat, i.spots || '', m.source, m.blood, m.price, note]);
  });
  // 원본과 같은 자리(O4·P4·Q4)에 합계
  a1[3][14] = '분양가 합'; a1[3][15] = priceSum ? Math.round(priceSum * 100) / 100 : ''; a1[3][16] = '만원';
  add('애기들 리스트', a1, [3, 6, 10, 10, 7, 16, 14, 9, 14, 14, 8, 24]);

  /* ── 2. 메이팅기록 (페어별 N차 산란) ── */
  const evs = DB.getEvents();
  const matings = evs.filter(e => e.type === 'mating').sort((a, b) => (a.date < b.date ? -1 : 1));
  const layings = evs.filter(e => e.type === 'laying').sort((a, b) => (a.date < b.date ? -1 : 1));
  const a2 = [['', '', '', '', '크레건설'], [], [],
    ['', '넘버', '메이팅 날짜', '수컷', '암컷',
     ...Array.from({ length: 12 }, (_, k) => `${k + 1}차 산란확인일`), '특이사항']];
  matings.forEach((m, n) => {
    const femId = m.individualId;
    // 이 메이팅 이후 ~ 같은 암컷의 다음 메이팅 이전에 나온 산란만 이 줄에 붙입니다
    const next = matings.find(x => x.individualId === femId && x.date > m.date);
    const mine = layings.filter(l => l.individualId === femId && l.date >= m.date && (!next || l.date < next.date));
    const cells = mine.slice(0, 12).map(l => {
      const eg = l.data && l.data.eggCount;
      const nt = (l.data && l.data.notes) || '';
      const tag = eg ? `(${eg}개)` : nt ? `(${nt})` : '';
      return xlDate(l.date) + tag;
    });
    a2.push(['', n + 1, xlDate(m.date), (m.data && m.data.partnerName) || nameOf(m.data && m.data.partnerId),
             nameOf(femId), ...cells, ...blank(12 - cells.length), '']);
  });
  add('메이팅기록', a2, [3, 6, 12, 14, 14, ...new Array(12).fill(15), 20]);

  /* ── 3. 해칭기록 (부·모가 연결된 개체) ── */
  const babies = inds.filter(i => (i.sireId || i.damId) && !i.isExternal)
    .sort((a, b) => ((a.hatchDate || '') < (b.hatchDate || '') ? -1 : 1));
  const a3 = [['', '', '', '', '', '크레건설'], [], [],
    ['', '넘버', '이름', '생년원일', '부', '모', '모프', '점여부', '분양자', '분양가', '특이사항']];
  babies.forEach((b, n) => {
    const m = splitMemo(b.id);
    const s = b.status === 'sold' ? saleInfo(b) : { buyer: '', man: '', note: '' };
    a3.push(['', n + 1, b.name, xlDate(b.hatchDate) || m.birthRaw, nameOf(b.sireId), nameOf(b.damId),
             b.morph || '', b.spots || '', s.buyer, s.man, [m.note, s.note].filter(Boolean).join(' · ')]);
  });
  add('해칭기록', a3, [3, 6, 12, 10, 12, 12, 16, 9, 14, 8, 22]);

  /* ── 4. 분양리스트 ── */
  const soldDate = i => { const e = DB.getEventsFor(i.id).filter(x => x.type === 'distribution')[0]; return (e && e.date) || ''; };
  const sold = inds.filter(i => i.status === 'sold').sort((a, b) => (soldDate(a) < soldDate(b) ? -1 : soldDate(a) > soldDate(b) ? 1 : a.name.localeCompare(b.name)));
  const a6 = [['', '', '', '', '크레건설 분양리스트'], [], [],
    ['', '넘버', '이름', '생년원일', '성별', '모프', '점여부', '입양자', '분양가', '특이사항']];
  let saleSum = 0;
  sold.forEach((i, n) => {
    const m = splitMemo(i.id), s = saleInfo(i);
    saleSum += parseFloat(s.man || 0) || 0;
    a6.push(['', n + 1, i.name, xlDate(i.hatchDate) || m.birthRaw, xlGender(i.gender), i.morph || '',
             i.spots || '', s.buyer, s.man, s.note]);
  });
  // 원본과 같은 자리(M4·N4·O4)에 합계
  a6[3][12] = '분양가 합'; a6[3][13] = saleSum ? Math.round(saleSum * 100) / 100 : ''; a6[3][14] = '만원';
  add('분양리스트', a6, [3, 6, 12, 10, 8, 16, 9, 16, 8, 22]);

  return wb;
}

/* ══════════════════════════════════════════
   설정 · 중복 개체 정리 카드
   같은 이름이 두 개 이상일 때만 나타납니다.
   고르는 건 "프로필"뿐이고, 기록·사진은 어느 쪽을 골라도 전부 합쳐집니다.
   ══════════════════════════════════════════ */
function DupMergeCard({ showToast, refreshIndividuals }) {
  const [ver, setVer] = useState(0);
  const [choice, setChoice] = useState({});
  const [busy, setBusy] = useState(false);
  const groups = DB.findDuplicateNames();
  if (!groups.length) return null;

  // 정보가 더 알찬 쪽을 기본 선택 (채워진 항목 수 → 기록 수 순)
  const score = (i) => ['gender', 'morph', 'spots', 'hatchDate', 'avatar'].filter(k => {
    const v = i[k]; return v && v !== 'unknown';
  }).length;
  const best = (items) => [...items].sort((a, b) =>
    score(b) - score(a) || DB.getEventsFor(b.id).length - DB.getEventsFor(a.id).length)[0];

  const summary = (i) => {
    const bits = [];
    bits.push(genderLabel(i.gender));
    if (i.morph) bits.push(i.morph);
    bits.push(i.hatchDate ? fmtDate(i.hatchDate) + ' 출생' : '출생일 없음');
    if ((i.status || 'own') !== 'own') bits.push(STATUS[i.status].label);
    return bits.join(' · ');
  };

  const mergeOne = (g) => {
    const keep = choice[g.name] || best(g.items).id;
    g.items.forEach(i => { if (i.id !== keep) DB.mergeIndividuals(keep, i.id, 'keep'); });
    return g.items.length - 1;
  };

  const doOne = (g) => {
    setBusy(true);
    const n = mergeOne(g);
    refreshIndividuals(); setVer(v => v + 1); setBusy(false);
    showToast(`✅ ${g.name} 합쳤어요 (${n}건 정리)`);
  };

  const doAll = () => {
    setBusy(true);
    let n = 0;
    groups.forEach(g => { n += mergeOne(g); });
    refreshIndividuals(); setVer(v => v + 1); setBusy(false);
    showToast(`✅ 중복 ${n}건 정리 완료`);
  };

  return (
    <div className="card" style={{margin:0, border:'1px solid var(--accent-dim)'}}>
      <div style={{fontSize:13, fontWeight:700, marginBottom:4, color:'var(--accent2)'}}>
        🔀 같은 이름 개체 {groups.length}건
      </div>
      <div style={{fontSize:12, color:'var(--text3)', lineHeight:1.6, marginBottom:10}}>
        기기마다 따로 등록돼서 같은 아이가 둘로 나뉘었어요.<br/>
        <b>어느 정보를 쓸지만 고르시면 됩니다. 기록과 사진은 전부 합쳐져요.</b>
      </div>

      {groups.map(g => {
        const sel = choice[g.name] || best(g.items).id;
        const total = g.items.reduce((s, i) => s + DB.getEventsFor(i.id).length, 0);
        return (
          <div key={g.name} style={{background:'var(--bg3)', borderRadius:10, padding:12, marginBottom:10}}>
            <div style={{fontSize:14, fontWeight:700, marginBottom:8}}>🦎 {g.name}</div>
            <div style={{display:'flex', flexDirection:'column', gap:6}}>
              {g.items.map(i => (
                <button key={i.id}
                  className={`option-btn ${sel === i.id ? 'selected' : ''}`}
                  style={{textAlign:'left', fontSize:12, lineHeight:1.5}}
                  onClick={() => setChoice(c => ({ ...c, [g.name]: i.id }))}>
                  {sel === i.id ? '◉ ' : '○ '}{summary(i)}
                  <span style={{color:'var(--text3)'}}> · 기록 {DB.getEventsFor(i.id).length}건</span>
                </button>
              ))}
            </div>
            <div style={{fontSize:11, color:'var(--text3)', margin:'8px 0 8px'}}>
              → 기록 {total}건은 어느 쪽을 고르셔도 전부 남습니다
            </div>
            <button className="btn btn-primary btn-sm" disabled={busy} onClick={() => doOne(g)}>합치기</button>
          </div>
        );
      })}

      {groups.length > 1 && (
        <button className="btn btn-secondary" disabled={busy} onClick={doAll}>
          전부 합치기 ({groups.length}건)
        </button>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   설정 · 서버 동기화 카드
   ══════════════════════════════════════════ */
function SyncCard({ showToast, refreshIndividuals }) {
  const [, bump] = useState(0);
  const [form, setForm] = useState({ email: '', password: '' });
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState('signin');   // signin | signup | reset
  const [note, setNote] = useState('');
  const [confirmPull, setConfirmPull] = useState(false);

  useEffect(() => SYNC.on(() => bump(v => v + 1)), []);

  const st = SYNC.st();
  const ses = SYNC.ses();
  const active = SYNC.active();

  const fmtSync = (iso) => {
    if (!iso) return '아직 없음';
    const d = new Date(iso), diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return '방금 전';
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    return d.toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  const afterAuth = async () => {
    showToast('✅ 연결됐어요! 기록을 맞추는 중...');
    const r = await SYNC.firstSync();
    const dup = DB.findDuplicateNames();
    showToast(r && r.error ? '⚠️ ' + r.error
      : dup.length ? `☁️ 동기화 완료 · 같은 이름 ${dup.length}건은 아래에서 합쳐주세요`
      : '☁️ 동기화 완료!');
    refreshIndividuals();
    setForm({ email: '', password: '' });
    setOpen(false); setNote('');
  };

  const doSubmit = async () => {
    const email = form.email.trim();
    if (!email) return showToast('⚠️ 이메일을 넣어주세요');
    if (mode === 'reset') {
      setBusy(true);
      try { await SYNC.resetPassword(email); setNote('📧 비밀번호 재설정 메일을 보냈어요. 메일함을 확인해주세요.'); }
      catch (e) { showToast('⚠️ ' + ((e && e.message) || '실패')); }
      setBusy(false); return;
    }
    if (!form.password) return showToast('⚠️ 비밀번호를 넣어주세요');
    if (mode === 'signup' && form.password.length < 6) return showToast('⚠️ 비밀번호는 6자 이상이어야 해요');
    setBusy(true);
    try {
      if (mode === 'signup') {
        const r = await SYNC.signUp(email, form.password);
        if (!r.signedIn) {
          setNote('📧 인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해주세요.');
          setMode('signin'); setBusy(false); return;
        }
      } else {
        await SYNC.signIn(email, form.password);
      }
      await afterAuth();
    } catch (e) {
      showToast('⚠️ ' + ((e && e.message) || '실패'));
    }
    setBusy(false);
  };

  const doSync = async () => {
    setBusy(true);
    const r = await SYNC.run('manual');
    showToast(r && r.error ? '⚠️ ' + r.error : '☁️ 동기화 완료!');
    refreshIndividuals();
    setBusy(false);
  };

  const doPullReplace = async () => {
    setBusy(true);
    setConfirmPull(false);
    try {
      const n = await SYNC.pullReplace();
      refreshIndividuals();
      showToast(`📥 서버 데이터 ${n}건 불러왔어요`);
    } catch (e) {
      showToast('⚠️ ' + ((e && e.message) || '불러오기 실패'));
    }
    setBusy(false);
  };

  const doLogout = () => {
    SYNC.signOut();
    showToast('연결을 끊었어요 (이 기기 데이터는 그대로예요)');
  };

  return (
    <div className="card" style={{margin:0}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6}}>
        <div style={{fontSize:13, fontWeight:700, color:'var(--text2)'}}>☁️ 서버 동기화</div>
        <div style={{fontSize:11, fontWeight:700, color: active ? '#2E7D46' : 'var(--text3)'}}>
          {SYNC.running ? '동기화 중…' : active ? '● 연결됨' : '○ 로컬 저장만'}
        </div>
      </div>

      {active ? (
        <>
          <div style={{fontSize:12, color:'var(--text3)', lineHeight:1.7, marginBottom:10}}>
            계정: {(ses && ses.email) || '-'}<br/>
            마지막 동기화: {fmtSync(st.lastSyncAt)}
            {st.lastError && <><br/><span style={{color:'#B3261E'}}>⚠️ {st.lastError}</span></>}
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            <button className="btn btn-primary" disabled={busy} onClick={doSync}>{busy ? '진행 중…' : '🔄 지금 동기화'}</button>
            {confirmPull ? (
              <div style={{background:'var(--bg3)', borderRadius:10, padding:12}}>
                <div style={{fontSize:12, color:'var(--text2)', marginBottom:8, lineHeight:1.6}}>
                  이 기기의 데이터를 지우고 서버 내용으로 통째로 바꿔요.<br/>새 폰·새 PC에서 처음 설치했을 때만 쓰세요.
                </div>
                <div style={{display:'flex', gap:6}}>
                  <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={doPullReplace}>서버 내용으로 바꾸기</button>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setConfirmPull(false)}>취소</button>
                </div>
              </div>
            ) : (
              <button className="btn btn-secondary" disabled={busy} onClick={() => setConfirmPull(true)}>📥 서버 내용 통째로 받기 (새 기기)</button>
            )}
            <button className="btn btn-secondary" disabled={busy} onClick={doLogout}>연결 끊기</button>
          </div>
        </>
      ) : open ? (
        <div style={{display:'flex', flexDirection:'column', gap:8}}>
          <div style={{fontSize:12, color:'var(--text3)', lineHeight:1.6, marginBottom:2}}>
            {mode === 'signup' ? '이메일과 비밀번호만 정하면 됩니다. 기록은 본인만 볼 수 있어요.'
             : mode === 'reset' ? '가입하신 이메일을 넣으면 재설정 링크를 보내드려요.'
             : '로그인하면 폰·PC가 같은 기록을 봅니다.'}
          </div>
          <input className="input" type="email" autoComplete="username" placeholder="이메일"
            value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          {mode !== 'reset' && (
            <input className="input" type="password"
              autoComplete={mode === 'signup' ? 'new-password' : 'current-password'}
              placeholder={mode === 'signup' ? '비밀번호 (6자 이상)' : '비밀번호'}
              value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
          )}
          {note && <div style={{fontSize:12, color:'var(--accent2)', lineHeight:1.6}}>{note}</div>}
          <div style={{display:'flex', gap:6}}>
            <button className="btn btn-primary" style={{flex:1}} disabled={busy} onClick={doSubmit}>
              {busy ? '진행 중…' : mode === 'signup' ? '가입하고 시작하기' : mode === 'reset' ? '재설정 메일 보내기' : '로그인'}
            </button>
            <button className="btn btn-secondary" style={{flex:1}} disabled={busy}
              onClick={() => { setOpen(false); setNote(''); setMode('signin'); }}>취소</button>
          </div>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:12, paddingTop:2}}>
            {mode === 'signin' ? (
              <>
                <button onClick={() => { setMode('signup'); setNote(''); }} style={{background:'none', border:'none', color:'var(--accent2)', cursor:'pointer', padding:0}}>처음이세요? 회원가입</button>
                <button onClick={() => { setMode('reset'); setNote(''); }} style={{background:'none', border:'none', color:'var(--text3)', cursor:'pointer', padding:0}}>비밀번호를 잊었어요</button>
              </>
            ) : (
              <button onClick={() => { setMode('signin'); setNote(''); }} style={{background:'none', border:'none', color:'var(--accent2)', cursor:'pointer', padding:0}}>← 로그인으로 돌아가기</button>
            )}
          </div>
        </div>
      ) : (
        <>
          <div style={{fontSize:12, color:'var(--text3)', lineHeight:1.7, marginBottom:10}}>
            지금은 이 기기에만 저장돼요. 로그인하면 폰에서 적은 기록이 PC에도 그대로 나타나요.
          </div>
          <div style={{display:'flex', gap:6}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={() => { setMode('signin'); setOpen(true); }}>로그인</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={() => { setMode('signup'); setOpen(true); }}>회원가입</button>
          </div>
        </>
      )}
    </div>
  );
}

function SettingsScreen({ navigate, showToast, refreshIndividuals }) {
  const [settings, setSettings] = useState(() => DB.getSettings());
  const setNaming = (v) => {
    const s = { ...settings, babyNaming: v };
    DB.saveSettings(s);
    setSettings(s);
    showToast('설정 저장 완료');
  };
  const setTemp = (v) => {
    const s = { ...settings, incubateTemp: Number(v) };
    DB.saveSettings(s);
    setSettings(s);
  };
  const setFeed = (patch) => {
    const s = { ...settings, ...patch };
    DB.saveSettings(s);
    setSettings(s);
  };
  const setTheme = (key) => {
    const s = { ...settings, theme: key };
    DB.saveSettings(s);
    setSettings(s);
    applyTheme(key);
    showToast(`🎨 ${themeOf(key).label} 테마 적용`);
  };
  const importRef = useRef(null);
  const [importData, setImportData] = useState(null);
  const onImportPick = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.individuals) || !Array.isArray(d.events)) throw new Error('bad');
        setImportData(d);
      } catch (err) {
        showToast('⚠️ 올바른 백업 파일이 아니에요');
      }
    };
    reader.readAsText(file);
  };
  const doImport = () => {
    if (!importData) return;
    DB.saveIndividuals(importData.individuals);
    DB.saveEvents(importData.events);
    DB.saveReminders(importData.reminders || []);
    if (importData.settings) { DB.saveSettings(importData.settings); applyTheme(importData.settings.theme || THEME_DEFAULT); }
    setImportData(null);
    refreshIndividuals();
    showToast('✅ 백업 복원 완료!');
  };
  const [xlBusy, setXlBusy] = useState(false);
  const exportExcel = async () => {
    setXlBusy(true);
    try {
      const XLSX = await loadXLSX();
      const wb = buildWorkbook(XLSX);
      XLSX.writeFile(wb, `크레건설_브리딩_${todayStr()}.xlsx`);
      showToast('📊 엑셀 파일 다운로드');
    } catch (e) {
      showToast('⚠️ ' + ((e && e.message) || '엑셀 만들기 실패'));
    }
    setXlBusy(false);
  };

  const exportData = () => {
    const data = {
      individuals: DB.getIndividuals(),
      events: DB.getEvents(),
      reminders: DB.getReminders(),
      settings: DB.getSettings(),
      exportedAt: now(),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `creg_backup_${todayStr()}.json`;
    a.click();
    showToast('📦 백업 파일 다운로드');
  };

  return (
    <div className="screen">
      <div className="header"><h1>⚙️ 설정</h1></div>
      <div style={{padding:'16px', display:'flex', flexDirection:'column', gap:12}}>
        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:4, color:'var(--text2)'}}>🎨 색상 테마</div>
          <div style={{fontSize:12, color:'var(--text3)', marginBottom:10, lineHeight:1.6}}>
            앱 전체 색을 바꿉니다. 고른 색은 이 기기에 저장되고, 서버 동기화를 켜두셨다면 다른 기기에도 따라가요.
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {THEMES.map(t => {
              const on = (settings.theme || THEME_DEFAULT) === t.key;
              return (
                <button key={t.key} onClick={() => setTheme(t.key)}
                  style={{display:'flex', alignItems:'center', gap:12, width:'100%', cursor:'pointer', textAlign:'left',
                          padding:'10px 12px', borderRadius:12, background: on ? 'var(--accent-soft)' : 'var(--bg3)',
                          border: `1px solid ${on ? 'var(--accent-dim)' : 'var(--border)'}`}}>
                  <span style={{display:'flex', flexShrink:0}}>
                    {['--accent', '--accent-dim', '--bg2', '--card'].map((v, i) => (
                      <span key={v} style={{width:18, height:18, borderRadius:'50%', background:t.vars[v],
                        border:'1px solid rgba(0,0,0,.12)', marginLeft: i ? -6 : 0}} />
                    ))}
                  </span>
                  <span style={{flex:1, minWidth:0}}>
                    <span style={{display:'block', fontSize:14, fontWeight:700, color: on ? 'var(--accent2)' : 'var(--text)'}}>{t.label}</span>
                    <span style={{display:'block', fontSize:11, color:'var(--text3)', marginTop:1}}>{t.hint}</span>
                  </span>
                  <span style={{fontSize:15, color:'var(--accent2)', width:16, textAlign:'right'}}>{on ? '✓' : ''}</span>
                </button>
              );
            })}
          </div>
        </div>
        <DupMergeCard showToast={showToast} refreshIndividuals={refreshIndividuals} />
        <SyncCard showToast={showToast} refreshIndividuals={refreshIndividuals} />
        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:12, color:'var(--text2)'}}>데이터</div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            <button className="btn btn-primary" disabled={xlBusy} onClick={exportExcel}>
              {xlBusy ? '엑셀 만드는 중…' : '📊 엑셀로 내려받기 (원본 양식)'}
            </button>
            <div style={{fontSize:11, color:'var(--text3)', margin:'-2px 2px 4px', lineHeight:1.5}}>
              애기들 리스트 · 메이팅기록 · 해칭기록 · 분양리스트 4시트
            </div>
            <button className="btn btn-secondary" onClick={exportData}>📦 데이터 백업 (JSON)</button>
            {importData ? (
              <div style={{background:'var(--bg3)', borderRadius:10, padding:12}}>
                <div style={{fontSize:13, color:'var(--text2)', marginBottom:8}}>
                  개체 {importData.individuals.length}마리 · 기록 {importData.events.length}건을 복원할까요?{'\n'}지금 데이터는 백업 내용으로 교체돼요.
                </div>
                <div style={{display:'flex', gap:6}}>
                  <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={doImport}>복원하기</button>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setImportData(null)}>취소</button>
                </div>
              </div>
            ) : (
              <button className="btn btn-secondary" onClick={() => importRef.current && importRef.current.click()}>📥 백업 복원 (가져오기)</button>
            )}
            <input ref={importRef} type="file" accept=".json,application/json" style={{display:'none'}} onChange={onImportPick} />
          </div>
        </div>
        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:4, color:'var(--text2)'}}>🌡️ 인큐베이팅 온도</div>
          <div style={{fontSize:12, color:'var(--text3)', marginBottom:10, lineHeight:1.6}}>
            알을 몇 도로 품고 계신가요? 이 온도로 <b>부화 예정일</b>을 계산해요.<br/>
            낮을수록 오래 걸립니다 (22°C 90일 · 24°C 75일 · 26°C 60일)
          </div>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <input type="range" min={INCUBATE_MIN} max={INCUBATE_MAX} step="0.5"
              value={settings.incubateTemp || INCUBATE_DEFAULT}
              onChange={e => setTemp(e.target.value)}
              style={{flex:1, accentColor:'var(--accent)'}} />
            <div style={{minWidth:96, textAlign:'right'}}>
              <div style={{fontSize:18, fontWeight:800, color:'var(--accent2)'}}>{settings.incubateTemp || INCUBATE_DEFAULT}°C</div>
              <div style={{fontSize:11, color:'var(--text3)'}}>부화 {hatchDays(settings.incubateTemp || INCUBATE_DEFAULT)}일</div>
            </div>
          </div>
          {(settings.incubateTemp || INCUBATE_DEFAULT) >= 27 && (
            <div style={{fontSize:11, color:'#B3261E', marginTop:8}}>⚠️ 28°C를 넘으면 알이 상할 수 있어요</div>
          )}
        </div>

        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:4, color:'var(--text2)'}}>🦗 밥 주는 간격</div>
          <div style={{fontSize:12, color:'var(--text3)', marginBottom:10, lineHeight:1.6}}>
            며칠에 한 번 주시나요? 마지막으로 준 날 + 이 간격이 되면 <b>알림 맨 위</b>에 "오늘 밥 주는 날"이 떠요.
          </div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[1, 2, 3, 4, 5, 7].map(n => (
              <button key={n} className="filter-chip"
                style={(settings.feedInterval || FEED_INTERVAL_DEFAULT) === n ? CHIP_ON : CHIP_OFF}
                onClick={() => setFeed({ feedInterval: n })}>{n}일</button>
            ))}
          </div>
          <div style={{fontSize:13, fontWeight:700, margin:'16px 0 4px', color:'var(--text2)'}}>⚠️ 걱정 시작일</div>
          <div style={{fontSize:12, color:'var(--text3)', marginBottom:10}}>
            며칠째 안 먹으면 알려드릴까요?
          </div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[5, 7, 10, 14, 21].map(n => (
              <button key={n} className="filter-chip"
                style={(settings.feedWarn || FEED_WARN_DEFAULT) === n ? CHIP_ON : CHIP_OFF}
                onClick={() => setFeed({ feedWarn: n })}>{n}일</button>
            ))}
          </div>
        </div>

        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:4, color:'var(--text2)'}}>🐣 해칭 베이비 이름 규칙</div>
          <div style={{fontSize:12, color:'var(--text3)', marginBottom:10}}>해칭 기록 시 베이비를 자동 등록하는 방식이에요</div>
          <div style={{display:'flex', flexDirection:'column', gap:6}}>
            {[['combo', '부모 이름 조합 — 크순이×크한이 → 순한1호, 순한2호'], ['ask', '해칭 때마다 이름 물어보기'], ['off', '자동 등록 안 함 (직접 등록)']].map(([k, l]) => (
              <button key={k} className={`option-btn ${(settings.babyNaming || 'combo') === k ? 'selected' : ''}`} style={{textAlign:'left'}} onClick={() => setNaming(k)}>{l}</button>
            ))}
          </div>
        </div>
        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:6, color:'var(--text2)'}}>앱 정보</div>
          <div style={{fontSize:13, color:'var(--text3)', lineHeight:1.7}}>
            크레건설 브리딩비서 v{APP_VERSION}<br/>
            축양·분양·<b>산란</b>·메이팅·해칭 · 즐겨찾기 · 캘린더(날짜별 추가·수정)<br/>
            사진 첨부 · 예정일 대비 차이 기록 · 백업 복원 · 비속어 필터<br/>
            ☁️ 서버 동기화 — 회원가입·로그인, 폰·PC 같은 데이터<br/>
            🔀 같은 이름 개체 합치기 · 기록 주인 바로잡기<br/>
            📊 엑셀 내려받기(원본 양식) · 프로필 사진 · 🥚 알 상세·해칭<br/>
            🌡️ 인큐 온도로 부화 예정일 계산 · ♀♂? 성별 표시<br/>
            ✅ 오늘 할 일 알림(지난 일정 포함) · 메이팅별 산란 이력<br/>
            ✏️ 부화일 수정 · 대화로 정보 정정("부화일 8월 6일이야")<br/>
            🔢 몇 차 산란 표시 · 암컷별 필터 · 온도 바꾸면 예정일 전부 갱신<br/>
            🦗 밥 주는 날 알림 · 일괄 급여 체크 · 안 먹는 아이 경고<br/>
            📈 암컷별 산란 간격을 배워서 다음 산란 예정일 추정<br/>
            테마: 아이보리 × 버건디 (크레건설 아이덴티티)<br/>
            예정: AI 상담 연결
          </div>
        </div>
        <div className="card" style={{margin:0}}>
          <div style={{fontSize:13, fontWeight:700, marginBottom:6, color:'var(--accent2)'}}>Powered by 크레건설</div>
          <div style={{fontSize:12, color:'var(--text3)'}}>크레스티드 게코 전문 브리더</div>
        </div>
      </div>
    </div>
  );
}

/* 키보드가 올라와도 입력줄이 가려지지 않도록, 실제 보이는 높이를 --vh 에 계속 반영합니다.
   (안드로이드 크롬은 키보드가 떠도 dvh 가 줄지 않아 아래쪽이 덮입니다) */
(function keepViewportHeight() {
  const vv = window.visualViewport;
  const apply = () => {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', h + 'px');
  };
  apply();
  if (vv) {
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
  }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', () => setTimeout(apply, 200));
})();

// 저장해 둔 색상 테마를 첫 화면이 그려지기 전에 입힙니다 (색이 바뀌며 깜빡이지 않도록)
applyTheme(currentThemeKey());

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
