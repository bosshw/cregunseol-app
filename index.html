<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F3EDE2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="크레건설">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <!-- 아이폰은 투명한 곳을 검정으로 칠하므로, 배경을 채운 전용 아이콘을 씁니다 -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>크레건설 브리딩비서</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; background: var(--bg); }
    body { font-family: -apple-system, 'Noto Sans KR', sans-serif; color: var(--text); overscroll-behavior: none; }

    :root {
      /* 크레건설 아이덴티티: 아이보리 × 버건디-브라운 (기본값 — 설정의 색상 테마가 덮어씁니다) */
      --bg: #FAF6EF;          /* 아이보리 바탕 */
      --bg2: #F3EDE2;         /* 헤더/탭바 크림 */
      --bg3: #F0E9DC;         /* 입력창/보조 면 */
      --card: #FFFDF8;        /* 카드 */
      --border: #E4DACA;      /* 경계선 */
      --accent: #8E3B45;      /* 버건디 (주 버튼) */
      --accent2: #7C2D3A;     /* 버건디 진한 텍스트 */
      --accent-soft: #F4E3E1; /* 버건디 옅은 면 (선택/말풍선) */
      --accent-dim: #A85560;  /* 버건디 중간 */
      --accent-edge: #E5C6C4; /* 말풍선·배지 테두리 */
      --accent-shadow: rgba(142,59,69,.25);
      --on-accent: #FFF6EE;   /* 버건디 위 글자 */
      --text: #3B2F2A;        /* 다크 브라운 본문 */
      --text2: #6B5A4E;       /* 중간 브라운 */
      --text3: #A08D7C;       /* 옅은 브라운 캡션 */
      --danger: #B3362B;
      --warning: #C87F2F;
      --gold: #A9812E;
      --gold-soft: #F5EBD6;
      --gold-edge: #E2D2AC;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(59,47,42,.07);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 화면 높이 문제:
       - 100vh 는 "주소창이 숨겨졌을 때" 높이라 실제 보이는 영역보다 큼
       - 100dvh 는 주소창엔 반응하지만 "키보드"에는 반응하지 않음 (키보드가 입력줄을 덮음)
       그래서 JS 가 실제 보이는 높이(visualViewport)를 재서 --vh 에 넣어줍니다. */
    .app { display: flex; flex-direction: column; height: var(--vh, 100dvh); max-width: 430px; margin: 0 auto; position: relative; background: var(--bg); overflow: hidden; }
    .screen { flex: 1; overflow-y: auto; padding-bottom: calc(70px + var(--safe-bottom)); }
    .screen::-webkit-scrollbar { display: none; }

    /* 상단 헤더 */
    .header { background: var(--bg2); padding: 12px 20px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 18px; font-weight: 700; color: var(--accent2); }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .header-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* 하단 탭바 */
    .tabbar { display: flex; background: var(--bg2); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; padding-bottom: var(--safe-bottom); z-index: 20; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; gap: 3px; border: none; background: none; color: var(--text3); font-size: 10px; cursor: pointer; transition: color .15s; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 22px; height: 22px; }
    /* 가운데 대화 버튼 — 늘 눈에 띄게 강조 */
    .tab-chat { color: var(--accent); font-weight: 700; }
    .tab-chat svg { width: 25px; height: 25px; }

    /* 카드 */
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 0 16px 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .card-sm { background: var(--card); border-radius: 10px; padding: 12px 14px; border: 1px solid var(--border); }

    /* 버튼 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 13px 20px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; width: 100%; }
    .btn:active { transform: scale(.97); opacity: .85; }
    .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 10px var(--accent-shadow); }
    .btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
    .btn-danger { background: #FBEAE7; color: var(--danger); border: 1px solid #EBC7C0; }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .btn-ghost { background: transparent; color: var(--accent2); border: 1px solid var(--border); }

    /* 입력 */
    .input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-size: 15px; outline: none; transition: border-color .15s; }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--text3); }
    textarea.input { resize: none; min-height: 80px; }

    /* 라벨 */
    .label { font-size: 12px; color: var(--text3); margin-bottom: 6px; display: block; }

    /* 대화형 채팅 */
    .chat-wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .chat-q { background: var(--card); border-radius: 14px 14px 14px 4px; padding: 12px 14px; font-size: 14px; color: var(--text2); max-width: 85%; border: 1px solid var(--border); align-self: flex-start; white-space: pre-line; line-height: 1.6; box-shadow: var(--shadow); }
    .chat-a { align-self: flex-end; background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 14px; color: var(--accent2); max-width: 85%; border: 1px solid var(--accent-edge); white-space: pre-line; line-height: 1.55; }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-row .input { flex: 1; }
    .send-btn { background: var(--accent); border: none; border-radius: 10px; padding: 13px 14px; cursor: pointer; color: var(--on-accent); font-size: 16px; flex-shrink: 0; }
    /* 탭 칩: 좁은 화면에서 글자가 줄바꿈되어 깨지지 않도록 한 줄 가로 스크롤 */
    .chip-row { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: -6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-row > .chip-btn { flex: 0 0 auto; white-space: nowrap; }
    .pending-bar { padding: 6px 16px 8px; cursor: pointer; }

    /* 선택 옵션 */
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .option-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
    .option-btn { padding: 12px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); font-size: 13px; cursor: pointer; text-align: center; transition: all .15s; }
    .option-btn:active, .option-btn.selected { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent2); }
    .chip-btn { padding: 8px 13px; background: var(--card); border: 1px solid var(--accent-dim); border-radius: 20px; color: var(--accent2); font-size: 13px; line-height: 1.2; cursor: pointer; transition: all .15s; box-shadow: var(--shadow); }
    .chip-btn:active { background: var(--accent-soft); }

    /* 개체 카드 */
    .gecko-card { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius); padding: 10px 14px; margin: 0 16px 8px; border: 1px solid var(--border); cursor: pointer; transition: border-color .15s; box-shadow: var(--shadow); }
    .gecko-card:active { border-color: var(--accent-dim); }
    .gecko-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; border: 2px solid var(--border); }
    .gecko-info { flex: 1; min-width: 0; }
    .gecko-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .gecko-meta { font-size: 12px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 개체 카드 한 줄(모프 / 생일 / 최근기록) — 값이 없어도 칸은 그대로 비워 둡니다 */
    .gecko-line { font-size: 11.5px; color: var(--text3); line-height: 1.4; min-height: 16px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gender-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .gender-dot.female { background: #C2607E; }
    .gender-dot.male { background: #4A6FA5; }
    .gender-dot.unknown { background: var(--text3); }

    /* 배지 */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-green { background: var(--accent-soft); color: var(--accent2); border: 1px solid var(--accent-edge); }
    .badge-gold { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-edge); }
    .badge-blue { background: #E7EDF6; color: #4A6FA5; border: 1px solid #C9D6E8; }
    /* KEEP 스티커 — 내가 데리고 갈 아이 */
    .badge-keep { background: linear-gradient(135deg, #2F6F4A 0%, #1E4A31 100%); color: #FFEFC2; border: 1px solid #14361F;
      letter-spacing: .09em; font-weight: 800; text-shadow: 0 1px 0 rgba(0,0,0,.35); box-shadow: 0 1px 4px rgba(20,54,31,.35); }
    /* 몇 차 산란인지 */
    .nth-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; padding: 2px 7px;
                border-radius: 8px; background: var(--accent-soft); color: var(--accent2); border: 1px solid var(--accent-edge);
                font-size: 11px; font-weight: 800; }
    /* 목록 위 필터 칩 */
    .filter-chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 18px; font-size: 12px; font-weight: 600;
                   cursor: pointer; white-space: nowrap; }

    /* 섹션 헤더 */
    .section-title { font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; padding: 16px 20px 8px; }

    /* FAB */
    .fab { position: fixed; bottom: calc(80px + var(--safe-bottom)); right: calc(50% - 215px + 16px); width: 56px; height: 56px; border-radius: 28px; background: var(--accent); border: none; color: var(--on-accent); font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px var(--accent-shadow); z-index: 15; transition: transform .15s; }
    .fab:active { transform: scale(.9); }
    @media (max-width: 430px) { .fab { right: 16px; left: auto; transform: none; } .fab:active { transform: scale(.9); } }

    /* 이벤트 타임라인 */
    .timeline { padding: 0 16px; }
    .timeline-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .timeline-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .timeline-content { flex: 1; }
    .timeline-type { font-size: 12px; font-weight: 700; color: var(--text3); }
    .timeline-detail { font-size: 14px; color: var(--text); margin-top: 2px; }
    .timeline-date { font-size: 11px; color: var(--text3); margin-top: 3px; }

    /* 통계 그리드 */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
    .stat-card { background: var(--card); border-radius: 10px; padding: 12px 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--accent2); }
    .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* 빈 상태 */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; color: var(--text3); text-align: center; }
    .empty-icon { font-size: 52px; opacity: .6; }
    .empty p { font-size: 14px; line-height: 1.6; white-space: pre-line; }

    /* 뒤로가기 버튼 */
    .back-btn { background: none; border: none; color: var(--accent2); font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; }

    /* 알림 뱃지 */
    .notif-badge { background: var(--danger); color: white; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 5px; position: absolute; top: 6px; right: calc(50% - 30px); }

    /* 공유 박스 */
    .share-box { background: var(--card); border-radius: 10px; padding: 14px; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow); }
    .share-code { font-size: 24px; font-weight: 800; letter-spacing: 4px; color: var(--accent2); font-family: monospace; }

    /* 확인 화면 */
    .confirm-list { display: flex; flex-direction: column; gap: 8px; }
    .confirm-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-key { font-size: 13px; color: var(--text); }
    .confirm-val { font-size: 12px; color: var(--text3); font-weight: 500; text-align: right; display: flex; align-items: center; gap: 8px; }

    /* 토스트 */
    .toast { position: fixed; bottom: calc(80px + var(--safe-bottom) + 10px); left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--accent-dim); color: var(--accent2); padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 100; white-space: nowrap; box-shadow: 0 4px 18px rgba(59,47,42,.18); animation: toastIn .2s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }

    /* 새 버전 안내 막대 */
    .updbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-dim); color: var(--accent2); padding: 9px 14px; font-size: 12.5px; line-height: 1.35; border-bottom: 1px solid var(--border); }
    .updbar button { background: var(--accent); color: var(--on-accent); border: none; border-radius: 14px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .updbar.hard { position: sticky; top: 0; z-index: 30; background: #8C2F39; color: #FFF3F3; border-bottom-color: #6E2029; }
    .updbar.hard button { background: #FFFFFF; color: #8C2F39; font-weight: 700; }
  </style>
</head>
<body>
<div id="root">
  <!-- 앱이 그려지면 이 자리는 통째로 지워집니다.
       못 그려지면(부품을 못 받아온 경우) 이 안내가 남아 하얀 화면을 막습니다. -->
  <div id="boot" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;font-family:-apple-system,'Noto Sans KR',sans-serif;color:#6B5A4E">
    <div style="font-size:46px">🦎</div>
    <div id="boot-a" style="font-size:15px">불러오는 중이에요…</div>
    <div id="boot-b" style="display:none;max-width:280px">
      <div style="font-size:16px;font-weight:700;color:#8C2F39;margin-bottom:8px">인터넷 연결을 확인해 주세요</div>
      <div style="font-size:13.5px;line-height:1.6">앱을 처음 열 때는 인터넷이 필요해요.<br/>한 번 열어두면 다음부터는 인터넷 없이도 열립니다.</div>
      <button onclick="location.reload()" style="margin-top:16px;background:#6D2E46;color:#fff;border:none;border-radius:22px;padding:11px 26px;font-size:15px;font-weight:700;cursor:pointer">다시 시도</button>
    </div>
  </div>
</div>
<script>
  // 6초 안에 화면이 안 그려지면 안내로 바꿔줍니다 (하얀 화면 방지)
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (!b || !document.body.contains(b)) return;
    var a = document.getElementById('boot-a'), c = document.getElementById('boot-b');
    if (a) a.style.display = 'none';
    if (c) c.style.display = 'block';
  }, 6000);
</script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ══════════════════════════════════════════
   데이터 레이어 (localStorage / Supabase 교체 지점)
   ══════════════════════════════════════════ */
const DB = {
  getAll(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
  },
  // 저장 시 변경된 레코드에만 updatedAt 을 찍고, 사라진 레코드는 삭제표식(툼스톤)으로 남김
  // → 모든 호출부를 고치지 않고도 서버 동기화에 필요한 정보가 자동으로 쌓임
  save(key, data) {
    const list = Array.isArray(data) ? data : [];
    let prev = [];
    try { prev = this.getAll(key); } catch { prev = []; }
    const prevMap = new Map(prev.map(r => [r && r.id, r]));
    const t = now();
    const changed = [];
    const out = list.map(r => {
      if (!r || !r.id) return r;
      const p = prevMap.get(r.id);
      prevMap.delete(r.id);
      if (!p) { changed.push(r.id); return { ...r, updatedAt: r.updatedAt || t }; }
      let same = false;
      try { same = JSON.stringify({ ...p, updatedAt: 0 }) === JSON.stringify({ ...r, updatedAt: 0 }); } catch { same = false; }
      if (same) return { ...r, updatedAt: p.updatedAt || t };
      changed.push(r.id);
      return { ...r, updatedAt: t };
    });
    const gone = [...prevMap.keys()].filter(Boolean);
    localStorage.setItem(key, JSON.stringify(out));
    if (typeof SYNC !== 'undefined') {
      if (gone.length) SYNC.addTombstones(key, gone);
      if (changed.length) SYNC.markDirty(key, changed);
      if (gone.length || changed.length) SYNC.touch();
    }
  },
  // 서버에서 내려받은 내용을 그대로 반영할 때 사용 (updatedAt 재기록·툼스톤 생성 안 함 → 되돌이 동기화 방지)
  _raw(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  },
  getIndividuals() { return this.getAll('cg_individuals'); },
  saveIndividuals(list) { this.save('cg_individuals', list); },
  getEvents() { return this.getAll('cg_events'); },
  saveEvents(list) { this.save('cg_events', list); },
  getReminders() { return this.getAll('cg_reminders'); },
  saveReminders(list) { this.save('cg_reminders', list); },
  addIndividual(ind) {
    const list = this.getIndividuals();
    list.push({ ...ind, id: uuid(), createdAt: now() });
    this.saveIndividuals(list);
    return list[list.length - 1];
  },
  addEvent(ev) {
    const list = this.getEvents();
    list.push({ ...ev, id: uuid(), createdAt: now() });
    this.saveEvents(list);
  },
  getEventsFor(individualId) {
    return this.getEvents().filter(e => e.individualId === individualId);
  },
  updateIndividual(id, patch) {
    this.saveIndividuals(this.getIndividuals().map(i => i.id === id ? { ...i, ...patch } : i));
  },
  updateEvent(id, patch) {
    this.saveEvents(this.getEvents().map(e => e.id === id ? { ...e, ...patch } : e));
  },

  /* ── 분양 확정 — 상태·분양가·분양 기록을 한 번에 맞춥니다 ──
     엑셀 분양리스트가 읽는 형식(분양처: OOO)에 맞춰 적습니다. */
  recordSale(id, opt) {
    const o = opt || {};
    const d = o.date || todayStr();
    const won = Number(o.won || 0);
    const buyer = (o.buyer || '').trim();
    this.updateIndividual(id, { status: 'sold', keep: false, salePrice: won ? String(won) : '' });
    const evs = this.getEvents();
    const idx = evs.findIndex(e => e.individualId === id && e.type === 'distribution');
    if (idx >= 0) {
      const cur = evs[idx];
      const prevNotes = (cur.data && cur.data.notes) || '';
      const rest = prevNotes.split('·').map(s => s.trim()).filter(s => s && !/^분양처\s*:/.test(s));
      const notes = [buyer ? '분양처: ' + buyer : '', ...rest].filter(Boolean).join(' · ');
      evs[idx] = { ...cur, date: d, data: { ...(cur.data || {}), price: won ? String(won) : '', notes } };
      this.saveEvents(evs);
    } else {
      this.addEvent({ individualId: id, type: 'distribution', date: d,
        data: { price: won ? String(won) : '', notes: buyer ? '분양처: ' + buyer : '' } });
    }
    return { won, buyer, date: d };
  },

  /* ── KEEP 표시 ──
     켜면 내놓은 상태(분양가능·예약중)는 보유중으로 되돌립니다.
     이미 분양완료로 나간 아이는 건드리지 않습니다. */
  setKeep(id, on) {
    const cur = this.getIndividuals().find(x => x.id === id);
    const patch = { keep: !!on };
    if (on && cur && (cur.status === 'available' || cur.status === 'reserved')) patch.status = 'own';
    this.updateIndividual(id, patch);
    return patch;
  },
  /* 부화일 옮기기 — 부화 기록과 그날 태어난 베이비들의 생일을 한 번에 맞춥니다.
     (같은 알에서 나온 형제는 같은 날이 맞으므로 통째로 움직입니다) */
  moveHatchDate(damId, oldDate, newDate) {
    if (!oldDate || !newDate || oldDate === newDate) return { events: 0, babies: 0 };
    let events = 0, babies = 0;
    this.saveEvents(this.getEvents().map(e => {
      if (e.type === 'hatching' && e.individualId === damId && e.date === oldDate) { events++; return { ...e, date: newDate }; }
      return e;
    }));
    this.saveIndividuals(this.getIndividuals().map(i => {
      if (i.damId === damId && i.hatchDate === oldDate) { babies++; return { ...i, hatchDate: newDate }; }
      return i;
    }));
    return { events, babies };
  },
  deleteEvent(id) {
    this.saveEvents(this.getEvents().filter(e => e.id !== id));
  },
  getSettings() {
    try { return JSON.parse(localStorage.getItem('cg_settings') || '{}'); } catch { return {}; }
  },
  getReadReminderIds() {
    try { return JSON.parse(localStorage.getItem('cg_read_reminders') || '[]'); } catch { return []; }
  },
  markRemindersRead(ids) {
    const merged = [...new Set([...this.getReadReminderIds(), ...ids])];
    // 부화 예정은 저장하지 않고 계산해서 만들므로(id가 'H:'로 시작) 그것도 읽음 목록에 남깁니다
    const valid = new Set(allAlerts().map(r => r.id));
    localStorage.setItem('cg_read_reminders', JSON.stringify(merged.filter(id => valid.has(id))));
  },
  saveSettings(s) {
    let prev = {};
    try { prev = this.getSettings(); } catch { prev = {}; }
    let same = false;
    try { same = JSON.stringify({ ...prev, _updatedAt: 0 }) === JSON.stringify({ ...s, _updatedAt: 0 }); } catch { same = false; }
    const next = same ? { ...s, _updatedAt: prev._updatedAt || now() } : { ...s, _updatedAt: now() };
    localStorage.setItem('cg_settings', JSON.stringify(next));
    if (typeof SYNC !== 'undefined' && !same) { SYNC.markDirty('cg_settings', ['main']); SYNC.touch(); }
  },
  _rawSettings(s) { localStorage.setItem('cg_settings', JSON.stringify(s)); },
  deleteIndividual(id) {
    this.saveIndividuals(this.getIndividuals().filter(i => i.id !== id));
    this.saveEvents(this.getEvents().filter(e => e.individualId !== id));
  },

  /* ── 같은 이름 개체 찾기 (기기별로 따로 만들어진 같은 아이) ── */
  findDuplicateNames() {
    const map = new Map();
    this.getIndividuals().forEach(i => {
      const k = (i.name || '').trim();
      if (!k) return;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(i);
    });
    return [...map.entries()]
      .filter(([, v]) => v.length > 1)
      .map(([name, items]) => ({ name, items }));
  },

  /* ── 개체 병합 ──
     keepId 로 dropId 를 흡수합니다. 기록·사진·알림은 하나도 버리지 않고 전부 옮깁니다.
     profileFrom 으로 성별·모프·출생일 같은 "프로필"을 어느 쪽 것으로 할지만 고릅니다.
     빈 값이면 반대쪽 값으로 채웁니다(고른 쪽이 비었다고 정보가 사라지지 않게). */
  mergeIndividuals(keepId, dropId, profileFrom = 'keep') {
    if (!keepId || !dropId || keepId === dropId) return null;
    const list = this.getIndividuals();
    const keep = list.find(i => i.id === keepId);
    const drop = list.find(i => i.id === dropId);
    if (!keep || !drop) return null;

    const PROFILE = ['gender', 'morph', 'spots', 'hatchDate', 'status', 'salePrice',
                     'avatar', 'isExternal', 'isFromCreGunseol', 'favorite', 'keep', 'babyNotes', 'shareCode'];
    const src = profileFrom === 'drop' ? drop : keep;
    const alt = profileFrom === 'drop' ? keep : drop;
    const blank = v => v === undefined || v === null || v === '' || v === 'unknown' || v === false;
    const merged = { ...keep };
    PROFILE.forEach(k => { merged[k] = blank(src[k]) ? (blank(alt[k]) ? src[k] : alt[k]) : src[k]; });
    merged.sireId = keep.sireId || drop.sireId || null;
    merged.damId  = keep.damId  || drop.damId  || null;

    // 기록 이동 + 메이팅 파트너 참조 정정
    const events = this.getEvents().map(e => {
      let x = e;
      if (x.individualId === dropId) x = { ...x, individualId: keepId };
      if (x.data && x.data.partnerId === dropId) x = { ...x, data: { ...x.data, partnerId: keepId } };
      return x;
    });
    // 개체 교체 + 자식들의 부모 참조 정정
    const inds = list.filter(i => i.id !== dropId).map(i => {
      let x = i.id === keepId ? merged : i;
      if (x.sireId === dropId) x = { ...x, sireId: keepId };
      if (x.damId === dropId) x = { ...x, damId: keepId };
      return x;
    });
    const rems = this.getReminders().map(r =>
      r.individualId === dropId ? { ...r, individualId: keepId, geckoName: merged.name } : r);

    this.saveIndividuals(inds);
    this.saveEvents(events);
    this.saveReminders(rems);
    return merged;
  }
};

/* ══════════════════════════════════════════
   서버 동기화 (Supabase REST 직접 호출 · 외부 라이브러리 없음)

   설계 요약
   - 로컬 우선(local-first): 서버가 없거나 인터넷이 끊겨도 앱은 그대로 동작
   - 저장 시 DB.save 가 updatedAt·툼스톤을 자동 기록 → 변경분만 서버에 올림
   - 한 번의 동기화 = ① 올리기(push) → ② 내려받기(pull) 순서
     올린 뒤에 내려받으므로 "내 최신 수정"이 서버 옛 데이터에 덮이지 않음
   - 서버 updated_at 은 DB 트리거가 서버 시각으로 강제 → 폰·PC 시계 오차 무관
   ══════════════════════════════════════════ */
const SYNC_KINDS = [
  { kind: 'individual', store: 'cg_individuals' },
  { kind: 'event',      store: 'cg_events' },
  { kind: 'reminder',   store: 'cg_reminders' },
];
const STORE_OF_KIND = SYNC_KINDS.reduce((a, k) => (a[k.kind] = k.store, a), {});
const KIND_OF_STORE = SYNC_KINDS.reduce((a, k) => (a[k.store] = k.kind, a), { cg_settings: 'settings' });

/* ══════════════════════════════════════════
   버전 확인 — 새 버전 알림 · 옛 버전 안전장치

   version.json 하나로 두 가지를 합니다.
     app      : 지금 올라가 있는 앱 버전. 내 것과 다르면 "새 버전이 있어요" 안내
     minSchema: 서버에 올려도 되는 최소 데이터 모양 버전.
                내 것이 이보다 낮으면 push를 멈춥니다.
                → 옛 버전이 새 필드를 모른 채 남의 기록을 덮어쓰는 사고를 막습니다.

   인터넷이 없거나 파일을 못 받으면 아무 것도 막지 않습니다(앱은 그대로 씁니다).
   ══════════════════════════════════════════ */
const APP_VERSION = '3.7';
const SCHEMA_VERSION = 1;          // 데이터 모양 버전. 모양을 바꾸는 패치에서만 올립니다
const VERSION_URL = './version.json';
const VERSION_CHECK_MS = 30 * 60 * 1000;

const VER = {
  latest: null,
  checkedAt: 0,
  listeners: new Set(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach(fn => { try { fn(); } catch {} }); },

  // 서버가 요구하는 최소 모양보다 낮은가 → 올리기 중단
  blocked() {
    const m = this.latest && Number(this.latest.minSchema);
    return !!(m && m > SCHEMA_VERSION);
  },
  // 새 버전이 올라와 있는가 → 안내 막대
  hasUpdate() {
    const a = this.latest && this.latest.app;
    return !!(a && String(a) !== APP_VERSION);
  },
  note() { return (this.latest && this.latest.note) || ''; },

  async check() {
    if (typeof fetch !== 'function') return null;
    try {
      const res = await fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      const j = await res.json();
      if (!j || typeof j !== 'object') return null;
      let before = '';
      try { before = JSON.stringify(this.latest); } catch {}
      this.latest = j;
      this.checkedAt = Date.now();
      let after = '';
      try { after = JSON.stringify(j); } catch {}
      if (after !== before) this.emit();
      return j;
    } catch { return null; }
  },

  // 새 버전 받기 — 캐시를 비우고 다시 엽니다
  async refresh() {
    try {
      if (typeof caches !== 'undefined' && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      }
    } catch {}
    try { location.reload(); } catch {}
  },
};

const SYNC = {
  listeners: new Set(),
  running: false,
  timer: null,

  /* ── 저장소 ── */
  cfg()  { return SERVER; },
  ses()  { try { return JSON.parse(localStorage.getItem('cg_sync_session') || 'null'); } catch { return null; } },
  st()   { try { return JSON.parse(localStorage.getItem('cg_sync_state') || '{}'); } catch { return {}; } },
  saveCfg(c) { localStorage.setItem('cg_sync_cfg', JSON.stringify(c)); this.emit(); },
  saveSes(s) { s ? localStorage.setItem('cg_sync_session', JSON.stringify(s)) : localStorage.removeItem('cg_sync_session'); this.emit(); },
  saveSt(patch) { localStorage.setItem('cg_sync_state', JSON.stringify({ ...this.st(), ...patch })); this.emit(); },

  configured() { const c = this.cfg(); return !!(c.url && c.key); },
  loggedIn()   { const s = this.ses(); return !!(s && s.access_token); },
  active()     { return this.configured() && this.loggedIn(); },

  /* ── 상태 변경 알림 (UI 갱신용) ── */
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(dataChanged) { this.listeners.forEach(fn => { try { fn(!!dataChanged); } catch {} }); },

  /* ── 아직 서버에 못 올린 변경 목록 (정확한 증분 전송용) ──
     시각 비교 대신 "무엇이 바뀌었는지"를 직접 들고 갑니다.
     → 같은 밀리초 저장 누락도 없고, 이미 올린 옛 값이 다시 올라가 최신본을 덮는 사고도 없습니다. */
  dirty() { try { return JSON.parse(localStorage.getItem('cg_dirty') || '[]'); } catch { return []; } },
  markDirty(store, ids) {
    const kind = KIND_OF_STORE[store];
    if (!kind) return;
    const set = new Set(this.dirty());
    ids.forEach(id => set.add(kind + '|' + id));
    localStorage.setItem('cg_dirty', JSON.stringify([...set]));
  },
  clearDirty(keys) {
    const done = new Set(keys);
    localStorage.setItem('cg_dirty', JSON.stringify(this.dirty().filter(k => !done.has(k))));
  },
  markAllDirty() {
    const keys = this.localRecords().map(r => r.kind + '|' + r.id);
    localStorage.setItem('cg_dirty', JSON.stringify(keys));
  },

  /* ── 삭제 표식 ── */
  tombstones() { try { return JSON.parse(localStorage.getItem('cg_tombstones') || '[]'); } catch { return []; } },
  addTombstones(store, ids) {
    const kind = KIND_OF_STORE[store];
    if (!kind) return;
    const t = now();
    const list = this.tombstones();
    const seen = new Set(list.map(x => x.kind + '|' + x.id));
    ids.forEach(id => { if (!seen.has(kind + '|' + id)) list.push({ kind, id, at: t }); });
    localStorage.setItem('cg_tombstones', JSON.stringify(list));
  },
  clearTombstones(done) {
    const gone = new Set(done.map(x => x.kind + '|' + x.id));
    localStorage.setItem('cg_tombstones', JSON.stringify(this.tombstones().filter(x => !gone.has(x.kind + '|' + x.id))));
  },

  /* ── 저장이 일어나면 잠시 뒤 자동 동기화 ── */
  touch() {
    if (!this.active()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run('auto'), 2500);
  },

  /* ── HTTP 공통 ── */
  async api(path, opts = {}, withAuth = true) {
    const c = this.cfg();
    const s = this.ses();
    const headers = { apikey: c.key, 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (withAuth && s && s.access_token) headers.Authorization = 'Bearer ' + s.access_token;
    const res = await fetch(c.url.replace(/\/+$/, '') + path, { ...opts, headers });
    return res;
  },

  async parseErr(res) {
    let body = '';
    try { body = await res.text(); } catch {}
    try { const j = JSON.parse(body); return j.msg || j.message || j.error_description || j.error || body; } catch { return body || ('HTTP ' + res.status); }
  },

  /* ── 로그인 / 회원가입 / 비밀번호 재설정 ── */
  _store(d, email) {
    this.saveSes({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Date.now() + (d.expires_in || 3600) * 1000,
      email: (d.user && d.user.email) || email,
    });
  },

  async signIn(email, password) {
    const res = await this.api('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email: (email || '').trim(), password: password || '' }),
    }, false);
    if (!res.ok) throw new Error(this.krErr(await this.parseErr(res)));
    this._store(await res.json(), email);
    return true;
  },

  // 회원가입. 이메일 확인이 켜져 있으면 세션 없이 돌아옵니다 → 메일 확인 안내
  async signUp(email, password) {
    const res = await this.api('/auth/v1/signup', {
      method: 'POST',
      body: JSON.stringify({
        email: (email || '').trim(), password: password || '',
        options: { email_redirect_to: location.origin + location.pathname },
      }),
    }, false);
    if (!res.ok) throw new Error(this.krErr(await this.parseErr(res)));
    const d = await res.json();
    if (d.access_token) { this._store(d, email); return { signedIn: true }; }
    return { signedIn: false, needsConfirm: true };
  },

  async resetPassword(email) {
    const back = encodeURIComponent(location.origin + location.pathname);
    const res = await this.api('/auth/v1/recover?redirect_to=' + back, {
      method: 'POST',
      body: JSON.stringify({ email: (email || '').trim() }),
    }, false);
    if (!res.ok) throw new Error(this.krErr(await this.parseErr(res)));
    return true;
  },

  // 서버 영문 오류를 알아볼 수 있는 말로
  krErr(msg) {
    const m = String(msg || '');
    if (/Invalid login credentials/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요';
    if (/Email not confirmed/i.test(m)) return '메일함에서 인증 메일을 먼저 확인해주세요';
    if (/User already registered|already been registered/i.test(m)) return '이미 가입된 이메일이에요. 로그인해주세요';
    if (/Password should be at least/i.test(m)) return '비밀번호는 6자 이상이어야 해요';
    if (/Unable to validate email|invalid format/i.test(m)) return '이메일 형식이 올바르지 않아요';
    if (/rate limit|too many/i.test(m)) return '잠시 후 다시 시도해주세요 (요청이 많았어요)';
    if (/Failed to fetch|NetworkError/i.test(m)) return '인터넷 연결을 확인해주세요';
    return m;
  },

  async refresh() {
    const s = this.ses();
    if (!s || !s.refresh_token) throw new Error('로그인이 필요해요');
    const res = await this.api('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    }, false);
    if (!res.ok) { this.saveSes(null); throw new Error('로그인이 만료됐어요. 다시 로그인해 주세요'); }
    const d = await res.json();
    this.saveSes({ ...s, access_token: d.access_token, refresh_token: d.refresh_token || s.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
  },

  async ensureSession() {
    const s = this.ses();
    if (!s) throw new Error('로그인이 필요해요');
    if (!s.expires_at || s.expires_at - Date.now() < 60000) await this.refresh();
  },

  signOut() {
    this.saveSes(null);
    this.saveSt({ cursor: null, lastSyncAt: null, lastError: null });
  },

  /* ── 로컬 → 서버 (변경분만) ── */
  localRecords() {
    const out = [];
    SYNC_KINDS.forEach(({ kind, store }) => {
      DB.getAll(store).forEach(r => { if (r && r.id) out.push({ kind, id: String(r.id), data: r, updatedAt: r.updatedAt || '' }); });
    });
    const set = DB.getSettings();
    if (set && Object.keys(set).length) out.push({ kind: 'settings', id: 'main', data: set, updatedAt: set._updatedAt || '' });
    return out;
  },

  async push() {
    const wanted = new Set(this.dirty());
    const rows = this.localRecords()
      .filter(r => wanted.has(r.kind + '|' + r.id))
      .map(r => ({ kind: r.kind, id: r.id, data: r.data, deleted: false }));
    // 로컬에서 이미 사라진 dirty 항목은 툼스톤이 처리하므로 여기서 정리
    const sentKeys = rows.map(r => r.kind + '|' + r.id);
    const tombs = this.tombstones();
    tombs.forEach(t => rows.push({ kind: t.kind, id: String(t.id), data: {}, deleted: true }));

    for (let i = 0; i < rows.length; i += 20) {
      const chunk = rows.slice(i, i + 20);
      const res = await this.api('/rest/v1/cg_records?on_conflict=user_id,kind,id', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(chunk),
      });
      if (!res.ok) throw new Error(await this.parseErr(res));
    }
    if (tombs.length) this.clearTombstones(tombs);
    this.clearDirty([...wanted]);   // 올린 것 + 이미 삭제된 잔여 항목 정리 (전송 중 생긴 새 변경은 남음)
    this.saveSt({ pushedAt: now() });
    return sentKeys.length + tombs.length;
  },

  /* ── 서버 → 로컬 (커서 이후 변경분만) ── */
  async pull() {
    const cursor = this.st().cursor;
    const q = new URLSearchParams({ select: 'kind,id,data,deleted,updated_at', order: 'updated_at.asc', limit: '500' });
    if (cursor) q.set('updated_at', 'gt.' + cursor);
    let applied = 0, maxTs = cursor || null, page = 0;

    while (page < 40) {
      const qs = new URLSearchParams(q);
      if (maxTs) qs.set('updated_at', 'gt.' + maxTs);
      const res = await this.api('/rest/v1/cg_records?' + qs.toString(), { method: 'GET' });
      if (!res.ok) throw new Error(await this.parseErr(res));
      const rows = await res.json();
      if (!rows.length) break;
      applied += this.applyRemote(rows);
      maxTs = rows[rows.length - 1].updated_at;
      if (rows.length < 500) break;
      page++;
    }
    if (maxTs) this.saveSt({ cursor: maxTs });
    return applied;
  },

  applyRemote(rows) {
    const buckets = {};
    SYNC_KINDS.forEach(({ kind, store }) => { buckets[kind] = DB.getAll(store); });
    let settings = DB.getSettings();
    let changed = 0, settingsChanged = false;
    const dirty = new Set();

    rows.forEach(row => {
      if (row.kind === 'settings') {
        if (row.deleted) return;
        const incoming = row.data || {};
        let same = false;
        try { same = JSON.stringify(settings) === JSON.stringify(incoming); } catch {}
        if (!same) { settings = incoming; settingsChanged = true; changed++; }
        return;
      }
      const list = buckets[row.kind];
      if (!list) return;
      const idx = list.findIndex(r => r && String(r.id) === String(row.id));
      if (row.deleted) {
        if (idx >= 0) { list.splice(idx, 1); dirty.add(row.kind); changed++; }
        return;
      }
      const incoming = row.data || {};
      if (!incoming.id) incoming.id = row.id;
      if (idx < 0) { list.push(incoming); dirty.add(row.kind); changed++; return; }
      let same = false;
      try { same = JSON.stringify(list[idx]) === JSON.stringify(incoming); } catch {}
      if (!same) { list[idx] = incoming; dirty.add(row.kind); changed++; }
    });

    // 서버가 개체를 지웠다면 그 개체의 기록도 함께 정리
    if (dirty.has('individual')) {
      const alive = new Set(buckets.individual.map(i => String(i.id)));
      const before = buckets.event.length;
      buckets.event = buckets.event.filter(e => !e.individualId || alive.has(String(e.individualId)));
      if (buckets.event.length !== before) dirty.add('event');
    }

    dirty.forEach(kind => DB._raw(STORE_OF_KIND[kind], buckets[kind]));
    if (settingsChanged) {
      DB._rawSettings(settings);
      // 다른 기기에서 바꾼 색상 테마도 바로 반영
      try { applyTheme(settings.theme || THEME_DEFAULT); } catch {}
    }
    return changed;
  },

  /* ── 한 번의 동기화 사이클 ── */
  async run(reason = 'manual') {
    if (this.running || !this.active()) return { skipped: true };
    // 데이터 모양이 바뀐 새 버전이 나와 있으면, 옛 버전은 서버에 올리지 않습니다
    // (모르는 항목을 덮어써서 다른 기기의 기록을 지우는 것을 막습니다)
    if (VER.blocked()) {
      this.saveSt({ lastError: '앱 업데이트가 필요해요. 새 버전으로 열면 다시 올라갑니다' });
      return { blocked: true };
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      this.saveSt({ lastError: '오프라인 상태예요. 연결되면 자동으로 올려드릴게요' });
      return { skipped: true };
    }
    this.running = true;
    this.emit();
    try {
      await this.ensureSession();
      const sent = await this.push();
      const got = await this.pull();
      this.saveSt({ lastSyncAt: now(), lastError: null });
      this.running = false;
      this.emit(got > 0);
      return { sent, got };
    } catch (e) {
      this.running = false;
      this.saveSt({ lastError: (e && e.message) || '동기화 실패' });
      this.emit();
      return { error: (e && e.message) || '동기화 실패' };
    }
  },

  /* ── 첫 연결: 서버가 비어 있으면 로컬 전체를 올림 ── */
  async firstSync() {
    this.saveSt({ cursor: null, pushedAt: null, lastError: null });
    this.markAllDirty();
    return this.run('first');
  },

  /* ── 이 기기 데이터를 서버 내용으로 완전히 맞추기 (새 기기용) ── */
  async pullReplace() {
    await this.ensureSession();
    const res = await this.api('/rest/v1/cg_records?select=kind,id,data,deleted&limit=10000', { method: 'GET' });
    if (!res.ok) throw new Error(await this.parseErr(res));
    const rows = await res.json();
    SYNC_KINDS.forEach(({ store }) => DB._raw(store, []));
    this.applyRemote(rows);
    localStorage.setItem('cg_tombstones', '[]');
    localStorage.setItem('cg_dirty', '[]');
    this.saveSt({ cursor: null, pushedAt: now(), lastSyncAt: now(), lastError: null });
    await this.pull();
    this.emit(true);
    return rows.filter(r => !r.deleted).length;
  },
};
const localISO = (d) => { const t = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return t.toISOString().slice(0, 10); };
const todayStr = () => localISO(new Date());
const daysUntil = (ds) => Math.ceil((new Date(ds) - new Date(todayStr())) / 86400000);

/* 분양가 입력 해석 — 기본은 만원, "원"이라고 쓰면 원 그대로.
   "15" "15만" "15만원" → 150000 / "150000원" "150,000원" → 150000 */
function parseMoney(text) {
  const s = String(text == null ? '' : text).replace(/,/g, '').replace(/\s/g, '');
  if (!s) return null;
  const m = s.match(/^(\d+(?:\.\d+)?)(만원|만|원)?$/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  if (!isFinite(n) || n < 0) return null;
  const unit = m[2];
  if (unit === '원') return Math.round(n);          // 원이라고 밝힌 경우만 원
  return Math.round(n * 10000);                     // 그 밖엔 만원
}
const wonText = w => (w || w === 0) ? Number(w).toLocaleString() + '원' : '';

/* 분양완료인데 분양가가 비어 있는 아이들 */
function soldMissingPrice(individuals) {
