/* ── 메이팅기록 뷰: 수컷×암컷 페어별 산란 차수 (건별 수정·삭제 지원) ── */
function MatingView({ individuals, navigate, showToast }) {
  const [open, setOpen] = useState(null);
  const [ver, setVer] = useState(0);
  const [editingId, setEditingId] = useState(null);
  const [editVals, setEditVals] = useState({});
  const [confirmDel, setConfirmDel] = useState(null);
  const refresh = () => setVer(v => v + 1);
  const byId = {};
  individuals.forEach(i => { byId[i.id] = i; });
  const evs = DB.getEvents();
  // 부화 여부·상태는 clutchRows 한 곳에서만 정합니다 (화면마다 답이 다르지 않도록)
  const crMap = {};
  clutchRows(individuals, evs).forEach(r => { crMap[r.e.id] = r; });
  const clutchRowOf = id => crMap[id] || null;
  const pairs = {};
  const orderPair = (aId, aName, bId, bName) => {
    const a = byId[aId], b = byId[bId];
    let male = { id: aId, name: aName }, female = { id: bId, name: bName };
    if ((a && a.gender === 'female') || (b && b.gender === 'male')) {
      male = { id: bId, name: bName }; female = { id: aId, name: aName };
    }
    return { k: male.name + '|' + female.name, male, female };
  };
  const mateIndex = [];   // 산란 귀속에 쓸 메이팅 색인
  evs.filter(e => e.type === 'mating').forEach(e => {
    const tName = (byId[e.individualId] || {}).name || '?';
    const pName = (e.data && e.data.partnerName) || '?';
    const { k, male, female } = orderPair(e.individualId, tName, e.data && e.data.partnerId, pName);
    (pairs[k] = pairs[k] || { male, female, matings: [], layings: [] }).matings.push(e);
    mateIndex.push({ k, male, female, date: e.date, otherId: e.individualId, otherName: tName });
  });
  mateIndex.sort((a, b) => (a.date < b.date ? 1 : -1));   // 최신순

  /* 산란을 어느 페어에 붙일지 —
     기록에 아빠 이름(sireName)이 박혀 있는 경우는 드뭅니다(엑셀에서 가져온 기록엔 아예 없음).
     그래서 "이 암컷의 메이팅 중, 산란일 이전의 가장 최근 것"으로 귀속합니다.
     산란기록 탭·엑셀 내보내기와 같은 규칙이라 어느 화면에서 봐도 숫자가 맞습니다. */
  evs.filter(e => e.type === 'laying').forEach(e => {
    const momName = (byId[e.individualId] || {}).name || '?';
    const before = mateIndex.filter(m => m.date <= e.date);
    const mate = before.find(m => (m.female.id ? m.female.id === e.individualId : m.female.name === momName))
              || before.find(m => m.male.id === e.individualId || m.otherId === e.individualId);
    let k, male, female = { id: e.individualId, name: momName };
    if (mate) {
      k = mate.k; male = mate.male; female = mate.female;
    } else if (e.data && e.data.sireName) {          // 메이팅 기록 없이 아빠만 적힌 경우
      k = e.data.sireName + '|' + momName;
      male = { id: e.data.sireId, name: e.data.sireName };
    } else {                                          // 아빠를 모르는 산란도 버리지 않고 보여줍니다
      k = '(부 미상)|' + momName;
      male = { id: null, name: '부 미상' };
    }
    if (!pairs[k]) pairs[k] = { male, female, matings: [], layings: [] };
    pairs[k].layings.push(e);
  });
  const list = Object.entries(pairs);
  if (!list.length) {
    return (
      <div className="empty" style={{padding:'40px 20px'}}>
        <div className="empty-icon" style={{fontSize:36}}>💞</div>
        <p>아직 메이팅 기록이 없어요.{'\n'}💬 대화에서 "크한이 크봉이랑 메이팅했어"처럼 말씀해보세요.</p>
      </div>
    );
  }
  return (
    <div style={{paddingTop:10}}>
      {list.map(([k, p]) => {
        const lays = [...p.layings].sort((a, b) => a.date > b.date ? 1 : -1);
        const mates = [...p.matings].sort((a, b) => a.date > b.date ? 1 : -1);
        return (
          <div className="card" key={k}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer'}}
              onClick={() => { setOpen(open === k ? null : k); setEditingId(null); setConfirmDel(null); }}>
              <div style={{fontSize:15, fontWeight:700}}>
                <span style={{cursor:'pointer'}} onClick={e => { e.stopPropagation(); if (byId[p.male.id]) navigate('profile', { gecko: byId[p.male.id] }); }}>
                  <GenderTag g={(byId[p.male.id] || {}).gender || 'male'} size={15} /> {p.male.name}
                </span>
                {' × '}
                <span style={{cursor:'pointer'}} onClick={e => { e.stopPropagation(); if (byId[p.female.id]) navigate('profile', { gecko: byId[p.female.id] }); }}>
                  <GenderTag g={(byId[p.female.id] || {}).gender || 'female'} size={15} /> {p.female.name}
                </span>
              </div>
              <div style={{fontSize:12, color:'var(--text3)'}}>메이팅 {mates.length}회 · 산란 {lays.length}회 {open === k ? '▲' : '▼'}</div>
            </div>
            {open === k && (
              <div style={{marginTop:10, borderTop:'1px solid var(--border)', paddingTop:10}}>
                {mates.map((m, i) => {
                  const isEditing = editingId === m.id;
                  const target = byId[m.individualId];
                  return (
                    <div key={m.id} style={{padding:'5px 0', borderBottom:'1px dashed var(--border)'}}>
                      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13}}>
                        <span style={{color:'var(--text)'}}>💞 {i + 1}회 메이팅</span>
                        <span style={{display:'flex', alignItems:'center', gap:10, color:'var(--text3)'}}>
                          {fmtDate(m.date)}{m.data && m.data.partnerName ? ` · ${m.data.partnerName}` : ''}
                          <button onClick={() => {
                            setConfirmDel(null);
                            if (isEditing) { setEditingId(null); return; }
                            setEditVals({ date: m.date, partnerId: (m.data && m.data.partnerId) || '' });
                            setEditingId(m.id);
                          }} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>✏️</button>
                          <button onClick={() => { setEditingId(null); setConfirmDel(confirmDel === m.id ? null : m.id); }} style={{background:'none', border:'none', cursor:'pointer', fontSize:13, color:'var(--text3)'}}>🗑️</button>
                        </span>
                      </div>
                      {confirmDel === m.id && (
                        <div style={{display:'flex', gap:6, marginTop:6, alignItems:'center'}}>
                          <span style={{fontSize:12, color:'var(--danger)', flex:1}}>이 메이팅 기록을 삭제할까요?</span>
                          <button className="btn btn-danger btn-sm" style={{width:'auto'}} onClick={() => { DB.deleteEvent(m.id); setConfirmDel(null); refresh(); showToast && showToast('메이팅 기록 삭제 완료'); }}>삭제</button>
                          <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setConfirmDel(null)}>취소</button>
                        </div>
                      )}
                      {isEditing && (
                        <div style={{marginTop:6, display:'flex', flexDirection:'column', gap:6}}>
                          <input type="date" className="input" style={{padding:'8px 10px', fontSize:13}} value={editVals.date || ''} onChange={e => setEditVals(v => ({ ...v, date: e.target.value }))} />
                          <select className="input" style={{padding:'8px 10px', fontSize:13}} value={editVals.partnerId} onChange={e => setEditVals(v => ({ ...v, partnerId: e.target.value }))}>
                            <option value="">파트너 선택</option>
                            {individuals.filter(x => x.id !== m.individualId).map(x => (
                              <option key={x.id} value={x.id}>{genderEmoji(x.gender)} {x.name}</option>
                            ))}
                          </select>
                          <div style={{display:'flex', gap:6}}>
                            <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => {
                              const partner = individuals.find(x => x.id === editVals.partnerId);
                              const data = { ...(m.data || {}) };
                              if (partner) { data.partnerId = partner.id; data.partnerName = partner.name; }
                              DB.updateEvent(m.id, { date: editVals.date || m.date, data });
                              setEditingId(null); refresh(); showToast && showToast('메이팅 기록 수정 완료');
                            }}>저장</button>
                            <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => setEditingId(null)}>취소</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
                {lays.length === 0 ? (
                  <div style={{fontSize:12, color:'var(--text3)', paddingTop:5}}>아직 산란 기록이 없어요.</div>
                ) : lays.map((l, i) => {
                  // 상태는 clutchRows가 정한 것을 그대로 씁니다.
                  // (예전엔 여기서 따로 판정해서 목록과 상세 화면의 답이 달랐습니다)
                  const cr = clutchRowOf(l.id);
                  const state = { t: cr ? cr.state.replace('D-', '부화 D-') : '-', c: cr ? cr.tone : 'var(--text3)' };
                  return (
                    <div key={l.id}
                      onClick={() => navigate('clutch', { layingId: l.id })}
                      style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, fontSize:13, padding:'6px 0', cursor:'pointer',
                              borderBottom: i < lays.length - 1 ? '1px dashed var(--border)' : 'none'}}>
                      <span style={{color:'var(--text)', whiteSpace:'nowrap'}}>🥚 {i + 1}차</span>
                      <span style={{color:'var(--text3)', flex:1, textAlign:'right', minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                        {fmtDate(l.date)}{l.data.eggCount ? ` · ${l.data.eggCount}개` : ''}{l.data.notes ? ` · ${l.data.notes.slice(0, 10)}` : ''}
                      </span>
                      <span style={{color:state.c, fontWeight:700, whiteSpace:'nowrap', fontSize:12}}>{state.t}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── 산란기록 뷰: 클러치(알 묶음) 일정 중심 ──
   메이팅기록이 "누가 누구랑"이라면, 여기는 "알이 언제 부화하나"를 봅니다.
   부화 임박한 것부터 위로 올라옵니다. ── */
function LayingView({ individuals, navigate }) {
  const [momFilter, setMomFilter] = useState('all');   // 암컷별로 골라 보기
  const all = clutchRows(individuals, DB.getEvents());

  // 암컷 목록 (산란 기록이 있는 아이만, 산란 많은 순)
  const momList = [];
  const momCnt = {};
  all.forEach(r => {
    if (!r.mom) return;
    momCnt[r.mom.id] = (momCnt[r.mom.id] || 0) + 1;
    if (!momList.some(m => m.id === r.mom.id)) momList.push(r.mom);
  });
  momList.sort((a, b) => (momCnt[b.id] - momCnt[a.id]) || (a.name > b.name ? 1 : -1));

  const rows = all.filter(r => momFilter === 'all' || (r.mom && r.mom.id === momFilter));

  // 부화 대기 중인 것부터 임박순 → 나머지는 최신 산란순
  rows.sort((a, b) => {
    if (a.waiting !== b.waiting) return a.waiting ? -1 : 1;
    if (a.waiting) return a.d - b.d;
    return a.e.date < b.e.date ? 1 : -1;
  });

  const waitCnt = rows.filter(r => r.waiting).length;
  const eggSum = rows.filter(r => r.waiting).reduce((s, r) => s + (r.eggs || 0), 0);
  const soon = rows.filter(r => r.waiting && r.d >= 0 && r.d <= 7).length;

  if (!all.length) return (
    <div className="empty" style={{padding:'40px 20px'}}>
      <div className="empty-icon">🥚</div>
      <p>{'아직 산란 기록이 없어요.\n💬 대화 버튼에서 "크범이 알 낳았어" 처럼 말씀해보세요.'}</p>
    </div>
  );

  return (
    <div style={{padding:'0 16px'}}>
      {/* 암컷별로 골라 보기 — "크밤이 산란만" 같은 식으로 */}
      {momList.length > 1 && (
        <div style={{display:'flex', gap:6, overflowX:'auto', padding:'2px 0 10px', WebkitOverflowScrolling:'touch'}}>
          <button className="filter-chip" style={momFilter === 'all' ? CHIP_ON : CHIP_OFF}
            onClick={() => setMomFilter('all')}>전체 {all.length}</button>
          {momList.map(m => (
            <button key={m.id} className="filter-chip" style={momFilter === m.id ? CHIP_ON : CHIP_OFF}
              onClick={() => setMomFilter(momFilter === m.id ? 'all' : m.id)}>
              {genderMark(m.gender)} {m.name} {momCnt[m.id]}
            </button>
          ))}
        </div>
      )}

      <div className="card" style={{margin:'0 0 12px', display:'flex', justifyContent:'space-around', textAlign:'center'}}>
        <div>
          <div style={{fontSize:20, fontWeight:800, color:'var(--accent2)'}}>{waitCnt}</div>
          <div style={{fontSize:11, color:'var(--text3)'}}>부화 대기</div>
        </div>
        <div>
          <div style={{fontSize:20, fontWeight:800, color:'var(--accent2)'}}>{eggSum || '—'}</div>
          <div style={{fontSize:11, color:'var(--text3)'}}>알 수(확인분)</div>
        </div>
        <div>
          <div style={{fontSize:20, fontWeight:800, color: soon ? '#B3261E' : 'var(--text3)'}}>{soon}</div>
          <div style={{fontSize:11, color:'var(--text3)'}}>7일 내 부화</div>
        </div>
      </div>

      {rows.map(r => (
        <div className="card" key={r.e.id} style={{margin:'0 0 8px', cursor:'pointer'}}
          onClick={() => navigate('clutch', { layingId: r.e.id })}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8}}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:14, fontWeight:700, display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                <span className="nth-chip">{r.nth}차</span>
                <span>🥚 {r.momName}
                  {r.dadName && <span style={{fontSize:12, fontWeight:500, color:'var(--text3)'}}> × {r.dadName}</span>}
                </span>
              </div>
              <div style={{fontSize:12, color:'var(--text3)', marginTop:3}}>
                {fmtDate(r.e.date)} 산란
                {r.eggs ? ` · 알 ${r.eggs}개` : ''}
                {r.notes ? ` · ${r.notes}` : ''}
              </div>
              <div style={{fontSize:11, color:'var(--text3)', marginTop:2}}>
                부화 예정 {fmtDate(r.expISO)}
              </div>
            </div>
            <span style={{fontSize:12, fontWeight:700, color:r.tone, whiteSpace:'nowrap'}}>{r.state}</span>
          </div>
        </div>
      ))}
      {!rows.length && (
        <div className="card" style={{textAlign:'center', color:'var(--text3)', fontSize:13, padding:'18px 12px'}}>
          이 아이의 산란 기록이 없어요.
        </div>
      )}
      <div style={{fontSize:11, color:'var(--text3)', textAlign:'center', padding:'6px 0 0'}}>
        "N차"는 그 엄마 × 아빠 짝의 몇 번째 산란인지예요
      </div>
      <div style={{fontSize:11, color:'var(--text3)', textAlign:'center', padding:'2px 0 2px'}}>
        부화 예정일은 인큐 {incubateTemp()}°C 기준 산란일 +{hatchDaysNow()}일 · 온도는 설정에서 바꿀 수 있어요
      </div>
    </div>
  );
}

/* ── 클러치(알) 상세 — 알 묶음을 개체처럼 들여다보는 화면 ──
   알 사진 · 부/모 · 산란일 · 해칭 예정일, 그리고 [해칭했어요] 한 번으로 베이비 등록까지. ── */
function ClutchScreen({ layingId, navigate, showToast, refreshIndividuals }) {
  const [ver, setVer] = useState(0);
  const [hatchOpen, setHatchOpen] = useState(false);
  const [count, setCount] = useState('');
  const [hDate, setHDate] = useState(todayStr());   // 부화한 날 — 오늘 확인했다고 오늘로 잡지 않습니다
  const [dateEdit, setDateEdit] = useState(false);  // 이미 적은 부화일 고치기
  const [dateVal, setDateVal] = useState('');
  const [eggEdit, setEggEdit] = useState(false);
  const [eggVal, setEggVal] = useState('');
  const fileRef = useRef(null);
  const bump = () => { setVer(v => v + 1); refreshIndividuals(); };

  const ev = DB.getEvents().find(e => e.id === layingId);
  if (!ev) return (
    <div className="screen"><div className="header"><button className="back-btn" onClick={() => navigate('home', { view: 'laying' })}>‹ 산란기록</button></div>
      <div className="empty"><div className="empty-icon">🥚</div><p>기록을 찾을 수 없어요.</p></div></div>
  );

  const inds = DB.getIndividuals();
  const mom = inds.find(i => i.id === ev.individualId);
  const evs = DB.getEvents();
  const row = clutchRows(inds, evs).find(r => r.e.id === layingId) || null;   // 몇 차 산란인지 등
  const mate = evs.filter(e => e.type === 'mating' && e.individualId === ev.individualId && e.date <= ev.date)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  const dadId = (ev.data && ev.data.sireId) || (mate && mate.data && mate.data.partnerId) || null;
  const dad = inds.find(i => i.id === dadId) || null;
  const dadName = (dad && dad.name) || (mate && mate.data && mate.data.partnerName) || '';

  const eggs = ev.data && ev.data.eggCount;
  const notes = (ev.data && ev.data.notes) || '';
  const photo = ev.data && ev.data.photo;
  const expDate = new Date(new Date(ev.date).getTime() + hatchDaysNow() * 86400000);
  const expISO = localISO(expDate);
  const d = daysUntil(expISO);
  const infertile = /무정/.test(notes);
  // 부화 기록·아기는 clutchRows에서 "한 클러치에 하나씩만" 배정한 결과를 그대로 씁니다.
  // (예전엔 여기서 따로 찾느라 같은 아기가 1차·2차에 겹쳐 나왔습니다)
  const hatched = row ? row.hatched : null;
  const babies = row ? row.babies : [];

  let state = `부화까지 D-${d}`, tone = d <= 7 ? '#B3261E' : 'var(--accent2)';
  if (infertile) { state = '무정란'; tone = '#8A8177'; }
  else if (hatched) { state = '부화 완료'; tone = '#2E7D46'; }
  else if (d < 0) { state = `예정일 ${-d}일 지남`; tone = '#C87F2F'; }
  else if (d === 0) { state = '오늘이 예정일'; tone = '#B3261E'; }

  const patch = (p) => { DB.updateEvent(ev.id, { data: { ...(ev.data || {}), ...p } }); bump(); };

  const onPhoto = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    compressImage(f, (src) => { patch({ photo: src }); showToast('📷 알 사진을 넣었어요'); });
  };

  const doHatch = () => {
    const n = parseInt(count || eggs || 1, 10);
    if (!n || n < 1) return showToast('⚠️ 몇 마리 나왔는지 알려주세요');
    const date = hDate || todayStr();
    if (date < ev.date) return showToast('⚠️ 부화일이 산란일보다 빠를 수 없어요');
    if (date > todayStr()) return showToast('⚠️ 아직 오지 않은 날짜예요');
    const all = DB.getIndividuals();
    const mode = DB.getSettings().babyNaming || 'combo';
    let made = 0;
    if (mode !== 'off') {
      const names = makeBabyNames(mom ? mom.name : '', dadName, n, all.map(i => i.name));
      names.slice(0, n).forEach(nm => {
        DB.addIndividual({
          name: nm, gender: 'unknown', morph: '', hatchDate: date,
          isFromCreGunseol: true, status: 'own', sireId: dadId, damId: ev.individualId,
          shareCode: Math.random().toString(36).slice(2, 8).toUpperCase(),
        });
        made++;
      });
    }
    DB.addEvent({ individualId: ev.individualId, type: 'hatching', date, data: { count: n, layingId: ev.id } });
    // 이 클러치는 부화 완료로 표시
    // (부화 예정 알림은 저장하지 않고 계산으로 만들기 때문에 따로 지울 게 없습니다)
    bump();
    showToast(made ? `🐣 ${n}마리 부화 · 베이비 ${made}마리 등록` : `🐣 ${n}마리 부화 기록`);
    navigate('home', { view: 'hatch' });
  };

  const Parent = ({ label, g, name }) => (
    <button onClick={() => g && navigate('profile', { gecko: g })}
      style={{flex:1, background:'var(--bg3)', border:'1px solid var(--border)', borderRadius:10, padding:'10px 8px',
              cursor: g ? 'pointer' : 'default', textAlign:'center'}}>
      <div style={{fontSize:11, color:'var(--text3)'}}>{label}</div>
      <div style={{fontSize:14, fontWeight:700, marginTop:2}}>
        {name ? `${g ? genderEmoji(g.gender) + ' ' : ''}${name}` : '—'}
      </div>
      {g && g.morph && <div style={{fontSize:11, color:'var(--text3)', marginTop:2}}>{g.morph}</div>}
    </button>
  );

  return (
    <div className="screen">
      <div className="header">
        <div className="header-row">
          <button className="back-btn" onClick={() => navigate('home', { view: 'laying' })}>‹ 산란기록</button>
          <span style={{fontSize:13, fontWeight:700, color:tone}}>{state}</span>
        </div>
      </div>

      <div style={{padding:16}}>
        <div className="card" style={{margin:'0 0 12px', textAlign:'center'}}>
          <button onClick={() => fileRef.current && fileRef.current.click()} title="알 사진"
            style={{width:'100%', height:170, borderRadius:12, border:'1px solid var(--border)', cursor:'pointer',
                    background: photo ? `url(${photo}) center/cover` : 'var(--bg3)',
                    display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:6}}>
            {!photo && <><span style={{fontSize:46}}>🥚</span><span style={{fontSize:12, color:'var(--text3)'}}>눌러서 알 사진 넣기</span></>}
          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={onPhoto} />

          <div style={{fontSize:19, fontWeight:800, marginTop:12, display:'flex', alignItems:'center', justifyContent:'center', gap:8}}>
            {row && <span className="nth-chip" style={{fontSize:12}}>{row.nth}차</span>}
            <span>{eggs ? `알 ${eggs}개` : '알 (개수 미기록)'}</span>
          </div>
          <div style={{fontSize:13, color:'var(--text3)', marginTop:2}}>
            {row ? `${row.pairName} · ` : ''}{fmtDate(ev.date)} 산란
          </div>
          {notes && <div style={{fontSize:12, color:'var(--accent2)', marginTop:4}}>{notes}</div>}

          {eggEdit ? (
            <div style={{display:'flex', gap:6, marginTop:10}}>
              <input className="input" type="number" min="0" placeholder="알 개수" value={eggVal}
                onChange={e => setEggVal(e.target.value)} style={{padding:'8px 10px', fontSize:13}} />
              <button className="btn btn-primary btn-sm" style={{width:'auto'}}
                onClick={() => { patch({ eggCount: parseInt(eggVal || '0', 10) || undefined }); setEggEdit(false); showToast('알 개수 저장'); }}>저장</button>
            </div>
          ) : (
            <button className="btn btn-secondary btn-sm" style={{marginTop:10}}
              onClick={() => { setEggVal(eggs ? String(eggs) : ''); setEggEdit(true); }}>알 개수 {eggs ? '수정' : '입력'}</button>
          )}
        </div>

        <div className="card" style={{margin:'0 0 12px'}}>
          <div style={{fontSize:12, fontWeight:700, color:'var(--text2)', marginBottom:8}}>🧬 부모</div>
          <div style={{display:'flex', gap:8}}>
            <Parent label="아빠" g={dad} name={dadName} />
            <Parent label="엄마" g={mom} name={mom ? mom.name : ''} />
          </div>
        </div>

        <div className="card" style={{margin:'0 0 12px'}}>
          <div className="confirm-row"><span className="confirm-key">산란일</span><span className="confirm-val">{fmtDate(ev.date)}</span></div>
          <div className="confirm-row"><span className="confirm-key">해칭 예정일</span><span className="confirm-val">{fmtDate(expISO)}</span></div>
          <div className="confirm-row"><span className="confirm-key">상태</span><span className="confirm-val" style={{color:tone, fontWeight:700}}>{state}</span></div>
        </div>

        {hatched ? (
          <div className="card" style={{margin:'0 0 12px'}}>
            <div style={{fontSize:12, fontWeight:700, color:'var(--text2)', marginBottom:8}}>🐣 부화한 아이들</div>

            {/* 부화일 수정 — 날짜를 잘못 적었을 때 여기서 바로 고칩니다 */}
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, marginBottom:8}}>
              <span style={{fontSize:13, color:'var(--text3)'}}>부화일</span>
              {dateEdit ? (
                <div style={{display:'flex', gap:6, flex:1, justifyContent:'flex-end'}}>
                  <input className="input" type="date" style={{padding:'6px 8px', fontSize:13, width:'auto'}}
                    value={dateVal} min={ev.date} max={todayStr()} onChange={e => setDateVal(e.target.value)} />

                    if (dateVal > todayStr()) return showToast('⚠️ 아직 오지 않은 날짜예요');
                    const r = DB.moveHatchDate(ev.individualId, hatched.date, dateVal);
                    setDateEdit(false); bump();
                    showToast(r.babies ? `📅 ${fmtDate(dateVal)}로 옮겼어요 · 베이비 ${r.babies}마리 생일도 함께` : `📅 ${fmtDate(dateVal)}로 옮겼어요`);
                  }}>저장</button>
                  <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setDateEdit(false)}>취소</button>
                </div>
              ) : (
                <span style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontSize:13, fontWeight:700}}>{fmtDate(hatched.date)}</span>
                  <button className="btn btn-secondary btn-sm" style={{width:'auto', padding:'4px 10px', fontSize:12}}
                    onClick={() => { setDateVal(hatched.date); setDateEdit(true); }}>수정</button>
                </span>
              )}
            </div>

            {babies.length ? babies.map(b => (
              <button key={b.id} className="option-btn" style={{textAlign:'left', width:'100%', marginBottom:6}}
                onClick={() => navigate('profile', { gecko: b })}>{genderEmoji(b.gender)} {b.name}{b.morph ? ` · ${b.morph}` : ''}</button>
            )) : <div style={{fontSize:12, color:'var(--text3)'}}>{(hatched.data && hatched.data.count) || 0}마리</div>}
            <button className="btn btn-secondary btn-sm" style={{marginTop:4}} onClick={() => navigate('home', { view: 'hatch' })}>해칭기록으로 이동</button>
          </div>
        ) : hatchOpen ? (
          <div className="card" style={{margin:'0 0 12px'}}>
            <div style={{fontSize:13, fontWeight:700, marginBottom:8}}>🐣 언제, 몇 마리 나왔나요?</div>
            <div style={{fontSize:11, color:'var(--text3)', margin:'0 2px 4px'}}>부화한 날</div>
            <input className="input" type="date" value={hDate} min={ev.date} max={todayStr()}
              onChange={e => setHDate(e.target.value)} />
            <div style={{display:'flex', gap:6, margin:'6px 0 10px'}}>
              {[0, -1, -2, -3].map(k => {
                const dv = localISO(new Date(new Date(todayStr()).getTime() + k * 86400000));
                if (dv < ev.date) return null;
                return (
                  <button key={k} className="btn btn-secondary btn-sm" style={{flex:1, padding:'6px 0', fontSize:12,
                    borderColor: hDate === dv ? 'var(--accent)' : 'var(--border)', color: hDate === dv ? 'var(--accent)' : undefined}}
                    onClick={() => setHDate(dv)}>{k === 0 ? '오늘' : k === -1 ? '어제' : `${-k}일 전`}</button>
                );
              })}
            </div>
            <div style={{fontSize:11, color:'var(--text3)', margin:'0 2px 4px'}}>몇 마리</div>

              value={count} onChange={e => setCount(e.target.value)} />
            <div style={{fontSize:11, color:'var(--text3)', margin:'8px 2px'}}>
              {hDate !== todayStr() ? `${fmtDate(hDate)}로 기록됩니다. ` : ''}
              베이비가 자동 등록되고 부모(아빠 {dadName || '미상'} · 엄마 {mom ? mom.name : '미상'})가 연결돼요.

            <button className="btn btn-primary" onClick={() => { setCount(eggs ? String(eggs) : ''); setHDate(todayStr()); setHatchOpen(true); }}>🐣 해칭했어요</button>

              <button className="btn btn-secondary"
                onClick={() => { patch({ notes: (notes ? notes + ' · ' : '') + '무정' }); showToast('무정란으로 표시했어요'); }}>
                무정란이었어요

            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── 해칭기록 뷰: 베이비 목록 + 정보 수정 ── */
function HatchView({ individuals, refreshIndividuals, showToast, navigate }) {
  const [open, setOpen] = useState(null);
  const [vals, setVals] = useState({});
  const byId = {};
  individuals.forEach(i => { byId[i.id] = i; });
  const babies = individuals.filter(i => i.damId || i.sireId)
    .sort((a, b) => (b.hatchDate || '') > (a.hatchDate || '') ? 1 : -1);
  if (!babies.length) {
    return (
      <div className="empty" style={{padding:'40px 20px'}}>
        <div className="empty-icon" style={{fontSize:36}}>🐣</div>
        <p>아직 해칭 기록이 없어요.{'\n'}"2마리 부화했어"라고 기록하면 베이비가 자동 등록돼요.</p>
      </div>
    );
  }
  return (
    <div style={{paddingTop:10}}>
      {babies.map(b => (
        <div className="card" key={b.id}>
          <div style={{cursor:'pointer'}} onClick={() => {
            if (open === b.id) { setOpen(null); return; }
            setVals({ morph: b.morph || '', spots: b.spots || '', notes: b.babyNotes || '', hatchDate: b.hatchDate || '' });
            setOpen(b.id);
          }}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div style={{fontSize:15, fontWeight:700}}>🐣 {b.name} {genderEmoji(b.gender)}</div>
              <div style={{fontSize:12, color:'var(--text3)'}}>{fmtDate(b.hatchDate)} {open === b.id ? '▲' : '▼'}</div>
            </div>
            <div style={{fontSize:12, color:'var(--text3)', marginTop:4}}>
              부{' '}
              {byId[b.sireId]
                ? <span style={{color:'var(--accent2)', cursor:'pointer', textDecoration:'underline'}} onClick={e => { e.stopPropagation(); navigate('profile', { gecko: byId[b.sireId] }); }}>{byId[b.sireId].name}</span>
                : '-'
              }
              {' · '}모{' '}
              {byId[b.damId]
                ? <span style={{color:'var(--accent2)', cursor:'pointer', textDecoration:'underline'}} onClick={e => { e.stopPropagation(); navigate('profile', { gecko: byId[b.damId] }); }}>{byId[b.damId].name}</span>
                : '-'
              }
              {' · '}{b.morph || '모프 미정'}{b.spots ? ` · 점: ${b.spots}` : ''}
            </div>
          </div>
          {open === b.id && (
            <div style={{marginTop:10, borderTop:'1px solid var(--border)', paddingTop:10, display:'flex', flexDirection:'column', gap:6}}>
              <div style={{fontSize:11, color:'var(--text3)', margin:'0 2px -2px'}}>부화일 (생일)</div>
              <input className="input" type="date" style={{padding:'8px 10px', fontSize:13}} max={todayStr()}
                value={vals.hatchDate} onChange={e => setVals(v => ({ ...v, hatchDate: e.target.value }))} />
              {vals.hatchDate && vals.hatchDate !== b.hatchDate && (() => {
                const sibs = individuals.filter(x => x.damId === b.damId && x.hatchDate === b.hatchDate).length;
                return (
                  <div style={{fontSize:11, color:'var(--accent2)', margin:'-2px 2px 2px'}}>
                    {fmtDate(vals.hatchDate)}로 옮깁니다{sibs > 1 ? ` · 같이 나온 ${sibs}마리와 부화 기록도 함께` : ''}
                  </div>
                );
              })()}
              <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder="모프 (예: 릴리화이트)" value={vals.morph} onChange={e => setVals(v => ({ ...v, morph: e.target.value }))} />
              <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder="점여부 (예: 꼬리점 2개 / 무점)" value={vals.spots} onChange={e => setVals(v => ({ ...v, spots: e.target.value }))} />
              <input className="input" style={{padding:'8px 10px', fontSize:13}} placeholder="특이사항" value={vals.notes} onChange={e => setVals(v => ({ ...v, notes: e.target.value }))} />
              <div style={{display:'flex', gap:6}}>
                <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => {
                  const nd = vals.hatchDate;
                  if (nd && nd > todayStr()) return showToast('⚠️ 아직 오지 않은 날짜예요');
                  DB.updateIndividual(b.id, { morph: vals.morph.trim(), spots: vals.spots.trim(), babyNotes: vals.notes.trim() });
                  let moved = null;
                  if (nd && nd !== b.hatchDate) {
                    const r = DB.moveHatchDate(b.damId, b.hatchDate, nd);
                    // 엄마 기록이 없는 아이(수동 등록 등)는 이 아이만 옮깁니다
                    if (!r.babies) DB.updateIndividual(b.id, { hatchDate: nd });
                    moved = r.babies || 1;
                  }
                  refreshIndividuals();
                  showToast(moved ? `📅 부화일을 ${fmtDate(nd)}로 옮겼어요 (${moved}마리)` : '베이비 정보 저장 완료');
                  setOpen(null);
                }}>저장</button>
                <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => navigate('profile', { gecko: b })}>프로필 보기</button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* 분양가 물어보기 — 분양완료로 바꿀 때와, 빠진 분양가를 채울 때 함께 씁니다 */
function SalePrompt({ gecko, onDone, onClose }) {
  const already = gecko ? salePriceOf(gecko) : 0;
  const [price, setPrice] = useState(already ? String(already / 10000) : '');
  const [buyer, setBuyer] = useState('');
  const [date, setDate] = useState(todayStr());
  if (!gecko) return null;
  const won = parseMoney(price);
  const save = (noPrice) => {
    const r = DB.recordSale(gecko.id, { won: noPrice ? 0 : (won || 0), buyer, date });
    onDone && onDone(r);
  };
  return (
    <div style={{position:'fixed', inset:0, background:'rgba(30,20,15,.72)', zIndex:210, display:'flex',
                 alignItems:'center', justifyContent:'center', padding:18}} onClick={onClose}>
      <div className="card" style={{margin:0, width:'100%', maxWidth:340, maxHeight:'88vh', overflowY:'auto'}} onClick={e => e.stopPropagation()}>
        <div style={{fontSize:15, fontWeight:800}}>🤝 {gecko.name} 분양</div>
        <div style={{fontSize:12, color:'var(--text3)', margin:'3px 0 12px'}}>얼마에 보내셨어요? 기록과 엑셀에 함께 남겨둘게요.</div>

        <div style={{fontSize:11.5, color:'var(--text3)', marginBottom:4}}>분양가 <b>(만원)</b></div>
        <input className="input" inputMode="decimal" placeholder="예) 15" value={price}
          onChange={e => setPrice(e.target.value)} autoFocus />
        <div style={{fontSize:11.5, minHeight:17, margin:'5px 2px 10px', color: won ? 'var(--accent2)' : 'var(--text3)'}}>
          {!price ? '"150000원" 처럼 원으로 적어도 됩니다'
            : won ? wonText(won) + ' 으로 적을게요'
                  : '숫자로 적어주세요 (예: 15 · 15만원 · 150000원)'}
        </div>

        <div style={{fontSize:11.5, color:'var(--text3)', marginBottom:4}}>분양처 <span style={{opacity:.65}}>(선택)</span></div>
        <input className="input" placeholder="예) 홍길동 · 파충류샵" value={buyer} onChange={e => setBuyer(e.target.value)} />

        <div style={{fontSize:11.5, color:'var(--text3)', margin:'10px 0 4px'}}>분양한 날</div>
        <input className="input" type="date" value={date} onChange={e => setDate(e.target.value)} />

        <div style={{display:'flex', gap:6, marginTop:14}}>
          <button className="btn btn-primary btn-sm" style={{flex:1}} disabled={!!price && !won} onClick={() => save(false)}>저장</button>
          <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={() => save(true)}>가격 없이</button>
        </div>
        <button className="btn btn-secondary btn-sm" style={{width:'100%', marginTop:6}} onClick={onClose}>취소</button>
      </div>
    </div>
  );
}

function WeightChart({ events }) {
  const gs = events.filter(e => e.type === 'growth' && e.data && e.data.weight)
    .sort((a, b) => (a.date + (a.createdAt || '')) > (b.date + (b.createdAt || '')) ? 1 : -1);
  if (gs.length < 2) return null;
  const W = 340, H = 150, P = 30;
  const ws = gs.map(g => parseFloat(g.data.weight));
  const min = Math.min(...ws), max = Math.max(...ws);
  const span = (max - min) || 1;
  const x = i => P + (W - P * 2) * (i / (gs.length - 1));
  const y = w => H - P - (H - P * 2) * ((w - min) / span);
  const pts = ws.map((w, i) => `${x(i)},${y(w)}`).join(' ');
  const diff = ws[ws.length - 1] - ws[0];
  return (
    <div style={{padding:'0 16px 12px'}}>
      <div className="card" style={{margin:0}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
          <div style={{fontSize:13, fontWeight:700, color:'var(--text2)'}}>📈 몸무게 변화</div>
          <div style={{fontSize:12, color: diff >= 0 ? '#2E7D46' : 'var(--danger)', fontWeight:700}}>
            {diff >= 0 ? '+' : ''}{diff.toFixed(1).replace(/\.0$/, '')}g
          </div>
        </div>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:'auto', display:'block'}}>
          <line x1={P} y1={H - P} x2={W - P} y2={H - P} stroke="var(--border)" strokeWidth="1" />
          <polyline points={pts} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
          {ws.map((w, i) => (
            <g key={i}>
              <circle cx={x(i)} cy={y(w)} r="3.5" fill="var(--accent)" />
              {(gs.length <= 8 || i === 0 || i === gs.length - 1) && (
                <text x={x(i)} y={y(w) - 8} textAnchor="middle" fontSize="10" fill="var(--text2)">{w}g</text>
              )}
            </g>
          ))}
          <text x={x(0)} y={H - 8} textAnchor="start" fontSize="9" fill="var(--text3)">{gs[0].date.slice(5).replace('-', '/')}</text>
          <text x={x(gs.length - 1)} y={H - 8} textAnchor="end" fontSize="9" fill="var(--text3)">{gs[gs.length - 1].date.slice(5).replace('-', '/')}</text>
        </svg>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════

function SmartChatScreen({ navigate, showToast, refreshIndividuals, presetGecko }) {

  const heldRef = useRef([]);                        // 대상 미정으로 보류된 기록
  const heldMorphRef = useRef(null);                 // 대상 미정 모프
  const heldGenderRef = useRef(null);               // 대상 미정 성별
  const heldExternalRef = useRef(false);             // 외부 개체 등록 플래그
  const pendingNameRef = useRef(null);               // 새 이름 등록 확인 대기
  const pendingRetargetRef = useRef(null);           // 등록 후 옮길 기록 (주인 정정 대기)
  const pendingBabyRef = useRef(null);               // 해칭 베이비 이름 답변 대기
  const pendingRef = useRef([]);                     // 담긴 기록 (ref 미러)

  const [geckoName, setGeckoName] = useState(presetGecko ? presetGecko.name : null);
  const [messages, setMessages] = useState(() => [{
    role: 'bot',
    text: presetGecko
      ? `${presetGecko.name} 이야기 들려주세요 🦎\n"12그램" · "크순이랑 메이팅" · "알 2개 산란" · "모프는 초초야"처럼 편하게 말씀하시면 제가 알아서 정리할게요.\n궁금한 건 물어보셔도 돼요 — "생일 언제야?" · "최근 기록 보여줘"\n사진은 📷 버튼, 다 끝나면 "저장"이라고 해주세요.`
      : `안녕하세요! 오늘은 어떤 아이 이야기인가요? 🦎\n\n이름만 알려주셔도 되고, "크한이 12그램"처럼 한 번에 말씀하셔도 제가 알아서 그 아이 기록에 정리해둘게요.\n\n적어둔 걸 물어보셔도 돼요 🔍\n예) "크인이 생일 언제야?" · "크한이 최근 기록 보여줘" · "크범이 다음 산란 언제쯤?"`
  }]);
  const [pending, setPending] = useState([]);
  const [input, setInput] = useState('');
  const [phase, setPhase] = useState('chat');        // 'chat' | 'confirm'
  const [layingReminder, setLayingReminder] = useState(true);
  const fileRef = useRef(null);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, phase]);

  const addMsg = (m) => setMessages(ms => [...ms, m]);
  const bot = (text, chips) => addMsg({ role: 'bot', text, chips });
  const updatePending = (fn) => { pendingRef.current = fn(pendingRef.current); setPending(pendingRef.current); };

  const setTarget = (ind) => { geckoRef.current = ind; setGeckoName(ind ? ind.name : null); };

  /* ── 담기 + 요약 응답 ── */
  const pushPending = (fs, target, extraLine) => {
    if (!fs.length) return;
    updatePending(p => [...p, ...fs]);
    const lines = fs.map(f => '· ' + factLabel(f)).join('\n');
    const head = extraLine ? extraLine + '\n\n' : '';
    bot(`${head}${target.name} ${pickOpener()}\n${lines}\n\n계속 말씀하셔도 되고, 끝나면 저장을 눌러주세요.`, [
      { label: '💾 이제 저장할래', kind: 'save' },
    ]);
  };

  /* ── 담긴 기록의 주인 정정 ──
     대화 도중 다른 아이 얘기가 섞여도 그 기록만 옮길 수 있게 합니다. */
  const applyRetarget = (ind, scope) => {
    setTarget(ind);
    if (scope === 'switch') { bot(`네, 이제 ${ind.name} 얘기로 넘어갈게요 🦎`); return; }
    const cur = pendingRef.current;
    let idx = -1;
    if (scope === 'photo') {
      for (let i = cur.length - 1; i >= 0; i--) if (cur[i].type === 'photo') { idx = i; break; }
    }
    if (idx < 0) idx = cur.length - 1;
    if (idx < 0) { bot(`네, 이제 ${ind.name} 얘기로 할게요 🦎`); return; }
    const moved = cur[idx];
    updatePending(p => p.map((x, i) => i === idx ? { ...x, targetId: ind.id, targetName: ind.name } : x));
    bot(`알겠어요, 방금 "${factLabel(moved)}"은(는) ${ind.name} 기록으로 옮겼어요 ✅\n계속 말씀하세요.`, [
      { label: '💾 이제 저장할래', kind: 'save' },
    ]);
  };

  /* ── 모프 프로필 반영 ── */
  const applyMorph = (target, morph) => {
    DB.updateIndividual(target.id, { morph });
    refreshIndividuals();
    if (geckoRef.current && geckoRef.current.id === target.id) geckoRef.current = { ...geckoRef.current, morph };
    return `모프가 ${morph}군요! ✨ ${target.name} 프로필에 적어뒀어요.`;
  };

  /* ── 프로필 값 고치기 (부화일·성별·모프) ── */
  const applyFix = (t, field, from, to) => {
    const { moved } = commitProfileFix(t, field, from, to);
    refreshIndividuals();
    geckoRef.current = DB.getIndividuals().find(i => i.id === t.id) || { ...(geckoRef.current || t), [field]: to };
    if (field === 'hatchDate') {
      bot(`${t.name} 부화일을 ${fmtDate(to)}로 ${from ? '바꿨' : '적어뒀'}어요 🎂` +
        (moved > 1 ? `\n같이 나온 ${moved}마리와 부화 기록도 함께 옮겼어요.` : ''));
    } else {
      bot(`${t.name} ${PROFILE_LABEL[field]}을(를) ${profileText(field, to)}로 바꿨어요 ✅`);
    }
  };

  /* ── 새 개체 등록 ── */
  const doRegister = (name) => {
    if (isBadName(name)) { pendingNameRef.current = null; bot(BAD_NAME_MSG); return; }
    pendingNameRef.current = null;
    const detectedGender = heldGenderRef.current;
    heldGenderRef.current = null;
    const isExternal = heldExternalRef.current;
    heldExternalRef.current = false;
    const saved = DB.addIndividual({
      name, gender: detectedGender || 'unknown', morph: '', hatchDate: '', isFromCreGunseol: false,
      isExternal, sireId: null, damId: null,
      shareCode: Math.random().toString(36).slice(2, 8).toUpperCase(),
    });
    refreshIndividuals();
    setTarget(saved);
    // 주인 정정 대기 중이었다면(예: "사진은 밤울2호야" → 등록) 그 기록을 새 개체로 옮기고 끝냅니다
    if (pendingRetargetRef.current) {
      const scope = pendingRetargetRef.current.scope;
      pendingRetargetRef.current = null;
      bot(`🦎 ${name}, 우리 식구가 됐어요!`);
      applyRetarget(saved, scope);
      return;
    }
    let morphLine = '';
    if (heldMorphRef.current) {
      morphLine = '\n' + applyMorph(saved, heldMorphRef.current);
      heldMorphRef.current = null;
    }
    const extLine = isExternal ? '\n(외부 개체로 등록했어요 — 축양리스트엔 표시되지 않고, 혈통 연결에만 사용돼요)' : '';
    if (detectedGender) {
      bot(`🦎 ${name}, 우리 식구가 됐어요! 만나서 반가워요.${morphLine}\n${name}, ${genderLabel(detectedGender)}으로 기억할게요.${extLine} 이제 편하게 이야기해주세요 🙂`);
    } else {
      bot(`🦎 ${name}, 우리 식구가 됐어요! 만나서 반가워요.${morphLine}${extLine}\n성별을 알고 계시면 골라주세요. (나중에 말씀하셔도 돼요)`, [
        { label: '♀ 암컷', kind: 'gender', value: 'female' },
        { label: '♂ 수컷', kind: 'gender', value: 'male' },
        { label: '미구분이에요', kind: 'gender', value: 'unknown' },
      ]);
    }
    if (heldRef.current.length) {
      const flushed = heldRef.current.map(f => ({ ...f, targetId: saved.id, targetName: saved.name }));
      heldRef.current = [];
      pushPending(flushed, saved);
    }
  };

  /* ── 확인 화면 이동 ── */
  const goConfirm = () => {
    if (!pendingRef.current.length) {
      bot('아직 담긴 기록이 없어요. 먼저 기록할 내용을 말씀해주세요. 🙂');
      return;
    }
    setPhase('confirm');
  };

  /* ── 칩 버튼 처리 ── */
  const handleChip = (kind, value) => {
    if (kind === 'register-yes') {
      if (pendingNameRef.current) doRegister(pendingNameRef.current);
    } else if (kind === 'register-no') {
      pendingNameRef.current = null;
      heldRef.current = [];
      heldMorphRef.current = null;
      heldGenderRef.current = null;
      heldExternalRef.current = false;
      bot('알겠습니다. 등록하려는 아이 이름을 다시 알려주세요. 🦎');
    } else if (kind === 'gender') {
      const g = geckoRef.current;
      if (!g) return;
      DB.updateIndividual(g.id, { gender: value });
      refreshIndividuals();
      geckoRef.current = { ...g, gender: value };
      bot(`${g.name}, ${genderLabel(value)}으로 기억할게요. 이제 편하게 이야기해주세요 🙂`);
    } else if (kind === 'save') {
      goConfirm();
    } else if (kind === 'feed-type' && value) {
      const f = { ...value.fact, data: { ...value.fact.data, foodType: value.foodType } };
      pushPending([f], { name: f.targetName });
    } else if (kind === 'memo-save' && value) {
      pushPending([{ type: 'memo', data: { notes: value.text }, date: value.date, targetId: value.targetId, targetName: value.targetName }], { name: value.targetName });
    } else if (kind === 'register-partner' && value) {
      if (isBadName(value.name)) { bot(BAD_NAME_MSG); return; }
      const existing = DB.getIndividuals().find(i => i.name === value.name);
      const partner = existing || DB.addIndividual({
        name: value.name, gender: 'unknown', morph: '', hatchDate: '', isFromCreGunseol: false,
        isExternal: false, sireId: null, damId: null,
        shareCode: Math.random().toString(36).slice(2, 8).toUpperCase(),
      });
      refreshIndividuals();
      // 담긴 메이팅 기록에 파트너 연결
      updatePending(p => p.map(f => (f.type === 'mating' && f.data && f.data.partnerName === value.name && !f.data.partnerId)
        ? { ...f, data: { ...f.data, partnerId: partner.id } } : f));
      bot(`🦎 ${value.name}, 등록하고 파트너로 연결해뒀어요! 저장하면 혈통에도 반영돼요.`);
    } else if (kind === 'fix' && value) {
      const t = DB.getIndividuals().find(i => i.id === value.targetId);
      if (t) applyFix(t, value.field, value.from, value.to);
    } else if (kind === 'fix-no' && value) {
      bot(`네, ${PROFILE_LABEL[value.field]}은(는) ${profileText(value.field, value.from)} 그대로 둘게요 🙂`);
    } else if (kind === 'memo-skip') {
      bot('네, 기록 없이 넘어갈게요 🙂 다른 이야기 들려주세요.');
    }
  };

  /* ── 문장 해석 본체 ── */
  const process = (text) => {
    // 1) 새 이름 등록 확인에 글로 답한 경우
    if (pendingNameRef.current) {
      if (/^(응|네|넵|예|어|그래|맞아|등록|ㅇㅇ|ㅇ)/.test(text)) { doRegister(pendingNameRef.current); return; }
      if (/^(아니|노|취소|ㄴㄴ|ㄴ)/.test(text)) {
        pendingNameRef.current = null; pendingRetargetRef.current = null; heldRef.current = []; heldMorphRef.current = null; heldGenderRef.current = null; heldExternalRef.current = false;
        bot('알겠습니다. 등록하려는 아이 이름을 다시 알려주세요. 🦎');
        return;
      }
      pendingNameRef.current = null; // 다른 문장이면 새로 해석
    }

    // 2) 저장 의도
    if (/(저장|기록해\s*줘|끝|완료|됐어)/.test(text) && text.replace(/\s/g, '').length <= 8) {
      goConfirm();
      return;
    }

    // 2.5) 해칭 베이비 이름 답변 대기 중
    if (pendingBabyRef.current) {
      const hf = pendingBabyRef.current;
      pendingBabyRef.current = null;
      if (!/자동|아무|몰라|나중|알아서/.test(text)) {
        const babyNames = text.split(/[,，]/).map(s => s.trim()).filter(Boolean);
        if (babyNames.some(isBadName)) { pendingBabyRef.current = hf; bot(BAD_NAME_MSG); return; }
        if (babyNames.length) {
          hf.data.babyNames = babyNames;
          bot(`좋아요! ${babyNames.join(', ')} — 저장할 때 이 이름으로 등록할게요 🐣`);
          return;
        }
      }
      bot('네, 자동 이름으로 등록할게요 🙂 계속 말씀해주세요.');
      return;
    }

    // 2.9) 주인 정정 / 대상 전환 — "사진은 밤울2호야", "이건 크순이 거야", "이제 크순이 얘기할게"
    const rt = extractRetarget(text);
    if (rt) {
      const all = DB.getIndividuals();
      const strip = s => (s || '').replace(/이$/, '');
      const found = all.find(i => i.name === rt.name) || all.find(i => strip(i.name) === strip(rt.name));
      if (found) { applyRetarget(found, rt.scope); return; }
      if (isBadName(rt.name)) { bot(BAD_NAME_MSG); return; }
      pendingRetargetRef.current = rt;
      pendingNameRef.current = rt.name;
      bot(`"${rt.name}"(은)는 처음 보는 이름이네요. 새로 등록하고 그 기록을 옮길까요?`, [
        { label: '🦎 네, 등록해주세요', kind: 'register-yes' },
        { label: '아니요, 다시 입력할게요', kind: 'register-no' },
      ]);
      return;
    }

    // 3) 해석
    const inds = DB.getIndividuals();
    const names = findNamesInText(text, inds);
    const facts = extractFacts(text);
    const morph = extractMorph(text);
    const date = parseKDate(text);

    let target = geckoRef.current;
    if (names.length) { target = names[0]; setTarget(names[0]); }

    // 메이팅 파트너: 등록 개체 → "상대/파트너 ○○" → 문장 속 다른 이름(미등록 포함)
    const mating = facts.find(f => f.type === 'mating');
    let unregPartner = null;                            // 미등록 파트너 이름 (등록 유도용)
    if (mating) {
      const partner = names.find(n => target && n.id !== target.id);
      if (partner) { mating.data.partnerId = partner.id; mating.data.partnerName = partner.name; }
      else {
        const pm = text.match(/(?:상대|파트너)(?:는|은)?\s*([가-힣A-Za-z0-9]+)/);
        if (pm) {
          const pn = pm[1].replace(/(이랑|랑|이야|이고|이에요|예요|야|고|임)$/, '');
          mating.data.partnerName = pn; unregPartner = pn;
        } else {
          const others = extractPartnerNames(text, target ? target.name : '');
          if (others.length) { mating.data.partnerName = others[0]; unregPartner = others[0]; }
        }
      }
    }

    // 3.4) "이름은/이름이 ○○야" 명시 선언 → 최우선 인식
    const decl = !names.length ? extractNameDecl(text) : null;
    if (decl) {
      if (isBadName(decl)) { bot(BAD_NAME_MSG); return; }
      const existing = inds.find(i => i.name === decl);
      if (existing) { setTarget(existing); target = existing; }
    }

    /* 3.45) 물어보는 말이면 기록에서 먼저 답을 찾습니다.
       이 검사를 새 이름 감지보다 먼저 두는 이유:
       "다음 산란 언제쯤?" 같은 질문의 "다음"을 새 개체 이름으로 오해하는 걸 막기 위해서입니다. */
    if (target) {
      const qa0 = answerQuery(target, text);
      if (qa0) { bot(qa0); return; }
    }

    // 3.5) 새 주체(미등록) 감지 — 보수적으로:
    //  - 문장에서 기존 개체명을 찾았으면 새 등록을 묻지 않음
    //  - 단독 이름이거나, 기록할 내용(무게·모프·성별 등)이 함께 있을 때만 등록 확인
    //  - 물음표로 끝나는 질문은 이름 선언이 아니므로 등록을 묻지 않음
    let newSubject = null;
    const looksLikeQuestion = QUESTION_RE.test(text);
    if (decl && !inds.some(i => i.name === decl)) {
      newSubject = decl;
    } else if (!names.length && !looksLikeQuestion) {
      const singleWord = text.trim().split(/\s+/).length === 1;
      const genderAssert = /(수컷|암컷)(?:이야|이에요|입니다|임|이래|같아|이다)/.test(text);
      const c = guessNewName(text, inds);
      if (c && isBadName(c) && (singleWord || facts.length || morph || genderAssert)) {
        bot(BAD_NAME_MSG);
        return;
      }
      if (!target) {
        if (c && (singleWord || facts.length || morph || genderAssert)) newSubject = c;
      } else if (!mating) {
        if (c && c !== target.name && (facts.length || morph || genderAssert)) newSubject = c;
      }
    }

    // 4) 새 개체 등록 플로우
    if (newSubject) {
      pendingNameRef.current = newSubject;
      heldRef.current = [...heldRef.current, ...facts.map(f => ({ ...f, date }))];
      if (morph) heldMorphRef.current = morph;
      // 성별 미리 캡처 (메이팅 문장 제외)
      if (!mating) {
        const gm = text.match(/(수컷|암컷)(?:이야|이에요|입니다|임|이래|같아|이다)/);
        if (gm) heldGenderRef.current = gm[1] === '수컷' ? 'male' : 'female';
      }
      // 외부 개체 캡처: "마인이 외부 개체야"
      if (/외부/.test(text)) heldExternalRef.current = true;
      bot(`"${newSubject}"(은)는 처음 보는 이름이네요. 새 개체로 등록할까요?`, [
        { label: '🦎 네, 등록해주세요', kind: 'register-yes' },
        { label: '아니요, 다시 입력할게요', kind: 'register-no' },
      ]);
      return;
    }
    if (!target) {
      bot('등록하려는 아이가 누구인가요? 이름을 알려주세요. 🦎');
      return;
    }

    // 5) 보류돼 있던 기록(사진 등)에 대상 확정
    if (heldRef.current.length) {
      const flushed = heldRef.current.map(f => ({ ...f, targetId: target.id, targetName: target.name }));
      heldRef.current = [];
      pushPending(flushed, target);
    }

    // (질문 답변은 3.45에서 이미 처리했습니다 — 보류 기록이 대상에 붙은 뒤 한 번 더 확인)
    const qa = answerQuery(target, text);
    if (qa) { bot(qa); return; }

    /* 5.54) 이미 적힌 값과 다른 정보가 들어온 경우 — 말없이 덮어쓰지 않고 여쭤봅니다.
       "고쳐줘"라는 말이 없어도 됩니다. 값이 같거나 아직 비어 있으면 평소대로 흘려보냅니다. */
    {
      const cur = DB.getIndividuals().find(i => i.id === target.id) || target;
      const plan = planProfileFix(cur, text, DB.getIndividuals(), morph);
      if (plan && plan.kind === 'future') {
        bot(`${fmtDate(plan.value)}은 아직 오지 않은 날짜예요 🙂 다시 알려주시겠어요?`);
        return;
      }
      if (plan && plan.kind === 'nameBad') {
        bot(`${plan.reason} 🙂 다른 이름으로 알려주시겠어요?`);
        return;
      }
      if (plan && plan.kind === 'apply') { applyFix(cur, plan.field, plan.from, plan.to); return; }
      if (plan && plan.kind === 'ask') {
        bot(`잠깐만요 — 지금 ${cur.name}의 ${PROFILE_LABEL[plan.field]}은(는) ` +
          `${profileText(plan.field, plan.from)}로 적혀 있어요.\n` +
          `${profileText(plan.field, plan.to)}로 고칠까요?` +
          (plan.sibs > 1 ? `\n(고치면 같이 나온 ${plan.sibs}마리와 부화 기록도 함께 옮겨져요)` : ''), [
            { label: `✅ ${profileText(plan.field, plan.to)}가 맞아요`, kind: 'fix',
              value: { field: plan.field, from: plan.from, to: plan.to, targetId: cur.id } },
            { label: `아니요, ${profileText(plan.field, plan.from)} 그대로`, kind: 'fix-no',
              value: { field: plan.field, from: plan.from } },
          ]);
        return;
      }
    }

    // 5.55) 혈통
    const sireM = text.match(/(?:아빠|아비)(?:는|가|:)?\s*([가-힣A-Za-z0-9]+)/);
    const damM = text.match(/(?:엄마|어미)(?:는|가|:)?\s*([가-힣A-Za-z0-9]+)/);
    if (sireM || damM) {
      const clean = w => (w || '').replace(/(이에요|입니다|이야|이고|예요|이다|야|고|임)$/, '');
      const sw = clean(sireM && sireM[1]);
      const dw = clean(damM && damM[1]);
      // 부/모로 언급된 이름을 제외한 나머지를 혈통 대상(주체)으로 재결정
      // (예: "크범이 아들 크범5호 어미는 크범이야" → 크범이가 앞에 나와도 대상은 크범5호)
      const parentNames = [sw, dw].filter(Boolean);
      const subjectCandidates = names.filter(n => !parentNames.includes(n.name));
      if (subjectCandidates.length) { target = subjectCandidates[0]; setTarget(subjectCandidates[0]); }
      if (/누구|뭐|몰라/.test(sw + dw)) {
        const fresh0 = DB.getIndividuals();
        const sire = fresh0.find(i => i.id === target.sireId);
        const dam = fresh0.find(i => i.id === target.damId);
        bot(`${target.name}의 혈통이에요 🧬\n부(아빠): ${sire ? sire.name : '미등록'}\n모(엄마): ${dam ? dam.name : '미등록'}`);
        return;
      }
      const lines = [];
      const fresh = DB.getIndividuals();
      if (sw) {
        const p = fresh.find(i => i.name === sw);
        if (p) { DB.updateIndividual(target.id, { sireId: p.id }); lines.push(`부(아빠) ${p.name} 🧬 연결 완료`); }
        else lines.push(`"${sw}"는 아직 미등록이에요. 먼저 등록해주시면 연결해드릴게요.`);
      }
      if (dw) {
        const p = fresh.find(i => i.name === dw);
        if (p) { DB.updateIndividual(target.id, { damId: p.id }); lines.push(`모(엄마) ${p.name} 🧬 연결 완료`); }
        else lines.push(`"${dw}"는 아직 미등록이에요. 먼저 등록해주시면 연결해드릴게요.`);
      }
      refreshIndividuals();
      geckoRef.current = DB.getIndividuals().find(i => i.id === target.id) || target;
      bot(`${target.name} 혈통 정보예요.\n${lines.join('\n')}\n프로필에서 가계도로 확인할 수 있어요.`);
      return;
    }

    // 5.56) 분양 상태 변경
    if (/분양\s*가능/.test(text)) {
      const pm2 = text.match(/(\d+(?:\.\d+)?)\s*만\s*원?/);
      const patch = { status: 'available' };
      if (pm2) patch.salePrice = String(Math.round(parseFloat(pm2[1]) * 10000));
      DB.updateIndividual(target.id, patch);
      refreshIndividuals();
      bot(`${target.name}, 분양가능으로 올려뒀어요 🏷️${patch.salePrice ? ` · ${Number(patch.salePrice).toLocaleString()}원` : ''}\n홈의 분양가능 필터에서 볼 수 있어요.`);
      return;
    }
    if (/예약(?:됐|중|으로|잡혔)/.test(text) && /분양|예약/.test(text) && !/병원|부화|해칭/.test(text)) {
      DB.updateIndividual(target.id, { status: 'reserved' });
      refreshIndividuals();
      bot(`${target.name}, 예약중으로 바꿔뒀어요 📌`);
      return;
    }
    if (/분양\s*(취소|내려|중단)|보유(중)?으?로/.test(text)) {
      DB.updateIndividual(target.id, { status: 'own' });
      refreshIndividuals();
      bot(`${target.name}, 다시 보유중으로 돌려뒀어요 🏠`);
      return;
    }

    if (/((할까|좋을까|될까|괜찮을까)(요)?\s*[?？]?\s*$)|추천해|추천\s*좀/.test(text)) {
      bot(`좋은 질문이에요! 다만 지금 제 머리는 기록 정리 전용이라, 판단이 필요한 상담은 아직 어려워요 🙏\n(적어둔 기록은 얼마든지 찾아드려요 — "${target.name} 기록 보여줘"처럼요)\n이 내용을 ${target.name} 메모로 남겨둘까요?`, [
        { label: '📝 메모로 남기기', kind: 'memo-save', value: { text, date, targetId: target.id, targetName: target.name } },
        { label: '괜찮아요', kind: 'memo-skip' },
      ]);
      return;
    }

    // 6) 모프 → 프로필에 즉시 반영
    let morphLine = null;
    if (morph) morphLine = applyMorph(target, morph);

    // 7) 성별 언급 → 프로필 반영 ("수컷이야" 등 단정 표현만, 메이팅 문장 제외)
    let genderPhrase = null;
    if (!mating) {
      const gm = text.match(/(수컷|암컷)(?:이야|이에요|입니다|임|이래|같아|이다)/);
      if (gm) {
        genderPhrase = gm[0];
        const gv = gm[1] === '수컷' ? 'male' : 'female';
        DB.updateIndividual(target.id, { gender: gv });
        refreshIndividuals();
        geckoRef.current = { ...geckoRef.current, gender: gv };
        morphLine = (morphLine ? morphLine + '\n' : '') + `${target.name}, ${genderLabel(gv)}으로 기억할게요.`;
      }
    }

    // 8) 기록 분배
    if (!facts.length) {
      const leftover = text
        .replace(new RegExp(escapeReg(target.name), 'g'), '')
        .replace(morph ? new RegExp('모프(는|가)?\\s*' + escapeReg(morph) + '(야|이야|이에요|예요|입니다|임)?', 'g') : /$^/, '')
        .replace(genderPhrase ? new RegExp(escapeReg(genderPhrase), 'g') : /$^/, '')
        .replace(/[\s,.!?~은는이가도야]/g, '');

      if (leftover.length < 2) {
        // 이름/모프만 말한 경우
        if (morphLine) {
          bot(`${morphLine}\n다른 이야기도 들려주세요. 몸무게·메이팅·산란·탈피·사진 뭐든 좋아요 🙂`);
        } else {
          bot(`${target.name}(이)군요! 오늘은 어떤 이야기인가요?\n\n예) "12그램" · "크순이랑 메이팅" · "알 2개 산란" · "모프는 초초야" · 📷 사진\n그냥 오늘 있었던 일을 편하게 적어주셔도 메모로 남겨둬요.`);
        }
        return;
      }

      // 질문형 문장 → 먼저 기록에서 답을 찾아 읽어주고, 그래도 모르면 메모 여부를 여쭤봅니다
      if (QUESTION_RE.test(text) && !HEALTH_RE.test(text)) {
        const fresh = DB.getIndividuals().find(i => i.id === target.id) || target;
        bot(`${recordSummary(fresh)}\n\n혹시 찾으시던 내용이 아니면, 이 질문을 메모로 남겨둘까요?`, [
          { label: '📝 메모로 남기기', kind: 'memo-save', value: { text, date, targetId: target.id, targetName: target.name } },
          { label: '괜찮아요', kind: 'memo-skip' },
        ]);
        return;
      }

      // 감성/건강 메모 → 따뜻한 응답과 함께 담기
      const warm = memoReply(target.name, text);
      updatePending(p => [...p, { type: 'memo', data: { notes: text }, date, targetId: target.id, targetName: target.name }]);
      if (warm) {
        bot(`${morphLine ? morphLine + '\n' : ''}${warm}\n\n계속 말씀하셔도 되고, 끝나면 저장을 눌러주세요.`, [
          { label: '💾 이제 저장할래', kind: 'save' },
        ]);
      } else {
        bot(`${morphLine ? morphLine + '\n' : ''}${target.name} ${pickOpener()}\n· ${factLabel({ type: 'memo', data: { notes: text } })}\n\n계속 말씀하셔도 되고, 끝나면 저장을 눌러주세요.`, [
          { label: '💾 이제 저장할래', kind: 'save' },
        ]);
      }
      return;
    }

    const withTarget = f => ({ ...f, date, targetId: target.id, targetName: target.name });
    const unknownFeed = facts.find(f => f.type === 'feeding' && !f.data.foodType);
    if (unknownFeed) {
      const rest = facts.filter(f => f !== unknownFeed);
      if (rest.length) pushPending(rest.map(withTarget), target, morphLine);
      else if (morphLine) bot(morphLine);
      const feedFact = withTarget(unknownFeed);
      bot(`${target.name} 밥 먹었군요! 🍽️ 어떤 먹이였나요?`, [
        { label: '🦗 충식 (귀뚜라미 등)', kind: 'feed-type', value: { fact: feedFact, foodType: '충식' } },
        { label: '🥣 슈퍼푸드 (슈푸)', kind: 'feed-type', value: { fact: feedFact, foodType: '슈푸' } },
        { label: '그냥 저장할게요', kind: 'feed-type', value: { fact: feedFact, foodType: '' } },
      ]);
      return;
    }

    const mapped = facts.map(withTarget);
    pushPending(mapped, target, morphLine);

    // 미등록 파트너 → 새 개체로 등록해 혈통 연결 유도
    if (unregPartner && !inds.some(i => i.name === unregPartner)) {
      bot(`파트너 "${unregPartner}"도 새로 등록해서 혈통에 연결해둘까요? 🧬`, [
        { label: `🦎 ${unregPartner} 등록`, kind: 'register-partner', value: { name: unregPartner } },
        { label: '아니요, 이름만 남길게요', kind: 'memo-skip' },
      ]);
    }

    const hf = mapped.find(f => f.type === 'hatching');
    if (hf && (DB.getSettings().babyNaming || 'combo') === 'ask') {
      pendingBabyRef.current = hf;
      bot(`아기들 이름을 지어줄까요? 쉼표로 알려주세요 🐣\n예) 순한1호, 순한2호\n"자동으로"라고 하시면 제가 규칙대로 지어둘게요.`);
    }
  };

  const send = () => {
    const text = input.trim();
    if (!text) return;
    addMsg({ role: 'user', text });
    setInput('');
    setTimeout(() => process(text), 120);
  };

  /* ── 사진 첨부 ── */
  const onPhotoPick = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    compressImage(file, (dataUrl) => {
      addMsg({ role: 'user', photo: dataUrl });
      const g = geckoRef.current;
      const fact = { type: 'photo', data: { photo: dataUrl }, date: todayStr() };
      if (g) pushPending([{ ...fact, targetId: g.id, targetName: g.name }], g);
      else {
        heldRef.current.push(fact);
        bot('예쁜 사진이네요! 담아뒀어요. 어느 아이의 사진인가요? 🦎');
      }
    });
  };

  /* ── 최종 저장 ── */
  const doSave = () => {
    const list = pendingRef.current;
    if (!list.length) { setPhase('chat'); return; }
    let reminderMsg = '';
    let babyMsg = '';
    list.forEach(f => {
      if (f.type === 'laying' && !f.data.sireId) {
        const mate = DB.getEventsFor(f.targetId)
          .filter(e => e.type === 'mating' && e.date <= (f.date || todayStr()) && e.data && e.data.partnerId)
          .sort((a, b) => b.date > a.date ? 1 : -1)[0];
        if (mate) { f.data.sireId = mate.data.partnerId; f.data.sireName = mate.data.partnerName; }
      }
      // 예정일 대비 실제일 차이 기록 — 산란은 저장된 예정 알림, 해칭은 그 알의 계산된 예정일과 비교
      if (f.type === 'laying') {
        const exp = matchExpectedReminder(f.targetId, 'laying_expected', f.date || todayStr());
        if (exp) {
          f.data.expectedDate = exp.date;
          f.data.diffDays = Math.round((new Date(f.date || todayStr()) - new Date(exp.date)) / 86400000);
          DB.saveReminders(DB.getReminders().filter(r => r.id !== exp.id)); // 예정 완료 → 제거
        }
      }
      if (f.type === 'hatching') {
        const actual = f.date || todayStr();
        const cand = clutchRows().filter(c => c.e.individualId === f.targetId && !c.hatched && !c.infertile)
          .sort((a, b) => Math.abs(new Date(a.etaISO) - new Date(actual)) - Math.abs(new Date(b.etaISO) - new Date(actual)))[0];
        if (cand) {
          f.data.layingId = cand.e.id;
          f.data.expectedDate = cand.etaISO;
          f.data.diffDays = Math.round((new Date(actual) - new Date(cand.etaISO)) / 86400000);
        }
      }
      // 급여·탈피처럼 하루에 한 번이면 충분한 기록은 같은 날 두 번 쌓지 않고 바꿔 끼웁니다
      // (자정 넘겨 체크한 뒤 "어제 먹였어"라고 다시 말하면 두 개가 남던 문제)
      const fDate = f.date || todayStr();
      if (ONE_PER_DAY.includes(f.type)) {
        const dup = DB.getEvents().find(e => e.individualId === f.targetId && e.type === f.type && e.date === fDate);
        if (dup) DB.deleteEvent(dup.id);
      }
      DB.addEvent({ individualId: f.targetId, type: f.type, date: fDate, data: f.data || {} });

      // 메이팅 → 산란 예정 알림 자동 생성 (암컷 기준)
      if (f.type === 'mating') {
        const all = DB.getIndividuals();
        const t = all.find(i => i.id === f.targetId);
        const p = f.data.partnerId ? all.find(i => i.id === f.data.partnerId) : null;
        const fem = (t && t.gender === 'female') ? t : (p && p.gender === 'female') ? p : t;
        if (fem) {
          const d = new Date(f.date || todayStr());
          d.setDate(d.getDate() + LAYING_AFTER_MATING);
          const dISO = localISO(d);
          const rs = DB.getReminders();
          if (!rs.some(r => r.individualId === fem.id && r.type === 'laying_expected' && r.date === dISO)) {
            rs.push({ id: uuid(), individualId: fem.id, geckoName: fem.name, type: 'laying_expected', date: dISO, message: `${fem.name} 산란 예정일` });
            DB.saveReminders(rs);
            reminderMsg = ' · 🔔 산란 예정 알림 설정';
          }
        }
      }
      if (f.type === 'distribution') {
        // 대화로 분양을 적어도 KEEP은 함께 풀립니다 (한 아이가 KEEP이면서 분양완료일 수는 없으므로)
        DB.updateIndividual(f.targetId, { status: 'sold', keep: false, salePrice: f.data.price || '' });
      }
      if (f.type === 'hatching') {
        const mode = DB.getSettings().babyNaming || 'combo';
        const named = f.data.babyNames && f.data.babyNames.length ? f.data.babyNames : null;
        const count = parseInt(f.data.count || '0', 10) || (named ? named.length : 0);
        if (count > 0 && mode !== 'off') {
          const all = DB.getIndividuals();
          const mom = all.find(i => i.id === f.targetId);
          const evs2 = DB.getEventsFor(f.targetId).sort((a, b) => b.date > a.date ? 1 : -1);
          const lay = evs2.find(e => e.type === 'laying' && e.data && e.data.sireId);
          const mate2 = evs2.find(e => e.type === 'mating' && e.data && e.data.partnerId);
          const dadId = (lay && lay.data.sireId) || (mate2 && mate2.data.partnerId) || null;
          const dad = all.find(i => i.id === dadId) || null;
          const names = named || makeBabyNames(mom ? mom.name : '', dad ? dad.name : '', count, all.map(i => i.name));
          names.slice(0, count).forEach(nm => {
            DB.addIndividual({
              name: nm, gender: 'unknown', morph: '', hatchDate: f.date || todayStr(),
              isFromCreGunseol: true, status: 'own',
              sireId: dadId, damId: f.targetId,
              shareCode: Math.random().toString(36).slice(2, 8).toUpperCase(),
            });
          });
          babyMsg = ` · 🐣 베이비 ${Math.min(count, names.length)}마리 등록`;
        }
      }
      // 부화 예정 알림은 따로 저장하지 않습니다.
      // 산란 기록만 있으면 알림·캘린더가 "지금 인큐 온도"로 매번 다시 계산합니다(온도 바꾸면 전부 따라 바뀜).
      if (f.type === 'laying' && layingReminder) {
        reminderMsg = ' · 🔔 부화 예정 알림 자동';
      }
    });
    refreshIndividuals();
    showToast(`✅ ${list.length}건 저장 완료!${reminderMsg}${babyMsg}`);
    navigate('home');
  };

  const removePending = (f) => updatePending(p => p.filter(x => x !== f));
  // 담긴 기록의 주인 바꾸기 — 대화 중에 다른 아이 얘기가 섞였을 때 저장 전에 바로잡습니다
  const [retarget, setRetarget] = useState(null);
  const retargetTo = (f, indId) => {
    const ind = DB.getIndividuals().find(i => i.id === indId);
    if (!ind) return;
    updatePending(p => p.map(x => x === f ? { ...x, targetId: ind.id, targetName: ind.name } : x));
    setRetarget(null);
    showToast(`🦎 ${ind.name}(으)로 옮겼어요`);
  };

  // 확인 화면: 개체별 그룹
  const grouped = {};
  pending.forEach(f => { (grouped[f.targetName] = grouped[f.targetName] || []).push(f); });

  return (
    <div style={{display:'flex', flexDirection:'column', flex:1, minHeight:0}}>
      <div className="header">
        <div className="header-row">
          <button className="back-btn" onClick={() => navigate('home')}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
            홈
          </button>
          <span style={{fontSize:14, color:'var(--text3)'}}>
            {geckoName ? `🦎 ${geckoName}` : '✨ 무엇이든 기록'}
          </span>
        </div>
      </div>

      {phase === 'chat' && (
        <>
          <div className="chat-wrap" style={{flex:1, overflowY:'auto'}}>
            {messages.map((m, i) => (
              <div key={i} style={{display:'flex', flexDirection:'column', gap:6}}>
                {m.role === 'bot' ? (
                  <>
                    <div className="chat-q">{m.text}</div>
                    {m.chips && (
                      <div className="chip-row" style={{marginTop:0}}>
                        {m.chips.map((c, j) => (
                          <button key={j} className="chip-btn" onClick={() => handleChip(c.kind, c.value)}>{c.label}</button>
                        ))}
                      </div>
                    )}
                  </>
                ) : m.photo ? (
                  <img src={m.photo} alt="첨부 사진" style={{alignSelf:'flex-end', maxWidth:160, borderRadius:12, border:'1px solid var(--accent-dim)'}} />
                ) : (
                  <div className="chat-a">{m.text}</div>
                )}
              </div>
            ))}
            <div ref={endRef} />
          </div>

          {pending.length > 0 && (
            <div className="pending-bar" onClick={goConfirm}>
              <span className="badge badge-green">📥 담긴 기록 {pending.length}건 — 눌러서 저장하기</span>
            </div>
          )}

          <div style={{padding:'10px 16px', paddingBottom:'calc(12px + var(--safe-bottom))', borderTop:'1px solid var(--border)', background:'var(--bg2)', display:'flex', gap:8}}>
            <button className="send-btn" style={{background:'var(--card)', color:'var(--text2)', border:'1px solid var(--border)'}} onClick={() => fileRef.current && fileRef.current.click()}>📷</button>
            <textarea
              className="input"
              rows={1}
              style={{flex:1, minHeight:0, height:46, resize:'none', lineHeight:'20px', paddingTop:12, paddingBottom:12, overflow:'hidden'}}
              placeholder='예: 크한이 12그램 / 저장'
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
              name="cgChat"
              enterKeyHint="send"
              autoComplete="off"
              autoCorrect="off"
              spellCheck={false}
            />
            <button className="send-btn" onClick={send}>→</button>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={onPhotoPick} />
          </div>
        </>
      )}

      {phase === 'confirm' && (
        <div style={{padding:16, flex:1, overflowY:'auto'}}>
          <div style={{fontSize:17, fontWeight:700, marginBottom:14}}>💾 이렇게 저장할까요?</div>

          {Object.entries(grouped).map(([name, fs]) => (
            <div className="card" key={name} style={{margin:'0 0 12px'}}>
              <div style={{fontSize:15, fontWeight:700, marginBottom:4}}>🦎 {name}</div>
              <div className="confirm-list">
                {fs.map((f, i) => (
                  <div key={i}>
                    <div className="confirm-row">
                      <span className="confirm-key">{factLabel(f)}</span>
                      <span className="confirm-val">
                        {fmtDate(f.date)}
                        <button title="주인 바꾸기" onClick={() => setRetarget(retarget === f ? null : f)}
                          style={{background:'none', border:'none', color: retarget === f ? 'var(--accent2)' : 'var(--text3)', cursor:'pointer', fontSize:14}}>🦎</button>
                        <button onClick={() => removePending(f)} style={{background:'none', border:'none', color:'var(--text3)', cursor:'pointer', fontSize:15}}>✕</button>
                      </span>
                    </div>
                    {retarget === f && (
                      <div style={{padding:'4px 0 10px'}}>
                        <div style={{fontSize:11, color:'var(--text3)', marginBottom:4}}>이 기록의 주인을 누구로 할까요?</div>
                        <select className="input" style={{padding:'8px 10px', fontSize:13}}
                          value={f.targetId || ''} onChange={e => retargetTo(f, e.target.value)}>
                          {DB.getIndividuals().map(g => (
                            <option key={g.id} value={g.id}>{g.name}{g.morph ? ` (${g.morph})` : ''}</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))}

          {pending.some(f => f.type === 'laying') && (
            <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--text2)', margin:'0 4px 14px', cursor:'pointer'}}>
              <input type="checkbox" checked={layingReminder} onChange={e => setLayingReminder(e.target.checked)} />
              🔔 부화 예정 알림 자동 설정 (산란일 +75일)
            </label>
          )}

          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            <button className="btn btn-primary" onClick={doSave}>✅ 기록마무리하기 ({pending.length}건)</button>
            <button className="btn btn-secondary" onClick={() => setPhase('chat')}>← 더 기록하기</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   개체 프로필
   ══════════════════════════════════════════ */
function ProfileScreen({ gecko: initialGecko, navigate, showToast, refreshIndividuals, individuals }) {
  const [gecko, setGecko] = useState(() => DB.getIndividuals().find(i => i.id === initialGecko.id) || initialGecko);
  const [events, setEvents] = useState(() => DB.getEventsFor(initialGecko.id));
  const [showShare, setShowShare] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editVals, setEditVals] = useState({});
  const [confirmDelEvent, setConfirmDelEvent] = useState(null);
  const [photoView, setPhotoView] = useState(null); // {src, date}
  const [salePrompt, setSalePrompt] = useState(false);   // 분양가 물어보기
  const [keepAsk, setKeepAsk] = useState(null);          // KEEP인데 분양 상태로 바꾸려 할 때
  const [nameEdit, setNameEdit] = useState(false);       // 이름 수정
  const [nameVal, setNameVal] = useState('');
  const eventPhotoRef = useRef(null);
  const avatarFileRef = useRef(null);

  // 프로필 원형 사진 탭 → 대표사진 지정 (사진 기록으로도 남겨서 나중에 다시 고를 수 있게)
  const onAvatarPick = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    compressImage(file, (src) => {
      DB.addEvent({ individualId: gecko.id, type: 'photo', date: todayStr(), data: { photo: src } });
      DB.updateIndividual(gecko.id, { avatar: src });
      refreshLocal();
      showToast('📷 대표사진을 바꿨어요');
    });
  };

  const onEventPhoto = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    compressImage(file, (url) => setEditVals(v => ({ ...v, photo: url })));
  };

  const refreshLocal = () => {
    setGecko(DB.getIndividuals().find(i => i.id === gecko.id) || gecko);
    setEvents(DB.getEventsFor(gecko.id));
    refreshIndividuals();
  };

  // 이름 바꾸기 — 같은 이름이 이미 있으면 막습니다
  const saveName = () => {
    const chk = renameCheck(gecko.id, nameVal);
    if (!chk.ok) { setNameEdit(false); return showToast(chk.same ? '이름이 그대로예요' : '⚠️ ' + chk.reason); }
    DB.updateIndividual(gecko.id, { name: chk.to });
    setNameEdit(false); refreshLocal();
    showToast(`✏️ ${chk.from} → ${chk.to}`);
  };

  const handleDelete = () => {
    DB.deleteIndividual(gecko.id);
    refreshIndividuals();
    showToast('삭제 완료');
    navigate('home');
  };

  const lastWeight = events.filter(e => e.type === 'growth' && e.data?.weight).sort((a,b) => b.date > a.date ? 1 : -1)[0];
  const age = gecko.hatchDate ? Math.floor((Date.now() - new Date(gecko.hatchDate)) / (1000*60*60*24)) : null;

  return (
    <div className="screen">
      <div className="header">
        <div className="header-row">
          <button className="back-btn" onClick={() => { refreshIndividuals(); navigate('home'); }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
            목록
          </button>
          {SHOW_SHARE && (
            <button className="back-btn" onClick={() => setShowShare(s => !s)}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              공유
            </button>
          )}
        </div>
      </div>

      {/* 헤더 카드 */}
      <div style={{padding:'16px 16px 0'}}>
        <div className="card">
          <div style={{display:'flex', alignItems:'center', gap:14}}>
            {(() => { const av = avatarSrc(gecko); return (
              <button onClick={() => avatarFileRef.current && avatarFileRef.current.click()}
                title="사진 바꾸기"
                style={{width:64, height:64, borderRadius:'50%', flexShrink:0, border:'2px solid var(--border)', padding:0, cursor:'pointer',
                        background: av ? `url(${av}) center/cover` : 'var(--bg3)', position:'relative',
                        display:'flex', alignItems:'center', justifyContent:'center', fontSize:34}}>
                {av ? '' : genderEmoji(gecko.gender)}
                <span style={{position:'absolute', right:-2, bottom:-2, width:22, height:22, borderRadius:'50%',
                              background:'var(--accent)', color:'#fff', fontSize:11, lineHeight:'22px',
                              border:'2px solid var(--card)'}}>📷</span>
              </button>
            ); })()}
            <input ref={avatarFileRef} type="file" accept="image/*" capture={undefined}
              style={{display:'none'}} onChange={onAvatarPick} />
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                {nameEdit ? (
                  <div style={{display:'flex', gap:6, alignItems:'center', width:'100%'}}>
                    <input className="input" style={{padding:'8px 10px', fontSize:16, fontWeight:700}}
                      value={nameVal} autoFocus maxLength={20}
                      onChange={e => setNameVal(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') saveName(); }} />
                    <button className="btn btn-primary btn-sm" style={{width:'auto'}} onClick={saveName}>저장</button>
                    <button className="btn btn-secondary btn-sm" style={{width:'auto'}} onClick={() => setNameEdit(false)}>취소</button>
                  </div>
                ) : (
                  <>
                    <div style={{fontSize:22, fontWeight:800}}>{gecko.name} <GenderTag g={gecko.gender} size={20} /></div>
                    <button onClick={() => { setNameVal(gecko.name); setNameEdit(true); }} aria-label="이름 수정"
                      style={{background:'none', border:'none', cursor:'pointer', fontSize:15, lineHeight:1, padding:0, color:'var(--text3)'}}>✏️</button>
                  </>
                )}
                <button onClick={() => { DB.updateIndividual(gecko.id, { favorite: !gecko.favorite }); refreshLocal(); showToast(gecko.favorite ? '즐겨찾기 해제' : '⭐ 즐겨찾기 추가'); }}
                  aria-label="즐겨찾기" style={{background:'none', border:'none', cursor:'pointer', fontSize:22, lineHeight:1, padding:0, color: gecko.favorite ? 'var(--gold)' : 'var(--text3)'}}>
                  {gecko.favorite ? '⭐' : '☆'}
                </button>
                {/* KEEP — 내가 데리고 갈 아이. 켜면 분양 상태에서 빠집니다 */}
                <button className="badge badge-keep"
                  style={{cursor:'pointer', opacity: gecko.keep ? 1 : .4, filter: gecko.keep ? 'none' : 'grayscale(1)'}}
                  onClick={() => {
                    const on = !gecko.keep;
                    const p = DB.setKeep(gecko.id, on);
                    refreshLocal();
                    showToast(on
                      ? (p.status === 'own' ? 'KEEP · 분양 상태를 보유중으로 되돌렸어요' : 'KEEP 표시했어요')
                      : 'KEEP 해제');
                  }}>KEEP</button>
                {/* 우리 집에서 나온 아이 표시 — 눌러서 켜고 끕니다 */}
                <button className="badge badge-gold"
                  style={{cursor:'pointer', opacity: isCG(gecko) ? 1 : .4,
                          filter: isCG(gecko) ? 'none' : 'grayscale(1)'}}
                  onClick={() => {
                    const on = isCG(gecko);
                    DB.updateIndividual(gecko.id, on
                      ? { cgOff: true, isFromCreGunseol: false }
                      : { cgOff: false, isFromCreGunseol: true });
                    refreshLocal(); refreshIndividuals && refreshIndividuals();
                    showToast(on ? '크레건설 표시를 뗐어요' : '🏷️ 크레건설 출생으로 표시했어요');
                  }}>
                  {isCG(gecko) ? '크레건설' : '크레건설 아님'}
                </button>
              </div>
              <div style={{fontSize:13, color:'var(--text3)', marginTop:4}}>
                {genderLabel(gecko.gender)}
                {gecko.morph ? ` · ${gecko.morph}` : ''}
              </div>
              {gecko.hatchDate && (
                <div style={{fontSize:12, color:'var(--text3)', marginTop:2}}>
